meta_description: 12 天走进哈佛、MIT、耶鲁、斯坦福与硅谷：实验室实践、教授研讨、招生说明会，并为每位学员定制美本升学规划。
eyebrow: 名校深度研学
summary: 不是普通的校园参观。12 天深入哈佛、MIT、耶鲁、斯坦福与硅谷的实验室、课堂与企业，看清这些名校的真实模样，也找到属于自己的方向。
image: /images/uploads/photos/immersion-group.webp
image_alt: WinPlus 名校研学学员与导师
kicker: 不止于参观
card_text: 走进哈佛、MIT、耶鲁、斯坦福的实验室与课堂，与教授和在校生坦诚交流。
statement: 选择大学，不能只看宣传册。你需要亲自走进去。
statement_text: 名校深度研学带学生走出游客路线：参与实验室与团队实践，在课堂上向教授和导师学习，与在校生聊真实的校园生活，并直接聆听招生团队的介绍。在 WinPlus 导师全程陪伴下，学生将清楚知道哪种大学文化最适合自己，并带回一份通往梦校的个人规划。
