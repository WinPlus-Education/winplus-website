summary: WinPlus 学生连续第二年参加联合国妇女地位委员会会议，第 70 届会议聚焦妇女和女童诉诸司法。
statement: 连续第二年走进委员会，关注每一位妇女和女童的公正。
details: '联合国妇女地位委员会第 70 届会议于 2026 年 3 月 9 日至 19 日在纽约联合国总部举行，优先主题为确保和加强所有妇女和女童诉诸司法的机会，包括建立包容、公平的法律体系，消除歧视性的法律、政策和做法。


  继 CSW69 之后，WinPlus 学生再次参会，关注法律与公正议题的讨论，并与来自世界各地的代表、倡导者和青年领袖交流。


  *WinPlus 是独立教育机构，参与会议不代表联合国对 WinPlus 的认可。*'
