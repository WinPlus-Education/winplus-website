faq_title: 'Research & internships: your questions, answered'
faq:
- q: What will the student actually produce?
  a: 'Every program ends in a concrete piece of work: a research paper, a working prototype, a financial model, a policy brief or a film, depending on the program. Students present it in a final showcase,
    and it becomes the evidence behind their activity list, essays and interviews.'
- q: Who are the mentors?
  a: Working scientists, engineers and researchers whose careers include organizations such as NASA, Meta, Microsoft and leading research universities. Each program page names the mentor and their background.
    Organization names describe mentors' careers; programs are run by WinPlus.
- q: How is this different from an online course?
  a: 'A course teaches content to everyone. Our programs are small cohorts built around a real problem: students choose a question or product, meet their mentor live every week, and deliver work that is
    reviewed like professional work, not graded like homework.'
- q: 'Research or internship: which is right?'
  a: 'Research suits students who want to answer an original question and write it up; it is strongest for STEM, social science and policy majors. Internships suit students who want to build: a product,
    model or prototype, the way an industry team works. Both include a mentor, weekly deliverables and a final presentation.'
- q: Is a recommendation letter guaranteed?
  a: No, and that is why it matters. Mentors write letters for students who complete the program and do strong work. An earned letter from a mentor who saw the work first-hand carries far more weight than
    a certificate of attendance.
- q: Does the student need prior experience?
  a: Most programs are designed for motivated beginners and teach the tools in the first weeks. Advanced tracks list any coding or mathematics prerequisites under Eligibility on the program page.
- q: Can the work be published or entered in competitions?
  a: When a project is strong enough, mentors and WinPlus advisors recommend suitable student journals, conferences or competitions and support the submission. Publication depends on the work and the outlet,
    and is never promised in advance.
- q: When do programs run, and how much time do they take?
  a: Most run online for 6 to 8 weeks, mainly in summer (June to August), with selected cohorts in spring. Expect live sessions each week plus independent work; each program page lists its schedule and
    whether applications are open.
