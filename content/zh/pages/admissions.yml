summary_eyebrow: 我们的理念
summary_statement: "我们不把学生套进模板。先成就背景，再完成申请。"
summary_text: "大多数升学服务从 11 年级的文书开始，而我们从学生本人开始：性格、经历与兴趣。在此基础上制定多年规划，放大优势、有针对性地补足短板，并通过科研、实习和国际经历，让申请材料真实而有力。**美国升学是我们的核心业务**，涵盖美高、本科与研究生申请；英国、加拿大、澳洲申请同样用心指导。"

