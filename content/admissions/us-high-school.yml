system: Independent schools admit a community, not just a transcript. Interviews and campus visits weigh heavily, parents write their own statements, and most leading schools share a January deadline and
  a common March notification date.
challenges_intro: Families often underestimate how personal boarding school admissions are. Here is where we make the difference.
challenges:
- challenge: Rankings say little about fit
  title: Finding the right school
  text: We help families understand the real differences in academics, culture, size and support, and build a list where the student will thrive, not just be admitted.
- challenge: Young applicants, adult expectations
  title: Interviews and visits that feel natural
  text: Interview practice that builds real confidence, and campus-visit planning from our base near many of the leading New England schools.
- challenge: Many moving parts, one deadline
  title: One coordinated application
  text: SSAT or ISEE and English testing plans, student and parent statements, and teacher recommendations, all on one timeline.
