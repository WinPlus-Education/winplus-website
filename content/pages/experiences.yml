summary_eyebrow: Why it matters
summary_statement: Top universities admit people, not transcripts. They look for perspective, initiative and the confidence to lead.
summary_text: 'Our global experiences give students what can''t be learned from a screen: the feel of a lab at MIT, a candid conversation with a Harvard professor, the moment of addressing international delegates. Students come back with a clearer sense of their interests, the learning environments that suit them and where they want to go, and with experiences that become compelling material for their applications.'
