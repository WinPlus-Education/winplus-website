seo_title: Our Team | Harvard, MIT & Stanford Mentors and Advisors | WinPlus
meta_description: 'Meet WinPlus founders, advisors and mentors: MIT and Harvard professors, a former NASA astronaut, NASA scientists and Ivy League alumni interviewers.'
eyebrow: Our Team
title: The mentors behind every WinPlus student
intro: Professors, scientists, alumni interviewers and industry leaders from the world's top universities and companies, working directly with our students.
image: /images/uploads/photos/hbs-classroom.webp
