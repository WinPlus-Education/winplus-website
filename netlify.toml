  to = "/admissions/uk.html"
  status = 301
[[redirects]]
  from = "/zh/admissions/uk-canada-australia.html"
  to = "/zh/admissions/uk.html"
  status = 301
[[redirects]]
  from = "/admissions/grad-school-international.html"
  to = "/admissions/uk.html"
  status = 301
[[redirects]]
  from = "/zh/admissions/grad-school-international.html"
  to = "/zh/admissions/uk.html"
  status = 301
[[redirects]]
  from = "/admissions/grad-school-us.html"
  to = "/admissions/us-graduate.html"
  status = 301
[[redirects]]
  from = "/zh/admissions/grad-school-us.html"
  to = "/zh/admissions/us-graduate.html"
