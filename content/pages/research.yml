meta_description: Online research and internships for high schoolers in AI, finance, space, biotech, policy and film, led by mentors from NASA, Meta, Microsoft and Caltech.
eyebrow: Research & Internships
title: Real problems. Real mentors. Work that matters.
intro: Bespoke online research and internship programs led by scientists, engineers and leaders from NASA, Meta, Microsoft, Caltech and MIT. Students solve real-world problems and finish with work they
  can stand behind.
