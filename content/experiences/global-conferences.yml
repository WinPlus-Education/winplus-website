statement: Leadership isn't a line on a résumé. It's standing up in a room of global leaders with something worth saying.
statement_text: Most students read about global challenges. Our students learn to engage with them. With WinPlus mentors, including professionals with experience at the United Nations and UNICEF, students research an issue they care about, prepare a position and, where the conference allows, speak or present before international delegates. They return with confidence, a global network and a credential few applicants can match.
