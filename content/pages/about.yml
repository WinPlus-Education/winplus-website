seo_title: "About WinPlus | Boutique Education Consultancy in Harvard Square"
meta_description: "WinPlus was founded in Harvard Square in 2020 by Harvard Kennedy School graduates. Our story, mission and bespoke approach to admissions and talent development."
eyebrow: About Us
title: "A boutique consultancy, founded in Harvard Square."
intro: "WinPlus brings the mentors, research and global stages of the world's leading universities to ambitious students everywhere, through one plan built around each student."
image: /images/uploads/photos/hks-session.webp
image_alt: A WinPlus session at Harvard Kennedy School

story_eyebrow: Our story
story_statement: "We started WinPlus because talent is everywhere, but access to the people and opportunities that develop it is not."
story_text: "WinPlus Education and Technology Inc. was founded in 2020 in Harvard Square by Cathy Guo and Cedric Pan, both graduates of Harvard Kennedy School. Today our US headquarters in Cambridge and our team in Beijing work with families across the US, China, Hong Kong, Singapore and beyond.\n\nOur team and mentors come from Harvard, MIT, Stanford, Yale, the University of Pennsylvania and leading companies. Together we have helped more than a hundred students reach the Ivy League and the US Top 50, and taken students to international conferences on climate, technology and women's rights."

mission_eyebrow: Our mission
mission_title: "Whole-person education, in pursuit of truth"
mission_text: "Inspired by Harvard's ideals of whole-person education and *veritas*, the pursuit of truth, WinPlus is committed to educational equity and global impact. We develop young leaders and future innovators who are ready for a global society: curious, capable, principled and caring."
mission_image: /images/uploads/campus.jpg
mission_image_alt: A historic red-brick university library on a green campus

principles_eyebrow: What we believe
principles_title: "Our principles"
principles:
  - title: Every student is an original
    text: "We never force students into a template. Each plan starts from the student's character, experience and interests, and is designed to help them become more fully themselves."
  - title: Real work beats packaging
    text: "Admissions officers can tell the difference between a story and a record. We help students build real accomplishments through research, internships and leadership, then tell that story well."
  - title: Growth, not just admission
    text: "Getting in is a milestone, not the goal. The skills, judgement and character students develop with us should serve them for life."
  - title: Integrity, always
    text: "We never guarantee admission, never misrepresent a student's work, and never sell access to institutions. Our reputation is built on honesty with families and schools."

how_eyebrow: How We Work
how_title: "One plan. Every program working together."
how_intro: "Most families assemble a counselor, a research program and a summer trip from different vendors, each with its own plan. At WinPlus, one team designs a single roadmap and every program is built to strengthen the others."
how:
  - title: Discover
    text: "A free strategy session to understand the student's background, goals, interests and personality."
  - title: Design
    text: "A bespoke multi-year roadmap covering courses, activities, research, internships and global experiences, with a dedicated mentor."
  - title: Build
    highlight: true
    text: "The profile comes to life through WinPlus programs that complement each other."
    links:
      - { label: Research & Internships, link: research.html }
      - { label: Campus Immersion, link: experiences/campus-immersion.html }
      - { label: Global Conferences, link: experiences/global-conferences.html }
  - title: Apply
    text: "Application strategy, essay brainstorming and editing, interviews and recommendations, with mentors from the schools students aspire to."
  - title: Decide
    text: "Offers, waitlists and a confident transition to university and beyond."
