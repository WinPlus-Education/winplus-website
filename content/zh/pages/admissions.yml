approach_eyebrow: 我们的方法
approach_title: 先打造背景，再完成申请。
approach_text: 大多数升学服务从 11 年级的文书开始。我们从学生本人开始，往往提前数年，在写下第一篇文书之前，就把规划变成真实的成就。
approach:
- title: 先有成果，再写材料
  text: 我们自主运营科研、实习、名校研学与国际会议项目，帮助学生积累让申请脱颖而出的真实经历，并将这些经历有力地呈现在申请材料中。
- title: 来自一线的洞察
  text: 双语团队在美国生活和工作。每个申请季，我们都追踪各校最新政策，并从在校生和校友面试官那里获得一手信息。
- title: 熟悉名校的导师
  text: 顶尖大学毕业生与校友面试官参与选校规划、文书打磨与模拟面试，基于亲身学习经历与面试实践，提供具体、专业的反馈。
- title: 一位导师，全程陪伴
  text: 从第一次规划咨询到最终选择：选校、早申策略、文书、面试、候补名单与入学过渡。
