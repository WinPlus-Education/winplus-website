faq:
- q: 孩子一定能在会议上发言吗？
  a: 不一定。发言机会取决于各会议的形式与规则。我们帮助每位学生做好参与准备：出席会议、与代表交流、在可能时展示研究，并完成书面项目。
- q: 这是模拟联合国项目吗？
  a: 不是。模拟联合国是对国际外交的模拟；本项目让学生参加真实的国际会议，与真实的代表和专家交流。
- q: 学生如何准备？
  a: 通过会前培训了解国际机构运作与所选议题，开展政策研究与写作，并由 WinPlus 导师进行演讲辅导。
- q: WinPlus 与联合国有特殊关系吗？
  a: 没有。WinPlus 是独立的教育公司。学生按照各会议自身的注册与参与规则参加会议。
