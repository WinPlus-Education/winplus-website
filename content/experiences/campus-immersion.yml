meta_description: 'A 12-day summer immersion at Harvard, MIT, Yale, Stanford and Silicon Valley: labs, professor seminars, admissions sessions and a personal plan.'
eyebrow: Campus Immersion
summary: Not a campus tour. Twelve days in the labs and classrooms of Harvard, MIT, Yale, Stanford and more, plus Silicon Valley companies, getting to know these universities first-hand and exploring your direction.
