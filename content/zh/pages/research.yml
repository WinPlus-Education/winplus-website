faq:
  - q: 学生需要有相关基础吗？
    a: 大多数项目面向有学习热情的初学者。部分进阶项目要求具备基础编程或数学能力，会在项目页面中注明。
  - q: 孩子一定能拿到推荐信吗？
    a: 导师会为完成项目且表现优秀的学生撰写推荐信。推荐信需要凭实力获得，这正是它的价值所在。
  - q: 学生的研究成果可以发表吗？
    a: 部分课题适合投稿学生期刊、学术会议或竞赛，导师和顾问会建议最合适的渠道。
  - q: 如何选择适合的项目？
    a: 预约一次免费规划咨询，顾问会根据学生的兴趣与申请规划推荐合适的项目。

