faq_title: 科研与实习：常见问题解答
faq:
- q: 学生最终会产出什么？
  a: 每个项目都以一项具体成果收尾：科研论文、可运行的产品原型、财务模型、政策简报或短片，视项目而定。学生在期末汇报中展示成果，它将成为活动列表、文书与面试背后的证据。
- q: 导师是谁？
  a: 在职科学家、工程师与研究员，职业经历涵盖 NASA、Meta、微软及顶尖研究型大学等机构。每个项目页面都写明导师及其背景。机构名称仅说明导师的职业经历，项目由 WinPlus 运营。
- q: 这和网课有什么不同？
  a: 网课面向所有人讲授内容。我们的项目是围绕真实问题的小班制：学生选择研究问题或产品方向，每周与导师线上直播交流，成果按专业标准评审，而不是像作业一样打分。
- q: 科研还是实习，哪个更适合？
  a: 科研适合希望回答原创问题并写成论文的学生，对理工、社科与政策方向尤其有力。实习适合希望动手打造产品、模型或原型、体验行业团队工作方式的学生。两者都有导师、每周成果与期末汇报。
- q: 夏校和科研应该怎么选？一定要参加吗？
  a: 夏校和科研都不是必选项。是否参加、选择哪一类，需要结合兴趣、基础、时间和目标判断。夏校适合探索专业、体验大学课程；科研适合围绕具体问题深入学习，两者也可以衔接。选择时，我们关注课程与任务是否匹配、导师如何指导，以及学生能获得哪些实际收获。
- q: 一定能拿到推荐信吗？
  a: 不一定，这正是它的价值所在。导师为完成项目并表现出色的学生撰写推荐信。一封由亲眼见证成果的导师写的推荐信，分量远超一张结业证书。
- q: 需要相关基础吗？
  a: 大多数项目面向有动力的初学者，并在前几周教授所需工具。进阶项目的编程或数学要求列在项目页面的“申请条件”中。需要说明的是，参加项目不代表学生成为导师所在机构的正式实习生或成员，具体身份与参与形式以项目说明为准。
- q: 线上科研实习项目的含金量怎么保证？
  a: 线上科研实习反而是我们能约到顶级资源的重要原因。NASA科学家、硅谷大厂（Meta、Google）的一线核心工程师通常日程繁忙，正是通过灵活高效的线上协作，才让优秀高中生有机会直接拿到世界顶尖实验室的第一手课题。
- q: 8周时间，高中生真的能做出专业级的成果吗？
  a: 能。关键在于教学方法。科研导师会了解每个孩子的特质，根据他们当下的水平，安排一条能让他们跳一跳够得着的成长路径，而不是一股脑塞进一个模板里。只要孩子愿意跟紧节奏，8周的产出和成长是水到渠成的。[阅读两位学员与NASA科学家合作设计深空望远镜的故事](insights/nasa-mentored-research-two-students-one-telescope.html)
- q: 成果可以发表或参赛吗？
  a: 当成果足够成熟时，导师与 WinPlus 顾问会推荐合适的学生期刊、会议或竞赛并协助投稿。能否发表取决于成果与渠道，我们不会事先承诺。
- q: 为什么选择专业期刊而非顶级期刊发表？
  a: 对于绝大多数高中生来说，想要发表在世界顶级期刊上是不现实的。大学更看重的是你有没有完成科研的素养与流程，而不是你是否发表在“顶刊”。哪怕只是一个面向学生开放的专业期刊，也能证明你具备大学级别的研究能力和规范的英文写作能力。同时，大学更愿意看到学生主动联系、申请到的科研机会（例如中科院等科研背景），而不是花钱买来的项目。
- q: IB 的 EE（Extended Essay）可以算作科研经历吗？
  a: 两者不同。EE 的本质是引导 IB 学生进行学术探索，帮助学生更好地理解某一门学科，学术要求相对不高，更偏重概念性练习；而且 IB 规定不允许老师在学术内容上提供太多帮助。校外科研更加严谨、学术比重更大，更贴近大学的真实研究体系，导师也能给予真正深入的学术指导。很多学生两者兼做：在校内完成 EE，同时在导师指导下开展独立的校外科研。
- q: 孩子目前标化一般，专业方向也比较模糊，可以参加吗？
  a: 可以。我们的工作就是帮孩子把模糊的兴趣具象化。在咨询过程中，老师会直接挖掘孩子的潜质，给出初步的方向建议。
- q: 项目何时开课？需要投入多少时间？
  a: 大多数项目线上进行 6–8 周，主要在暑期（6–8 月），部分在春季开课。每周有直播课并需独立完成任务；各项目页面列出具体安排及是否开放申请。
