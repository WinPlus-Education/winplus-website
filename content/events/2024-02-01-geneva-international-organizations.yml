summary: A humanities study program in Geneva, home to the UN's European headquarters and one of the world's great hubs of international cooperation.
statement: In the city where the world negotiates, students studied how international cooperation really works.
details: 'Geneva hosts the United Nations Office at Geneva in the Palais des Nations, together with dozens of international organizations and hundreds of NGOs working on health, trade, labour, human rights and humanitarian action.


  In February 2024, WinPlus students travelled to Geneva for a humanities study program on international organizations, exploring how global institutions are built and how diplomacy turns shared problems into shared rules.'
