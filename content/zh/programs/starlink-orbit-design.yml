overview: 卫星星座正在重塑全球通信。学生将学习轨道力学与仿真工具，并为特定任务设计和分析卫星星座。
activities:
- 轨道力学基础
- 卫星星座设计中的权衡
- 使用 Python 模拟轨道
- 分析覆盖范围、碰撞风险与太空碎片
- 展示星座设计方案
mentor: NASA 戈达德航天中心 / MIT 航空航天工程师
mentor_bio: '[导师简介占位——2–3 句话介绍背景与研究方向。]'
mentor_photo: ''
deliverables:
- 工程设计报告与仿真模型
- 导师亲笔推荐信（符合条件的学生）
- 实习科研证书
- 结业成果展示
prerequisites: 需具备代数与三角函数基础；建议修过物理。
