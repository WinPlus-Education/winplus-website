features_title: What makes it different
features:
- title: Selected, not sold
  text: 'A selective, competitive program. Students earn their place on readiness and commitment, then choose the issue they care about most: climate, disability rights, gender equality, education or health.'
- title: Prepare like a professional
  text: Training on how international institutions work, policy research and a written position, guided by mentors with UN and UNICEF experience.
- title: Take the stage
  text: Students attend sessions and side events and, where opportunities allow, speak, present research or exhibit their work. Students gain real experience presenting before international audiences.
- title: Turn it into impact
  text: 'Reflection, a follow-up project and guidance on how to describe the experience in applications. Students complete a policy brief or reflection paper and build a global network of peers, professionals and mentors: leadership and impact that carry real weight in applications.'
