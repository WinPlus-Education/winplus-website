- title: Finding the right school
  text: We help families understand the differences between schools in academics, culture, size and support, and build a list where the student will thrive, not just be admitted.
- title: A complete, polished application
  text: SSAT/ISEE and English testing plans, applications, student and parent essays, and recommendations, coordinated on one timeline.
