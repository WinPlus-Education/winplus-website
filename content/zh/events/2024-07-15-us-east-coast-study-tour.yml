testimonials:
- quote: 在 MIT 的 Sea Grant 实验室，教授告诉我们角落里那台机器人可以携带传感器下潜三千米。那一刻我才真正感受到 MIT 科研实力的深厚。
  name: 学员
  role: 2024 年学员
- quote: 十二天前我们还素不相识，如今已是亲密的朋友。这段旅程开启了我们的航程：用脚步去发现真实。
  name: 学员
  role: 2024 年学员
category: immersion
statement: 十二天、十所大学，每位学生都更清楚自己属于哪里。
