story_eyebrow: 我们的故事
story_statement: 我们创立 WinPlus，是因为人才无处不在，但能够培养人才的导师与机会并非人人可及。
story_text: 'WinPlus Education and Technology Inc.（欧歌学院）由哈佛肯尼迪学院校友郭琪（Cathy Guo）与盘超（Cedric Pan）于 2020 年在哈佛广场创立。如今，我们的剑桥美国总部与北京团队服务着来自美国、中国大陆、香港、新加坡等地的家庭。


  我们的团队与导师来自哈佛、MIT、斯坦福、耶鲁、宾夕法尼亚大学及世界知名企业。我们已帮助上百名学生进入常春藤及美国 Top 50 大学，并带领学生参加气候、科技与女性议题的国际会议。'
mission_eyebrow: 我们的使命
mission_title: 全人培养，追求真理
mission_text: 依托哈佛大学“全人教育”与“追求真理（*veritas*）”的理念，WinPlus 致力于推动全球教育公平与影响力，培养适应未来国际社会、全球治理与全面发展的青年领袖和未来产业人才：有好奇心、有能力、有原则、有温度。
mission_image: /images/uploads/campus.jpg
mission_image_alt: 绿意环绕的红砖大学图书馆
principles_eyebrow: 我们的信念
principles_title: 我们的原则
principles:
- title: 每个学生都独一无二
  text: 我们从不套用模板。每一份规划都从学生的性格、经历与兴趣出发，帮助他们成为更完整的自己。
- title: 真实成就胜过包装
  text: 招生官能分辨“故事”与“事实”。我们帮助学生通过科研、实习与领导力积累真实成就，再把故事讲好。
- title: 成长，而不只是录取
  text: 录取是里程碑，而不是终点。学生在这里培养的能力、判断力与品格，应当受用一生。
- title: 始终坚守诚信
  text: 我们从不保证录取，从不夸大学生的工作，也从不出售任何机构的参与资格。我们的声誉建立在对家庭与学校的诚实之上。
how_eyebrow: 服务流程
how_title: 一个平台，而非零散拼凑的多家机构。
how_intro: 很多家庭需要分别寻找升学顾问、科研项目和暑期活动，每家都有各自的计划。在 WinPlus，一个团队制定唯一的路线图，每个项目都为彼此加分。
how:
- title: 了解
  text: 免费规划咨询，深入了解学生的背景、目标、兴趣与性格。
- title: 规划
  text: 量身定制的多年路线图，涵盖选课、活动、科研、实习与国际经历，并配有专属导师。
- title: 提升
  text: 通过相辅相成的 WinPlus 项目，让背景真正立起来。
- title: 申请
  text: 申请策略、文书头脑风暴与修改、面试与推荐信，由来自学生目标院校的导师指导。
- title: 抉择
  text: 录取选择、候补应对，以及顺利过渡到大学及未来。
compare:
- title: 一段关系
  text: 一位了解学生的专属导师，从第一份规划到最后一封录取。
- title: 一个连贯的故事
  text: 每个项目都服务于同一条主线，不做无用功。
- title: 一个导师网络
  text: 教授、科学家和业界领袖，面向每一位学生开放。
