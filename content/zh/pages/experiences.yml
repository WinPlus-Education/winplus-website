faq_title: "国际体验常见问题"
faq:
  - q: 名校深度研学和普通校园参观有什么不同？
    a: "普通参观只看建筑；深度研学让学生走进实验室、课堂与企业：动手实践、与教授研讨、与在校生交流、参加招生说明会，由来自哈佛、MIT、耶鲁、斯坦福的 WinPlus 导师授课。"
  - q: 谁可以参加全球领导力会议项目？
    a: "对全球议题有真实兴趣的 9–12 年级学生。能否参与取决于各会议的规则以及学生的准备程度。名额有限，并非所有申请者都会入选。"
  - q: 线下项目期间学生有人照看吗？
    a: "有。每个团组都有 WinPlus 工作人员全程陪同。[补充师生比、安全措施和保险说明。]"
  - q: 项目费用包含哪些？
    a: "通常包括导师课程、住宿、地面交通、餐食和门票。国际机票、签证和旅游保险一般不含，我们的团队会协助家庭办理。具体以各项目为准。"
  - q: WinPlus 与学生参访的大学或机构有隶属关系吗？
    a: "没有。参访与活动由 WinPlus 导师及合作伙伴安排。大学及机构名称仅说明学生参访地点，并不代表其为 WinPlus 背书。"

