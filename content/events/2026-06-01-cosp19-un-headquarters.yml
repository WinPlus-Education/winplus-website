summary: A 17-year-old WinPlus student was the only high-school speaker at the 19th Conference of States Parties to the Convention on the Rights of Persons with Disabilities.
details: After issue training and months of preparation with WinPlus mentors, a 17-year-old WinPlus student addressed the 19th Conference of States Parties to the Convention on the Rights
  of Persons with Disabilities (COSP19) at UN Headquarters in New York, the only high-school student speaker at the conference.
