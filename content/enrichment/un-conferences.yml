meta_description: "High school students attend United Nations conferences such as UNPFII and COSP with WinPlus: preparation, policy research, delegation experience and reflection."
summary: Real seats at United Nations conferences and international forums, not a Model UN camp. Students research a global issue, speak or present, and build a global network. WinPlus students have taken part in 15 UN conferences.
