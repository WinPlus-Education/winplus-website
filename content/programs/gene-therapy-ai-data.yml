meta_description: Analyse real AAV gene-therapy sequencing data with Python, mentored by a Caltech postdoctoral fellow. Eight-week online biology research program.
summary: Analyse real gene-therapy sequencing data with Python, and learn how lab discoveries become medicine, with a postdoctoral fellow from Caltech.
