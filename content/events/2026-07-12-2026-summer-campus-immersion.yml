highlights:
- title: Global citizenship
  text: Harvard mentors and alumni taught leadership, international relations and global challenges. Students debated poverty, health, energy, education and discrimination, the roles the US and China play in each, and how young people can shape the world ahead.
- title: Culture and society
  text: Yale mentors explored American politics, economics, law and history and how US and Chinese cultures differ. Students visited leading museums and arts centers, and US coaches taught American football, squash and baseball.
- title: Technology and innovation
  text: Executives from Google and Meta taught generative AI, machine learning and product design. Students toured Harvard's engineering school, the MIT Media Lab and an aerospace satellite lab, while mentors from Harvard Medical School and NASA explained gene engineering and satellite remote sensing.
- title: Communication
  text: Small-group discussions in English, American public-speaking training and conversations with tech professionals and students from many backgrounds built confident English and cross-cultural empathy.
arc:
- label: Boston & Cambridge
  title: Harvard and MIT
  text: 'Seminars at Harvard and MIT, the MIT Media Lab and Harvard''s engineering labs, sailing on the Charles. Off campus: the Freedom Trail, a Boston Duck Tour, the Museum of Fine Arts, Boston Public Library, Quincy Market and the Harvard Art Museums, and the first team dinners that turned a cohort into friends.'
- label: New Haven & Princeton
  title: The Ivy League
  text: 'Yale''s Old Campus and Sterling Memorial Library, then Princeton: admissions sessions, campus tours with current students, and a seminar in Princeton''s classrooms.'
- label: New York & Philadelphia
  title: Cities that shaped America
  text: 'A cruise to the Statue of Liberty, Wall Street and the 9/11 Memorial, United Nations Headquarters, Times Square, the Empire State Building, Central Park, the Met, the American Museum of Natural History and a Broadway show. In Philadelphia: Independence National Historical Park and the Liberty Bell.'
- label: Silicon Valley
  title: Where the future is built
  text: Visits to leading technology companies and sessions with executives from Google and Meta gave students a first-hand look at how the industry works, from product design to AI research.
outcomes:
- title: Global Competency Certificate
  text: Awarded to every student on completing the 50-hour curriculum.
- title: A personalized admissions plan
  text: A US college plan shaped by mentors around each student's interests, strengths and goals.
- title: Confident English
  text: Public speaking, group discussion and real conversations with professionals and peers.
- title: Mentors and friends
  text: Relationships with mentors and a cohort that continue long after the program.
