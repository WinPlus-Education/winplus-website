faq_title: 'Admissions counseling: common questions'
faq:
- q: When should a student start working with WinPlus?
  a: Ideally in Grade 9 or 10, which leaves time to build research, leadership and a coherent profile. We also work with students in Grades 11 and 12 who need focused application support,
    and with graduate-school applicants at any stage.
- q: Do you guarantee admission?
  a: No. No ethical counselor can guarantee admission. We commit to a thoughtful strategy, expert support and a student who presents their strongest, most authentic self.
- q: Do you help with the Ivy League?
  a: 'Yes. Our US college program includes Ivy League strategy: a multi-year profile plan, early-round (REA/ED/EA) strategy, essays developed with mentors from Harvard, Yale and Stanford,
    and interview preparation with alumni interviewers.'
- q: Do you work with students outside the US?
  a: Yes. Many of our families are in China, Hong Kong, Singapore and beyond. Our teams in Harvard Square and Beijing meet students online and schedule around your time zone.
- q: Which countries do you support?
  a: US admissions (high school, college and graduate school) is our core. We also guide undergraduate and graduate applications to the UK, Canada and Australia.
- q: How much does admissions counseling cost?
  a: Programs are tailored to the student's grade, goals and the level of support needed, so we share pricing after a free strategy session. [Add pricing guidance if desired.]
- q: How is WinPlus different from other admissions consultants?
  a: We're a boutique team based in the US, mentors come from the schools students aspire to, and we build the profile through our own research, immersion and conference programs, rather
    than only editing applications.
