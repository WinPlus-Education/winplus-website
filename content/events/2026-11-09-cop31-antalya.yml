expect_title: What to expect
expect:
- Pre-conference training with WinPlus mentors on the UN climate process, the COP31 Action Agenda and a research question of each student's own
- The Green Zone, the host-run space open to registered visitors, with exhibitions, events and sessions for youth, academia, civil society and startups
- Sessions across the Action Agenda's priority themes, including Youth and Education, Zero Waste, Oceans and Seas, Food Security, Clean Energy Transition and Climate-Resilient Cities
- Where the conference's rules allow, opportunities to present research or join youth-focused events. The Blue Zone, where negotiations take place, is open only to accredited participants
- A debrief and a written reflection or policy brief after the conference, plus guidance on describing the experience in applications
