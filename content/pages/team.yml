- id: claire-yoo
  name: Claire Yoo
  initials: CY
  title: Co-Director of Engagement, Harvard Undergraduate OpenBio Laboratory
  education: Integrative Biology, Harvard University
  photo: ''
  bio: 'Claire Yoo is a Harvard integrative biology undergraduate and Co-Director of Engagement at Harvard Undergraduate OpenBio Laboratory. Through Harvard’s PRISE program, she joined the Jost Lab for microbiology research. She has also participated in botanical research associated with the Harvard University Herbaria and scientific outreach to younger students.


    At WinPlus, she advises undergraduate applicants interested in medicine, neuroscience and related life sciences. She has led learning visits connected with Harvard’s life-science and medical-school environments and helped students gain undergraduate admission to Harvard and Stanford.'
  founder: false
