- tag: 科研实习
  title: 两位学员，一台深空望远镜
  text: 一位刚被知名科研项目拒绝，一位所在的美国公立高中几乎没有科研资源。与NASA科学家共同完成八周深空望远镜科研后，分别收获剑桥、帝国理工、伯克利天体物理录取，以及密歇根、UCLA、UIUC机械工程录取。
  image: /images/uploads/insights/nasa-research/webb-telescope-session.jpg
  image_alt: NASA科学家导师在线上为学员讲解韦伯望远镜
  link: insights/nasa-mentored-research-two-students-one-telescope.html
testimonials_title: 家长怎么说
testimonials:
- quote: 我们所到访的十所高校给了我深深的震撼，二十几位德才兼备的名校教授和出类拔萃的校友，让我感慨他们当之无愧为世界名校的精英。他们的教导都深深印在我心里，让我对进入名校的欲望越来越强烈，梦想有朝一日成为像他们一样的精英栋梁。
  name: 初三学员
  role: 名校深度研学
- quote: 通过这次行程，我对于人生规划有了较深的思考和认识。我明白了美国大学实际上想了解我是谁、有什么独特之处、希望成为什么样的人，以及希望对世界和社会做出什么贡献。同时，我还身临其境地感受到了美国文化的多元、开放、热情和包容，相信这一切都会是我人生中宝贵的财富。
  name: 高一学员
  role: 名校深度研学
- quote: 非常感谢老师们无微不至的照顾！孩子回到家还哭了，说舍不得老师和同学们。这次美国之行的大集体温暖又美好，行程安排紧凑丰富，孩子收获很大！
  name: 高二家长
  role: 名校深度研学
- quote: 孩子收获满满，各位老师的大爱更是让人感动。回家的路上，孩子对各位老师在异国他乡亲人般的照顾赞不绝口，虽身在美国，却如家般温暖，再次感谢各位老师的倾情付出！
  name: 初二家长
  role: 名校深度研学
