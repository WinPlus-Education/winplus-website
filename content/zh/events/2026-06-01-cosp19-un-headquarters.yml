summary: 一位 17 岁的 WinPlus 学生成为《残疾人权利公约》第十九届缔约国大会唯一的高中生发言人。
details: 经过议题培训与数月准备，在 WinPlus 导师指导下，一位 17 岁的 WinPlus 学生在纽约联合国总部召开的《残疾人权利公约》第十九届缔约国大会（COSP19）上发言，是本届大会唯一的高中生发言人。
