help:
- title: 深度胜过广度
  text: 英国大学按专业录取。我们帮助学生积累专业相关的深度（阅读、科研与竞赛），证明真正的学术热情。
- title: UCAS、笔试与面试
  text: 专业选择、个人陈述、学科笔试，以及牛津、剑桥等需面试院校的面试准备。
- title: 英国研究生项目
  text: 一年制硕士与博士申请，包括研究计划与导师联系。
highlight:
  label: 成功案例
  title: 英国 G5 录取
  text: WinPlus 学生曾获得牛津、剑桥、帝国理工、伦敦大学学院与伦敦政经学院录取。
faq:
- q: UCAS 截止日期是什么时候？
  a: 牛津、剑桥及大多数医学专业于毕业年 10 月中旬截止，其他大多数专业于 1 月下旬截止。
- q: 可以同时申请美国和英国吗？
  a: 可以，我们的许多学生都这样做。两套体系看重的方面不同，我们会统筹背景与时间线，让每份申请都有竞争力。
- q: 你们指导英国硕士申请吗？
  a: 指导，包括选校选专业、个人陈述、推荐信，以及研究型学位的研究计划。
