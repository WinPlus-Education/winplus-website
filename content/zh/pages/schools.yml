steps_title: 如何开启合作
steps:
- title: 初步沟通
  text: 了解您的学生、目标与现有资源。
- title: 选择模式
  text: 推荐、联合品牌或白标合作，并签订正式协议。
- title: 试点合作
  text: 从一次低门槛的推荐合作试点开始——投入小，见效真。
- title: 扩大规模
  text: 根据成果逐步扩展至更多服务与学生。
ideal_partners: 理想合作伙伴：中国、美国与新加坡规模为 50–500 名学生的私立学校，以及追求优质成果与差异化项目的教育机构。
