  education: 麻省理工学院航空航天博士及硕士
  photo: /images/uploads/team/rachel-morgan.webp
  bio: 'Rachel Morgan 是在 NASA Ames 研究中心开展研究的光学科学家，拥有 MIT 航空航天与物理本科背景，以及航空航天硕士、博士学位。她研究集成光子技术在天文仪器中的应用，关注类地系外行星探测，并曾在 NASA 喷气推进实验室及 MIT 林肯实验室积累科研经验。


    在 WinPlus，Rachel Morgan 担任「太空望远镜任务设计」项目导师。'
