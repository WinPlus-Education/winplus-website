faq:
  - q: What makes this different from a typical study tour?
    a: "In under two weeks we bring together top mentors, campus and company visits and conversations with professionals from Meta, Google, Silicon Valley venture capital and more. Beyond career guidance, mentors share their own life and career paths, so students understand the route from subject, to major, to career. We also focus on soft skills: communication, kindness and inclusion, and students' well-being."
