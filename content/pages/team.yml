- id: claire-yoo
  name: Claire Yoo
  initials: CY
  title: Integrative Biology Undergraduate, Harvard
  affiliation: Co-Director of Engagement, Harvard Undergraduate OpenBio
  photo: ''
  bio: 'Claire Yoo is a Harvard integrative biology undergraduate and Co-Director of Engagement at Harvard Undergraduate OpenBio Laboratory. Through Harvard’s PRISE program, she joined the Jost Lab for
    microbiology research. She has also participated in botanical research associated with the Harvard University Herbaria and scientific outreach to younger students.


    At WinPlus, she advises undergraduate applicants interested in medicine, neuroscience and related life sciences. She has led learning visits connected with Harvard’s life-science and medical-school
    environments and helped students gain undergraduate admission to Harvard and Stanford.'
  founder: false
- id: yuan-yuan
  name: Yuan Yuan
  initials: YY
  title: Technology Professional
  affiliation: Experience at Meta and Bloomberg
  photo: /images/uploads/team/yuan.jpg
  bio: 'Yuan Yuan has professional experience at Meta and Bloomberg and studied at Columbia’s engineering school. Yuan’s public technical work includes a CppCon 2024 poster on behavior-driven development
    for a microservices-based algorithmic trading system, connecting business requirements, system behavior and software testing.


    At WinPlus, Yuan mentors FinTech & AI Startup Lab.'
  founder: false
