steps_title: How to get started
steps:
- title: Intro call
  text: We learn about your students, goals and current resources.
- title: Choose a model
  text: Referral, co-brand or white-label, with a formal agreement.
- title: Start with a pilot
  text: 'Begin with a low-commitment referral pilot: small investment, real results.'
- title: Scale up
  text: Expand to more services and students as results come in.
ideal_partners: 'Ideal partners: private schools of 50–500 students in China, the US and Singapore, and education organizations seeking premium outcomes and differentiated programming.'
