faq_title: 升学规划：常见问题解答
faq:
- q: 什么时候开始最合适？
  a: 比大多数家庭想象的更早。美本申请最有竞争力的背景通常从 9 或 10 年级开始搭建：选课、科研与领导力都需要时间沉淀为真实成果。美高申请建议在 1 月截止前 12–18 个月启动。研究生申请建议提前一年规划标化、推荐人与定位。如果已经是 11 或 12 年级，我们会把精力集中在仍能带来改变的环节：[曾有学员在十一年级五月底才转申美国，最终收获 12 所美国大学录取和 8 万美元奖学金](insights/six-month-turnaround.html)。
- q: 孩子兴趣不明确，活动也比较零散，怎么办？
  a: 我们会从学生喜欢的课程、持续投入的活动和真正关心的问题出发，通过交流、课程与实践逐步明确方向。活动不必全部围绕同一个专业；学术探索与公益、艺术、体育等经历，可以共同呈现孩子的能力、兴趣和价值观。
- q: 需要等托福、SAT成绩理想后，再开始升学规划吗？
  a: 不需要等成绩理想后再开始，两者可以同步推进。考试、校内学习、活动探索和申请准备需要统筹安排，我们会结合学生的学业压力与申请阶段确定优先顺序，为各项准备留出时间。
- q: 与 WinPlus 合作的一年是怎样的？
  a: 免费规划咨询后，导师会制定多年路线图，并定期与学生见面、每学期调整。科研、实习与国际项目围绕学业安排。进入申请年后，重点转向选校、早申策略、文书与面试，所有截止日期都在同一条时间线上统一追踪。
- q: 你们只服务冲刺藤校的学生吗？
  a: 不是。很多学生以藤校和美国前 30 为目标，但我们追求的是匹配：一份兼顾冲刺、匹配与保底的名单，包括文理学院，以及适合学生的英国、加拿大和澳洲大学。
- q: 你们会代写文书吗？
  a: 绝不。文书由学生本人完成。我们帮助学生找到值得讲的故事，再通过多轮追问与反馈不断打磨。招生官每年阅读成千上万篇文书，真实是唯一有效的策略。
- q: 如何帮助学生确定主文书的主题？
  a: 在动笔之前，我们会与学生进行多次访谈和引导，帮助他理清过去几年中哪些经历影响最深、哪些感悟最能代表真实的价值观。最有力量的主题往往来自一件“生活中再普通不过的小事”，再以“以小见大”的方式升华。随后，曾担任耶鲁大学本科招生面试官的文书首席导师会与学生反复打磨结构、语言节奏与情绪推进，并确保文书故事、主申专业与活动列表形成“三线一致”。
- q: 可以同时申请美国和英国吗？
  a: 可以，我们有不少学生同时申请美国和英国。美国大学注重综合考察学业、活动与个人经历，英国大学更强调学科兴趣与专业准备。自 2026 年入学申请起，UCAS 个人陈述已改为三个问题，部分专业另有笔试或面试要求。我们统筹两国的申请准备与时间安排，让已有积累在不同申请体系中得到充分呈现。
- q: 你们保证录取吗？
  a: 不保证。任何有职业操守的顾问都无法保证录取。我们承诺严谨的策略、专业的反馈，以及帮助学生展现最强、最真实的自己。个人结果因人而异。
- q: 我们不在美国，怎么合作？
  a: 我们大多数家庭来自中国大陆、香港、新加坡和美国。辅导以线上为主，跨时区安排，并可在波士顿、北京以及名校研学期间面对面交流。
- q: 费用是多少？
  a: 项目根据学生年级、目标与所需支持程度定制，因此我们会在免费规划咨询后提供报价。[如需可补充价格说明。]
