overview: "Unlike sightseeing tours, our summer and winter schools are designed and taught by mentors with backgrounds at Harvard, MIT, Stanford and Silicon Valley companies. The curriculum is built around four global competencies: global analysis, cultural empathy, diverse communication and sustainable action."
activities:
  - Global-issues training built on four core competencies
  - University-style seminars with mentors from NASA, Harvard and MIT
  - Campus visits and face-to-face sessions with admissions officers
  - Company visits and themed study tours
  - Capstone project and presentation
deliverables:
  - Harvard Global Competency Certificate
  - Face-to-face meetings with top-university admissions officers
  - A personalized US undergraduate admissions plan
  - Capstone project
