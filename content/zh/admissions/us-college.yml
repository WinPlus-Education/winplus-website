summary: 藤校与美国前 30 名校申请策略：从多年背景规划到选校、文书与面试。
eyebrow: 美国本科申请
title_long: 围绕真实的你，冲刺常春藤与 Top 30
image: /images/uploads/campus/yale-harkness.webp
image_alt: 耶鲁大学哈克尼斯塔
who: 身处美国或海外的 9–12 年级学生，目标为藤校、斯坦福、MIT 等顶尖综合大学及文理学院。
system: 美国大学采用综合评估。成绩与课程难度只是门槛，真正拉开差距的是影响力的证据、连贯的个人故事，以及在多达 20 份申请与各校补充文书中始终清晰的个人声音。
challenges_intro: 在最顶尖的大学，几乎每位申请者都学术优秀。以下才是决定结果的关键，以及我们的应对方式。
challenges:
- challenge: 人人纸面优秀
  title: 用成果证明你的故事
  text: 我们找到学生兴趣中真正的主线，再通过科研、实习、领导力与全球舞台积累证据，让申请呈现真实成就，而非空洞承诺。
- challenge: 早申决定的席位逐年增加
  title: 精心设计的早申策略
  text: 平衡的选校名单，以及清晰的 REA、ED、EA 规划，依据各校文化、偏好以及当年的标化与文书政策制定。
- challenge: 成千上万篇文书大同小异
  title: 与“过来人”打磨文书和面试
  text: 主文书与补充文书经过多轮追问与反馈，并由校友面试官进行模拟面试。每一个字都由学生本人完成。
timeline_title: 美国本科申请时间线
timeline:
- when: 9–10 年级
  text: 探索兴趣，规划有挑战性的课程，启动第一个真实项目。
- when: 11 年级
  text: 科研或实习、标化规划、有影响力的领导力经历，以及初步选校。
- when: 12 年级前暑假
  text: 主文书、补充文书与活动列表；实地探校。
- when: 11 月 1–15 日
  text: 多数顶尖大学的 ED、EA 截止。
- when: 1 月 1–15 日
  text: 常规申请截止；校友面试。
- when: 3 月–5 月 1 日
  text: 放榜、比较录取、候补名单处理，5 月 1 日前确认入学。
