faq:
  - q: 可以同时申请美国和英国吗？
    a: 可以，我们很多学生都是这样做的。两者差别很大（英国以单一专业为核心），因此我们从一开始就统筹规划。
  - q: 牛剑申请有什么不同？
    a: 牛津和剑桥截止日期更早，通常需要参加入学笔试并进行学术面试，建议从 11 年级开始准备。
  - q: 加拿大和澳大利亚的大学需要文书吗？
    a: 要求各不相同。部分专业需要补充申请、个人简介或面试，很多主要看成绩。
