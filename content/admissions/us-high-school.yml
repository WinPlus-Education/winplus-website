faq:
  - q: What grade should my child enter a US boarding school?
    a: Grade 9 is the most common entry point, though many schools also admit students into Grade 10. We advise based on your child's readiness.
  - q: Is the SSAT required?
    a: Many boarding schools require or recommend the SSAT or ISEE, and international students often also need TOEFL or similar. Requirements vary by school.
