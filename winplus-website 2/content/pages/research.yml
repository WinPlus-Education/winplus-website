why_title: Why research matters
why:
  - title: Admissions impact
    text: Research is one of the clearest differentiators for Ivy League and top-20 applicants, and most applicants don't have it.
  - title: Career-ready skills
    text: Students learn the tools professionals actually use, from Python and LLMs to lab data analysis and film production.
  - title: Access to an elite network
    text: Students work directly with engineers, scientists and creators from world-leading organizations.

deliverables_title: What every student receives
deliverables_intro: Every program ends with tangible results that strengthen college applications and stay with students long after.
deliverables:
  - title: Mentor recommendation letter
    text: Eligible students who complete the program to a high standard can receive a personalized letter from their mentor, who saw their work first-hand.
  - title: A finished research paper or product
    text: A research paper, working prototype, financial model or short film, depending on the program, ready to include in applications.
  - title: Portfolio & presentation
    text: Students present their work at a final showcase and leave with a polished portfolio piece and presentation.
  - title: Certificate of completion
    text: An official WinPlus certificate describing the program, mentor and hours completed.
  - title: Publication & competition guidance
    text: Where appropriate, we help students submit their work to journals, conferences or competitions.
  - title: Application-ready narrative
    text: Your consultant helps translate the experience into activity descriptions and essays.

