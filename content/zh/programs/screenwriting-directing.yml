industry: arts-media
type: research
status: open
mentor_note: 戛纳获奖短片导演；西北大学编剧硕士
seo_title: 高中生编剧与电影导演项目 | WinPlus 欧歌学院
meta_description: 与戛纳获奖短片导演（西北大学编剧硕士）一起，完成原创短片的编剧、拍摄与剪辑。面向青少年的线上课程。
summary: 在戛纳获奖短片导演（西北大学编剧硕士）的指导下，完成一部原创短片的编剧、拍摄与剪辑。
image: https://images.unsplash.com/photo-1515634928627-2a4e0dae3ddf
image_alt: 片场中的场记板
format: 线上 · 导师直播课
length: 6–8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: '学生将通过顶尖电影院校教授的编剧与导演基础，找到自己讲故事的声音，并把原创想法变成一部完整的短片：剧本、分镜、导演、剪辑与后期制作。


  最终成果可用于艺术与电影专业申请的作品集，也让学生经历从初稿到成片、完整实现创作构想的过程。'
outcomes:
- 一部原创剧本
- 一部可放入艺术作品集的短片
- 与导师一起放映与点评
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 故事
  text: 故事构思与剧本结构。
- phase: 第 3–4 周
  title: 剧本
  text: 撰写并修改原创短片剧本。
- phase: 第 5–6 周
  title: 拍摄
  text: 分镜、指导演员与拍摄基础。
- phase: 第 7–8 周
  title: 后期与放映
  text: 剪辑、后期制作与期末放映。
eligibility:
- 9–12 年级
- 无需电影制作经验
- 可使用手机或相机拍摄
