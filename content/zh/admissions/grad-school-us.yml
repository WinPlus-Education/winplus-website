faq:
  - q: 什么时候开始准备美国研究生申请？
    a: 建议在入学前 12–18 个月开始，以便留出标化考试、科研与推荐信的准备时间。
  - q: 你们提供博士申请指导吗？
    a: 提供。我们帮助确定导师与项目、梳理研究兴趣，并撰写有力的个人陈述。
