faq:
- q: Will my child definitely speak at a conference?
  a: 'No. Speaking opportunities depend on each conference''s format and rules. We prepare every student to contribute: attending sessions, engaging with delegates, presenting research where possible and
    completing a written project.'
- q: Is this a Model UN program?
  a: No. Model UN simulates international diplomacy. In this program students attend real international conferences and engage with real delegates and experts.
- q: How are students prepared?
  a: Through pre-conference training on how international institutions work and on the chosen topic, policy research and writing, and presentation coaching from WinPlus mentors.
- q: Does WinPlus have a special relationship with the United Nations?
  a: No. WinPlus is an independent education company. Students participate in conferences under each conference's own registration and participation rules.
