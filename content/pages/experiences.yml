faq_title: 'Global experiences: your questions, answered'
faq:
- q: How is Campus Immersion different from a campus tour?
  a: 'A tour shows the buildings. Campus Immersion shows what studying and living there is like, taking students inside labs, classrooms and companies: hands-on sessions, seminars with professors and mentors, candid conversations with current students, and admissions sessions. Students come away understanding which universities fit them, and why.'
- q: What do students gain from a campus immersion, and is it right for a quieter, introverted student?
  a: 'Through coursework, campus life, conversations with mentors and visits to organizations, students learn about different fields and career paths and practice teamwork and cross-cultural communication. Introverted students do well too: they can start by preparing questions, joining small-group discussions and presenting team work, and build confidence in speaking up as they go.'
- q: Will the student really speak at an international conference?
  a: 'Speaking opportunities depend on each conference''s format and rules, and are never guaranteed. Every student is prepared to contribute: attending sessions and side events, engaging with delegates and, where the conference allows, presenting research. Our students have spoken at COSP19 at UN Headquarters and presented climate research at COP28.'
- q: Who can apply, and how are students selected?
  a: Campus Immersion is for students aged roughly 12 to 18. Global Leadership Conferences are for high school students with a genuine interest in a global issue. We select on readiness and commitment, not only on who applies first, and places are limited.
- q: How are students supervised and kept safe?
  a: Each cohort departs together with WinPlus teachers from China, and local US mentors accompany students throughout the program. Cohorts are small so teachers can look after every student. Students stay in Hilton or equivalent hotels, travel by private chartered coach and have all meals arranged. Before departure we hold a pre-trip briefing on the itinerary, coursework and safety, and help every student purchase travel insurance.
- q: What does the program fee include?
  a: The program fee typically covers coursework with professors, mentors and admissions officers; hotel accommodation, local transport and meals while in the US; and tickets to attractions and performances. It does not include international flights, visa fees, travel insurance or personal expenses. The exact fee for each cohort is set out in that program's description, and refunds follow the terms of the service contract.
- q: Do families arrange visas and flights themselves?
  a: We guide every student through the US visa application and advise on booking flights and travel insurance; these costs are paid by the family. Visa interview wait times vary by region and season, so we recommend starting as soon as you enroll, and booking flights soon after the group's flight plan is confirmed.
- q: How does enrollment work?
  a: '1. **Inquire and apply:** talk with the program lead and complete the application form.

    2. **Sign and pay:** sign the service contract and pay the program fee.

    3. **Visa and flights:** apply for the visa with our guidance, then book flights and insurance.

    4. **Pre-trip briefing:** we walk through the itinerary, coursework and safety.

    5. **Depart:** travel together with the accompanying teachers.


    Enrollment is rolling and places are limited, so programs close once they are full.'
- q: How does this help a university application?
  a: 'Admissions officers look for initiative and impact, not trips. We help students turn the experience into something specific: a research question, a project, a leadership role or a perspective that shapes their essays and interviews.'
- q: Is WinPlus affiliated with the universities or organizations students visit?
  a: No. WinPlus is an independent education company. Visits and sessions are arranged through our mentors and partners, and conference participation follows each conference's own rules. Names describe where students go and do not imply endorsement of WinPlus.
