type: research
status: open
mentor_id: changfan-lin
mentor_note: 加州理工学院博士后研究员；康奈尔大学博士
seo_title: 高中生基因治疗科研项目 | WinPlus 欧歌学院
meta_description: 在加州理工博士后研究员指导下，用 Python 分析真实 AAV 基因治疗测序数据。八周线上生物科研项目。
summary: 用 Python 分析真实的基因治疗测序数据，了解实验室发现如何走向临床，由加州理工博士后研究员指导。
image: https://images.unsplash.com/photo-1630959305606-3123a081dada
image_alt: 实验室中使用显微镜的研究人员
format: 线上 · 导师直播课
length: 8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: '基因治疗是医学最有前景的前沿之一，而越来越多的进展依赖数据。学生将通过科学家阅读的研究论文，了解基因编辑与递送原理：AAV 衣壳、血脑屏障、受体识别与定向进化。


  随后学生亲自动手：用 Python 分析真实 AAV 筛选实验的测序数据，统计变体、计算富集度并可视化结果，同时理解为什么实验室发现在惠及患者前还需进一步验证。'
outcomes:
- 阐述方法、发现与解读的研究报告
- 基于真实实验数据的 Python 分析
- 可选文献综述
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 科学原理
  text: 基因编辑、递送与 AAV 载体。
- phase: 第 3–4 周
  title: 研读论文
  text: 关键论文，以及动物研究向人类转化的局限。
- phase: 第 5–7 周
  title: 数据分析
  text: 用 Python 分析真实 AAV 测序数据：变体、富集度与可视化。
- phase: 第 8 周
  title: 研究报告
  text: 撰写并展示方法、发现与解读。
eligibility:
- 10–12 年级
- 具备高中生物基础；化学基础更佳
- 无需 Python 基础
