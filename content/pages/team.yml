  education: Columbia University, Fu Foundation School of Engineering
  photo: /images/uploads/team/yuan.jpg
  bio: 'Yuan Yuan has professional experience at Meta and Bloomberg and studied at Columbia’s engineering school. Yuan’s public technical work includes a CppCon 2024 poster on behavior-driven development for a microservices-based algorithmic trading system, connecting business requirements, system behavior and software testing.


    At WinPlus, Yuan mentors FinTech & AI Startup Lab.'
