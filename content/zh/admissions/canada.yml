help:
- title: 按专业制定策略
  text: 加拿大大学按专业录取，且非常看重成绩。我们提前规划课程与先修要求，并有策略地选择专业。
- title: 补充申请材料
  text: 工程、计算机、商科等热门专业的个人简介、补充文书、视频回答与作品集。
- title: 研究生申请
  text: 硕士与博士申请，包括陈述、导师联系与奖学金考量。
highlight:
  label: 统筹规划
  title: 一份背景，多国申请
  text: 许多家庭同时申请加拿大、美国与英国。我们统筹各国时间线与要求，让一份出色的背景服务所有申请。
faq:
- q: 加拿大大学申请截止日期是什么时候？
  a: 大多数本科项目截止于 1 月至 3 月，部分项目与奖学金更早，从 11 月开始。
- q: 加拿大大学看重课外活动吗？
  a: 越来越看重，尤其是热门专业的补充申请。我们帮助学生有效展示活动经历。
