highlights_title: Student stories
highlights:
  - title: "The only high-school speaker at a UN conference"
    tag: Global Stage
    text: "Background: a 17-year-old high school student who started 153rd in the speakers' queue. What we did: UN issue training, statement coaching and on-site advocacy for a speaking slot. Result: the only high-school student speaker at the 19th Conference of States Parties to the CRPD (COSP19), UN Headquarters, New York, June 2026."
    image: /images/uploads/events/2026-cosp19/jason-speaking.jpg
    image_alt: A WinPlus student speaking at the CRPD Conference of States Parties at UN Headquarters
    link: insights/from-the-classroom-to-the-un-floor.html
  - title: "A NASA research project to Cambridge, Berkeley and Michigan"
    tag: Research
    text: "Background: one student just rejected by a well-known research program; another at a US public school with no research resources. What we did: an eight-week deep-space telescope project custom-designed by a NASA Ames scientist. Result: Cambridge, Imperial and UC Berkeley (astrophysics); Michigan, UCLA and UIUC (mechanical engineering)."
    image: /images/uploads/insights/nasa-research/webb-telescope-session.jpg
    image_alt: A NASA scientist mentor explaining the James Webb Space Telescope to WinPlus students online
    link: insights/nasa-mentored-research-two-students-one-telescope.html
  - title: "From no SAT or TOEFL to an $80,000 UC scholarship"
    tag: Turnaround
    text: "Background: switched to US applications at the end of Grade 11 with a 3.5 GPA and no TOEFL or SAT scores. What we did: a six-month plan across testing, published research, the arts and essays. Result: 12 US offers including UC Davis, Rutgers and Ohio State, and an $80,000 scholarship from UC Riverside."
    image: /images/uploads/students/uc-scholarship-story.jpg
    image_alt: A WinPlus student on a university visit
    link: insights/zizhao-six-month-turnaround.html
  - title: "From mid-range grades to Harvard and Yale"
    tag: Ivy League
    text: "Background: average grades with top-university goals. What we did: an Ivy League plan built on our Eight Key Elements framework. Result: admitted to Harvard and Yale, with scholarship."
    image: /images/uploads/students/ivy-admit-story.jpg
    image_alt: A WinPlus student presenting her work
    link: admissions/us-college.html

