summary: WinPlus 联合创始人郭琪将与政策制定者、研究者和非政府组织负责人齐聚日内瓦，探讨人工智能如何为欠发达地区拓宽受教育机会。
statement: 人工智能能否弥合而不是扩大教育鸿沟？WinPlus 在日内瓦加入这场对话。
details: '全球有超过 2.5 亿儿童失学，而每一轮新技术浪潮都可能进一步拉大南北之间的差距。在明确的伦理标准下审慎运用，人工智能可以通过自主学习、机器翻译、数字素养与远程教育，帮助偏远地区、冲突地区和受灾地区缩小这一差距。


  本次研讨会由 Educators Without Borders International 主办，汇聚来自欧洲的企业高管、国际非政府组织、政策制定者与顶尖研究者，以及来自欠发达社区的教育工作者，共同形成切实可行的愿景与行动建议，涵盖低成本联网、教师培训与可持续资金等议题。


  WinPlus 联合创始人**郭琪**将主持开幕环节“人工智能与教育公平”专题讨论，并在“先锋实践与应用模式”环节发言，分享 WinPlus 连接学生与导师、开展跨国真实场景学习的经验。'
