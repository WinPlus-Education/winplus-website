cases_title: Case studies
cases_intro: 'Three very different starting points, one approach: a plan built around the student.'
cases:
- tag: Ivy League
  title: From top of the class to Yale, with scholarship
  start: Started the summer after Grade 9. GPA 4.0 with 14 AP 5s, ranked 1st of 300+, TOEFL 117, SAT 1550. Rich activities in biology and public health, but little international impact.
  strategy: 'Add global leadership and expert recommendations: a speaking role at an international women''s forum, research guided by a CDC epidemiologist and a global-health professor, and essays and mock
    interviews with a Yale alumni interviewer and Harvard mentors.'
  change: Spoke at a global women's forum in Bangkok; artwork exhibited at the forum; two expert recommendation letters; 50+ rounds of essay revision; interviews at every Ivy applied to.
  outcome: Admitted to Yale (with scholarship), Penn, Johns Hopkins, Notre Dame, UC Berkeley and UCLA.
- tag: Turnaround
  title: From no SAT or TOEFL to Top-50 offers and $180,000 in scholarships
  start: Started the summer after Grade 11. GPA around 3.5, no TOEFL, no SAT, no research. Many activities but no standout achievement or international reach.
  strategy: 'Raise every one of the Eight Key Elements at once: an intensive testing plan, a three-month research project with a geospatial-science professor, a UN climate conference, and a photography
    portfolio and exhibition.'
  change: TOEFL 99 and SAT 1400 (superscore); a published GIS research paper; spoke at a UN climate conference; a photography exhibition and published work; charity cello concerts at a children's hospital.
  outcome: Admitted to UC Davis, Boston University, Purdue, Northeastern and Ohio State, with scholarships of $80,000 (UC Riverside), $60,000 (UC Santa Cruz) and $40,000 (Syracuse). Waitlisted at UCLA and
    UC San Diego.
- tag: US + UK dual track
  title: Cambridge astrophysics and UC Berkeley, from one profile
  start: A student passionate about astronomy who wanted to keep both the US and UK open, two systems that reward very different things.
  strategy: 'One profile built to serve both: a 2024 East Coast campus immersion, then in 2025 a small-group research project with a NASA scientist on exoplanet telescope design using CODE V optical software,
    and a recommendation from that mentor.'
  change: Research depth that powered the UK personal statement and the Cambridge interview, where the student drew on work on the crystal packing of mirror materials, and a US narrative uniting astronomy
    with STEM education.
  outcome: Offer from the University of Cambridge (astrophysics) and admitted to UC Berkeley.
