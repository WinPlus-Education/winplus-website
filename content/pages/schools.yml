challenges_intro: Families expect top-university outcomes and global experiences. Building them in-house is slow, costly and risky.
types_title: Partnership types
types_intro: Start with one, or combine them into a full-cycle program for your students.
types:
- title: College Counseling Partnership
  text: 'Admissions strategy for US, UK, Canada and Australia, delivered alongside your counselors: school lists, essays, interviews and parent communication, with Ivy League alumni interviewers.'
- title: Turnkey Summer Programs
  text: 'Campus immersions at leading US universities, fully designed and operated by WinPlus: itinerary, mentors, labs and admissions sessions, supervision and logistics.'
- title: Cross-Border Exchange
  text: Exchanges, visits and joint projects connecting your students with peers, universities and organizations in the US, China and Singapore.
- title: Curriculum Enrichment
  text: Mentor-led research, internships, global-issues training and international conference preparation that run alongside your school year.
value_title: What your school gains
value:
- title: New revenue, zero operations
  text: We handle delivery, so you don't need to build a team.
- title: Instant differentiation
  text: A program competitors can't easily copy becomes your advantage immediately.
- title: Better enrollment and retention
  text: Top outcomes are why families choose a school, and why they stay.
- title: Brand empowerment
  text: World-class mentors and programs at leading universities, presented under your brand.
