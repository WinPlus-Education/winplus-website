summary: A WinPlus student delegation joins the 2026 UN Climate Change Conference (COP31) in Antalya, Türkiye, to engage with the global climate agenda.
details: |-
  COP31, the 2026 UN Climate Change Conference, takes place in Antalya, Türkiye, from November 9 to 20, 2026. Türkiye hosts the conference and holds the COP31 Presidency, with Australia leading the negotiations.

  WinPlus students prepare with mentors before the conference: how the UN climate process works, the issues on the table, and a research question of their own. At the conference they attend sessions and side events and, where the conference's rules allow, present their work.

  Building on our COP28 delegation in Dubai, where five WinPlus students presented climate research, COP31 is our next step on the global climate stage. [Confirm delegation details, dates on site and how to join.]

  Official conference information: [UNFCCC: The road to Antalya](https://unfccc.int/cop31/the-road-to-antalya). WinPlus is an independent education company; participation follows the conference's own registration rules and does not imply endorsement by the UNFCCC.
