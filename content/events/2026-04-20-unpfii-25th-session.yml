details: Guided by WinPlus mentors, students prepared on the forum's themes and attended sessions of the 25th session of the United Nations Permanent Forum on Indigenous Issues in the General Assembly Hall, engaging with delegates and Indigenous representatives from around the world. [Read the full story](../insights/inside-the-un-forum-on-indigenous-issues.html)
