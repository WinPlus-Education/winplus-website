- id: cathy-guo
  name: Cathy Guo
  initials: CG
  title: Co-Founder
  affiliation: Master in Public Policy, Harvard Kennedy School
  photo: /images/uploads/team/cathy-guo.webp
  bio: 'Cathy Guo co-founded WinPlus in 2020 in Harvard Square. She holds a Master in Public Policy from Harvard Kennedy School and dual bachelor''s degrees in economics and media from Rutgers University.


    She serves on the board of the Harvard Kennedy School Alumni Association and of Douglass Residential College at Rutgers, and has worked with UN Women and Oxford Economics. She has championed international
    education and philanthropy across the Middle East, Europe, Africa, Southeast Asia and southwest China.'
  founder: true
- id: josh-guo
  name: Josh Guo
  initials: JG
  title: Yale Graduate
  affiliation: Deloitte Professional · Public Policy and Social Sciences
  photo: /images/uploads/team/josh-guo.webp
  bio: 'Josh Guo graduated from Yale with Distinction in Major and has experience at Deloitte. He interned with the White House Council on Environmental Quality and submitted written testimony to the Connecticut
    legislature. His cultural-preservation work with Yunnan’s Bulang community involved interviews, film, music documentation and writing.


    At WinPlus, he advises undergraduate, master’s and doctoral applicants in economics, politics, philosophy, law-related fields and other humanities and social sciences. He also serves as a Yale undergraduate
    admissions interviewer and has helped students gain admission to Harvard, Yale and Stanford.'
  founder: false
- id: daniel-e-hastings
  name: Daniel E. Hastings
  initials: DH
  title: Institute Professor, MIT
  affiliation: Former Dean for Undergraduate Education and AeroAstro Department Head
  photo: /images/uploads/team/daniel-e-hastings.webp
  bio: 'Daniel E. Hastings is an Institute Professor, MIT’s highest faculty honor, with degrees from Oxford and MIT. His research covers spacecraft environments, propulsion and complex space systems. He
    has served as MIT’s undergraduate dean and AeroAstro head, leader of the Singapore–MIT research alliance, and Chief Scientist of the US Air Force.


    His teaching collaborations include the National University of Singapore and Asian students. In WinPlus sessions, he introduces space sustainability, systems engineering and manufacturing in Earth orbit,
    examining how missions coordinate resources, infrastructure and technical requirements over time.'
  founder: false
- id: jeffrey-hoffman
  name: Jeffrey A. Hoffman
  initials: JH
  title: Professor of the Practice of Aerospace Engineering, MIT
  affiliation: Former NASA Astronaut
  photo: /images/uploads/team/jeff.jpg
  bio: 'Jeffrey A. Hoffman is Professor of the Practice of Aerospace Engineering at MIT and a former NASA astronaut with a Harvard PhD. He flew five Space Shuttle missions, logging over 1,211 hours in space,
    including the first Hubble servicing mission in 1993. He also served as deputy principal investigator for MOXIE, which demonstrated oxygen production from the Martian atmosphere aboard Perseverance.


    Through WinPlus, he has led visits to MIT AeroAstro and explained Perseverance, crewed Shuttle operations and the Apollo program. Drawing on actual missions, he shows how instruments, spacecraft and
    astronauts work together under scientific, environmental and resource constraints.'
  founder: false
- id: steve-kelman
  name: Steve Kelman
  initials: SK
  title: Weatherhead Professor of Public Management, Emeritus, Harvard Kennedy School
  affiliation: ''
  photo: /images/uploads/team/steve-kelman.webp
  bio: 'Steve Kelman is the Weatherhead Professor of Public Management, Emeritus, at Harvard Kennedy School. He earned his undergraduate degree and PhD in Government at Harvard. His research examines public
    management, policy and organizational change. From 1993 to 1997, he led the Office of Federal Procurement Policy within the US Office of Management and Budget. His books include Unleashing Change.


    Through WinPlus, he has led visits to Harvard Kennedy School and discussed US–China relations, international affairs and American governance, connecting current events with how governments organize,
    decide and implement policy.'
  founder: false
- id: damir-kozhanbayev
  name: Damir Kozhanbayev
  initials: DK
  title: Research Fellow, Harvard Project on Workforce
  affiliation: Former UNICEF Education Officer
  photo: /images/uploads/team/damir-kozhanbayev.webp
  bio: 'Damir Kozhanbayev is a Research Fellow with Harvard’s Project on Workforce. He previously worked in education and knowledge innovation at UNICEF Kazakhstan and entered Harvard’s Graduate School
    of Education as an Urban Scholars Fellow in Learning Design, Innovation, and Technology.


    At WinPlus, Damir mentors Global Challenges Policy Research.'
  founder: false
  org: Harvard Project on Workforce
- id: changfan-lin
  name: Changfan Lin
  initials: CL
  title: Postdoctoral Fellow, Caltech
  affiliation: PhD, Cornell University
  photo: /images/uploads/team/changfan-lin.webp
  bio: 'Changfan Lin is a postdoctoral fellow in Caltech’s Gradinaru Laboratory, with degrees from Tsinghua and Cornell. His doctoral work included resolving a circadian-clock protein complex by cryo-EM.
    He now engineers AAV vectors to improve gene-delivery targeting and safety.


    At WinPlus, Changfan mentors Gene Therapy & AI Data Analysis.'
  founder: false
  org: Caltech
