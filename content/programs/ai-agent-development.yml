length: 6 weeks
dates: Summer 2027 · dates to be confirmed
cohort: Small group
overview: 'AI agents are software that can plan, use tools and complete tasks on their own, and they are reshaping how every industry works. In this internship, students build one themselves:
  a study assistant, research helper or data-cleaning agent that actually works.


  Students start with language-model API calls and prompt experiments, then build a loop that observes, plans, acts and stops under defined conditions. Just as important, they learn
  to make agents safe and reliable: sandbox boundaries, command allowlists, timeouts and careful handling of API keys.'
outcomes:
- Working agent code and a live demonstration
- Evaluation results across 5–10 test tasks, with execution logs
- A reflection report explaining how the agent works and where its limits are
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: Foundations
  text: How large language models work; API calls, prompting and structured outputs.
- phase: Weeks 3–4
  title: The agent loop
  text: Observe, plan, act, stop. Connecting tools, defining inputs and outputs, logging every call.
- phase: Week 5
  title: Safety & reliability
  text: Sandboxing, allowlists, file restrictions, timeouts and key handling.
- phase: Week 6
  title: Evaluate & present
  text: Run evaluation tasks, analyse execution traces, fix a weakness and present the result.
eligibility:
- Grades 9–12
- Beginner-to-intermediate programming experience (Python recommended)
- A laptop and reliable internet connection
mentor_note: Engineer with a background on Meta's AI teams
