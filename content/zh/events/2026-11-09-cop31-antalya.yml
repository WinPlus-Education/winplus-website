meta_description: WinPlus 学生参加 2026 年 11 月 9–20 日在土耳其安塔利亚举行的联合国气候变化大会 COP31，会前由导师指导气候政策研究。
category: conference
expect_title: 活动亮点
expect:
- 会前由 WinPlus 导师进行培训：联合国气候进程、COP31 行动议程，以及每位学生自己的研究问题
- 绿区：由东道国运营、面向注册访客开放的区域，设有面向青年、学术界、公民社会与初创企业的展览、活动与论坛
- 覆盖行动议程优先主题的分会场，包括青年与教育、零废弃、海洋、粮食安全、清洁能源转型与气候韧性城市等
- 在会议规则允许时，展示研究成果或参加青年主题活动。进行谈判的蓝区仅向获得认证的参会者开放
- 会后复盘，完成书面反思或政策简报，并获得在申请中呈现这段经历的指导
