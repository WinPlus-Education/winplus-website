statement: Thirty years after Beijing, students joined the world's largest gathering on gender equality.
details: 'The Commission on the Status of Women (CSW) is the UN''s principal global body on gender equality and the empowerment of women. Its 69th session met at UN Headquarters in New York from March 10 to 21, 2025, and reviewed thirty years of the Beijing Declaration and Platform for Action. On its opening day, member states adopted a political declaration recommitting to the Beijing agenda.


  WinPlus students took part in the session, following the debates and meeting delegates, advocates and young leaders from around the world. *WinPlus is an independent education company; participation does not imply endorsement by the United Nations.*'
