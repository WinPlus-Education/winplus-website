offer:
  eyebrow: 我们的项目
  title: "四大项目，一套为孩子量身打造的规划。"
  intro: "很多家庭需要分别寻找升学顾问、科研项目和暑期活动。在 WinPlus，每一个项目都相互赋能，由同一个了解孩子的团队统筹。"
  segments:
    - kicker: "核心业务"
      title: 升学规划
      text: "从美国高中到研究生，由哈佛、MIT、耶鲁、斯坦福导师与藤校校友面试官共同制定申请策略；同时提供英国、加拿大、澳洲申请指导。"
      outcomes: ["真正属于你的选校方案与个人故事", "与目标院校导师共同打磨文书", "藤校校友面试官面试辅导"]
      image: /images/uploads/photos/hks-session.webp
      image_alt: WinPlus 导师在哈佛肯尼迪学院为学生授课
      link: admissions.html
      link_text: 了解升学规划
    - kicker: "真实世界的挑战"
      title: 科研与实习
      text: "由 NASA、Meta、微软、加州理工、MIT 的科学家和工程师带领的定制线上科研与实习。学生解决真实问题，做出让招生官印象深刻的成果。"
      outcomes: ["亲身经历真实世界的问题解决", "完成论文、产品原型或作品集", "获得见证你成长的导师推荐信"]
      image: https://images.unsplash.com/photo-1630959305790-4c956ce6c0b6
      image_alt: 实验室中使用显微镜的科学家
      link: research.html
      link_text: 了解科研项目
    - kicker: "不止于参观"
      title: 名校深度研学
      text: "走进哈佛、MIT、耶鲁、斯坦福的实验室、课堂与企业。参与实验室和团队项目，与教授和在校生深入交流，找到真正适合自己的大学。"
      outcomes: ["在大学实验室中亲手实践", "与教授和在校生坦诚交流", "清晰了解最适合自己的大学"]
      image: /images/uploads/photos/yale-sterling-group.webp
      image_alt: WinPlus 学员与导师在耶鲁大学斯特林纪念图书馆前
      link: experiences/campus-immersion.html
      link_text: 了解名校研学
    - kicker: "国际舞台"
      title: 全球领导力会议
      text: "在高规格国际会议上，向外交官、政策制定者和全球代表展示自己的观点。这是千载难逢的经历，也是极少申请者能拥有的亮点。"
      outcomes: ["面向国际代表发言", "建立跨越国界的人脉", "在世界舞台上证明领导力"]
      image: /images/uploads/students/un-cosp19-speaker.jpg
      image_alt: WinPlus 学生在国际会议上发言
      link: experiences/global-conferences.html
      link_text: 了解国际会议

why:
  eyebrow: 为什么选择 WinPlus
  title: "精英指导，绝不套用模板。"
  intro: "WinPlus 是精品人才培养平台，而非流水线式的申请服务。我们服务的家庭更少，陪伴更深。"
  points:
    - title: 扎根美国本土
      text: "美国华人与美国本地团队，随时获得在校生、校友面试官及每年招生政策的一手信息，把握常春藤、文理学院及 Top 100 大学的最新要求与动向。"
    - title: 顶尖名校导师
      text: "来自哈佛、MIT、耶鲁、斯坦福的教授、科学家与校友面试官，从科研项目到最终文书，直接指导学生。"
    - title: 量身定制，拒绝模板
      text: "我们根据学生的性格、经历与兴趣制定规划：放大优势，有针对性地补足短板，而不是把学生塞进固定的模子。"
    - title: 成长，远不止录取
      text: "秉承哈佛“全人培养”与“追求真理”的教育理念，培养学生在大学乃至一生受用的好奇心、能力与品格。"

journey:
  eyebrow: 服务流程
  title: "从第一次对话，到最终的录取选择"
  intro: "每一段旅程都遵循清晰严谨的路径，而每一份规划都独一无二。"
  link_text: 了解服务流程
  link: "about.html#how-we-work"
  steps:
    - title: 了解
      text: "免费规划咨询，深入了解学生的背景、目标、兴趣与性格。"
    - title: 规划
      text: "量身定制的多年发展路线图：参加哪些活动、科研和实习，以及何时进行，并由专属导师全程指导。"
    - title: 提升
      highlight: true
      text: "通过真实的科研、名校研学和国际舞台，让背景真正立起来，各项目相辅相成。"
      links:
        - { label: 科研与实习, link: research.html }
        - { label: 名校深度研学, link: experiences/campus-immersion.html }
        - { label: 全球领导力会议, link: experiences/global-conferences.html }
    - title: 申请
      text: "申请策略与选校、文书头脑风暴与修改、活动列表、推荐信及面试准备。"
    - title: 抉择
      text: "协助比较录取结果、应对候补名单，为大学生活做好准备。"

