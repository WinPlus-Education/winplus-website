help:
- title: A profile that proves the story
  text: We find the genuine thread in a student's interests, then build the evidence through research, internships, leadership and global experiences, so the application describes real
    accomplishments rather than promises.
- title: Strategy for the most selective schools
  text: A balanced school list and a deliberate early-round plan (REA, ED, EA), shaped by first-hand insight into each university's culture, priorities and current policies on testing
    and essays.
- title: Essays and interviews with insiders
  text: Personal statements and supplements developed over many rounds with mentors from Harvard, Yale and Stanford, and interview preparation with Ivy League alumni interviewers.
highlight:
  label: Featured outcome
  title: Yale, with scholarship, Penn and Johns Hopkins
  text: A student who started with WinPlus the summer after Grade 9 added international leadership and research recommendations to a strong academic record, earned interviews at every
    Ivy she applied to, and was admitted to Yale with scholarship, Penn and Johns Hopkins.
faq:
- q: What's included in US college admissions counseling?
  a: A profile assessment and multi-year roadmap; course, testing and summer planning; research, internship and leadership planning; a school list with early-round strategy; Common App
    and supplemental essays; activities list; recommendation planning; interview preparation; and decision, waitlist and financial-aid guidance.
- q: Do you offer Ivy League admissions consulting?
  a: Yes. Ivy League strategy is part of our US college program, including REA/ED/EA strategy, essays developed with mentors from Harvard, Yale and Stanford, and interview preparation
    with Ivy League alumni interviewers. WinPlus students have been admitted to Harvard, Yale, Princeton, Columbia, Penn and Brown.
- q: Should my child apply Early Decision?
  a: Early Decision can raise admission chances at some universities but is binding. We help families weigh the advantage against fit and financial aid, school by school.
- q: Are SAT or ACT scores still required?
  a: Policies differ by university and change often; several highly selective universities have reinstated testing requirements. We review each school's current policy every cycle and
    advise whether and when to submit.
