summary: 在联合国欧洲总部所在地日内瓦开展人文研学，走近全球国际合作的中心。
statement: 在世界谈判的城市，学生探究国际合作如何真正运作。
details: '日内瓦是联合国日内瓦办事处（万国宫）所在地，也汇聚了数十个国际组织和数百家非政府组织，涉及卫生、贸易、劳工、人权与人道主义等领域。


  2024 年 2 月，WinPlus 学生前往日内瓦参加国际组织人文研学营，探究全球机构如何建立，以及外交如何把共同的问题变成共同的规则。'
