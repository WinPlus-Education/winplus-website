summary_statement: 顶尖大学录取的是人，而不是成绩单。他们看重视野、主动性和领导的勇气。
summary_text: 我们的国际体验项目给予学生屏幕无法替代的东西：走进 MIT 实验室的真实感受、与哈佛教授的坦诚交流、面向国际代表发言的那一刻。学生带着对自己归属的清晰认识归来，这些经历也会成为申请中最有力的素材。
