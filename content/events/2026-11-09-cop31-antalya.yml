details: 'COP31, the 2026 UN Climate Change Conference, brings heads of state, negotiators, scientists and business leaders to Antalya, Türkiye, to turn the Paris Agreement into action.


  Led by Harvard-alumni mentors, the WinPlus delegation joins the conference from November 9 to 13 with access to the Blue Zone, the accredited heart of the summit. Students arrive prepared: they learn how the UN climate process works, choose the issues they care about most and bring a question of their own into the room.


  COP31 builds on our [COP28 delegation in Dubai](cop28-dubai.html), where WinPlus students presented climate research at the China Pavilion and were featured on national television.


  *WinPlus is an independent education company. Participation follows the conference''s own registration and accreditation rules and does not imply endorsement by the UNFCCC or the COP31 Presidency. Official information: [cop31.tr](https://cop31.tr/).*'
