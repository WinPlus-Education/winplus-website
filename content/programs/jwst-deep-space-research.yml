title: Space Telescope Mission Design
industry: science-space
type: research
status: open
mentor_id: rachel-morgan
seo_title: Space Telescope Research for High Schoolers | WinPlus
meta_description: Design a space-telescope mission (optics, mechanics and science goals) in eight weeks with an optical scientist at NASA Ames Research Center (MIT PhD).
summary: Design your own space-telescope mission, from science goal to optical and mechanical design, with an optical scientist at NASA Ames Research Center.
image: https://images.unsplash.com/photo-1462332420958-a05d1e002413
image_alt: A colourful nebula in deep space
format: Online · 8 mentor meetings
length: 8 weeks
dates: Summer 2027 · dates to be confirmed
cohort: Small group
overview: 'Every great telescope, from Hubble to the James Webb Space Telescope, starts with a question about the universe. Students choose a science goal, name their mission and design
  the telescope to answer it, working through the same trade-offs NASA engineers face: aperture, field of view, detectors, orbit and stability.


  Students take the role of mission scientist, optical engineer or mechanical engineer, building ray-tracing simulations and CAD or physical models, and finish with a design review like
  a real mission team.'
outcomes:
- A technical mission-design report
- Optical ray-tracing simulation and mechanical CAD or physical model
- A design-review presentation to mentors
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: Science motivation
  text: Recent space-telescope missions; define a science goal and mission requirements.
- phase: Week 3
  title: Preliminary design
  text: Key parameters (telescope size, type, detectors, orbit) with supporting calculations.
- phase: Weeks 4–5
  title: Optical & mechanical models
  text: Ray-tracing simulation, aberrations and stability; CAD or physical model.
- phase: Weeks 6–8
  title: Design review
  text: Finalise the design, communicate the mission and present the final portfolio.
eligibility:
- Grades 9–12
- Strong interest in physics, astronomy or engineering
- Algebra and trigonometry; no prior CAD required
mentor_note: Optical scientist, NASA Ames Research Center; MIT PhD
