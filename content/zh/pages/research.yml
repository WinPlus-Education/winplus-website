faq_title: 科研与实习常见问题
faq:
- q: WinPlus 科研项目的导师是谁？
  a: 我们的导师是在职科学家、工程师和研究员，拥有 NASA、Meta、微软、苹果、彭博、加州理工、MIT、哈佛等机构背景。每个项目页面都列出了导师背景。机构名称仅说明导师的职业背景，项目由 WinPlus 运营。
- q: 项目是线上进行吗？
  a: 是的。科研与实习项目通过线上直播与导师互动，学生可在任何地方参加，时间兼顾美国与亚洲时区。
- q: 孩子需要有相关基础吗？
  a: 大多数项目面向有动力的初学者。部分进阶项目需要基础编程或数学能力，具体要求见各项目页面的“申请条件”。
- q: 科研项目和实习项目有什么区别？
  a: 科研项目以原创问题为核心，最终完成论文或报告；实习项目以动手打造产品、模型或原型为核心，模拟行业团队的工作方式。两者都有导师、每周成果和期末汇报。
- q: 孩子一定能拿到推荐信吗？
  a: 导师会为完成项目并表现优秀的学生撰写推荐信。推荐信需要争取，并非自动获得，这也正是它在招生官眼中有分量的原因。
- q: 学生可以发表研究成果吗？
  a: 部分项目适合投稿至学生期刊、会议或竞赛。当成果成熟时，导师和 WinPlus 顾问会推荐合适的渠道。
- q: 项目时长多久？什么时候开课？
  a: 大多数项目为 6–8 周，主要在暑期（6–8 月）开课，部分项目春季即可开始。各项目页面会标明当前是否开放申请。
- q: 如何选择合适的项目？
  a: 预约免费规划咨询，我们会根据学生的兴趣、年级和申请规划推荐合适的项目。
