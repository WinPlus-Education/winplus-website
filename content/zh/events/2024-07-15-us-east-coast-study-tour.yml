summary: 为人大附中 15 名学生打造的 12 天项目：十所名校，以及麦肯锡、Meta、国际货币基金组织与 NASA。
details: WinPlus 与中国人民大学附属中学联合打造，带领 15 名学生走访哈佛、MIT、布朗、耶鲁、普林斯顿、宾大、哥伦比亚、纽约大学、约翰霍普金斯与乔治城等十所大学；参访麦肯锡、Meta 纽约办公室与 BrainCo；与国际货币基金组织经济学家交流，聆听联合国维和官员分享，在 MIT 体验帆船，并跟随前耶鲁校队队长学习壁球。
gallery: []
testimonials:
- quote: 在 MIT 的 Sea Grant 实验室，教授告诉我们角落里那台机器人可以携带传感器下潜三千米。那一刻我才真正感受到 MIT 科研实力的深厚。
  name: 学员
