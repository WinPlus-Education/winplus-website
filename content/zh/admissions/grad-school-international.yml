faq:
  - q: 英国一年制硕士认可度高吗？
    a: 认可度很高，很多英国硕士项目享有国际声誉。我们会帮助你根据目标权衡一年制和两年制项目。
  - q: 申请前需要联系导师吗？
    a: 英国、加拿大、澳大利亚的很多研究型学位都需要提前联系潜在导师。我们会帮助你做好这一步。
