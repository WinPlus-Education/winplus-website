consent:
  version: "2026-11-04 draft"
  inquiry_notice: "WinPlus 将使用您提供的信息回复您的咨询并提供项目信息，详见我们的隐私政策。标有 * 的为必填项；如未填写，我们可能无法回复。您的信息将在美国处理。"
  marketing: "是的，我愿意通过电子邮件接收 WinPlus Education and Technology Inc.（[填写邮寄地址]，[填写联系邮箱]）发送的通讯、白皮书以及 WinPlus 项目和活动信息。WinPlus 将为此使用我的姓名和电子邮箱。我可随时退订。"
