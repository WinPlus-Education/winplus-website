- id: mike-medavoy
  name: Mike Medavoy
  initials: MM
  title: Hollywood Producer · Co-Founder, Phoenix Pictures and Orion Pictures
  education: UCLA
  photo: /images/uploads/team/mike-medavoy.webp
  bio: 'Mike Medavoy is a veteran Hollywood producer, co-founder of Phoenix Pictures and a UCLA graduate. His career spans talent representation, studio management and production. He co-founded Orion Pictures and held senior roles at United Artists and TriStar. His work includes Black Swan, Shutter Island, Zodiac and The Thin Red Line.


    Through WinPlus, he has led visits to a Hollywood production company and shared insights into filmmaking, the entertainment industry and talent representation. Students learn how stories become projects and how directors, actors, writers, producers and agents connect creative ideas with financing and audiences.'
  founder: false
- id: rachel-morgan
  name: Rachel Morgan
  initials: RM
  title: Optical Scientist, NASA Ames Research Center
  education: PhD and MS in Aerospace Engineering, MIT
  photo: /images/uploads/team/rachel-morgan.webp
  bio: 'Rachel Morgan is an optical scientist conducting research at NASA Ames, with undergraduate qualifications in aerospace engineering and physics and an MS and PhD from MIT. She applies integrated photonics to instruments for detecting Earth-like exoplanets, with research experience at JPL and MIT Lincoln Laboratory.


    At WinPlus, Rachel mentors Space Telescope Mission Design.'
  founder: false
  org: NASA Ames Research Center
- id: anhphu-nguyen
  name: AnhPhu Nguyen
  initials: AN
  title: Technology Entrepreneur · Co-Founder, MIRA
  education: Harvard University
  photo: ''
  bio: 'AnhPhu Nguyen is a technology entrepreneur and co-founder of smart-glasses company MIRA. He studied Human Augmentation at Harvard, connecting computing, engineering and human–computer interaction. His early phone-repair business was featured by Harvard’s engineering school, and he helped establish an AR/VR developers’ club to explore wearables and interactive technology.


    At WinPlus, he advises undergraduate applicants in computer science and AI, leads learning visits to Harvard’s engineering school and has helped students gain undergraduate admission to Harvard and Stanford. His experience links device repair and prototyping with user needs and product development.'
  founder: false
- id: cedric-pan
  name: Cedric Pan
  initials: CP
  title: Co-Founder
  education: MPP, Harvard Kennedy School · EdM, Harvard · BA, Peking University
  photo: /images/uploads/team/cedric-pan.webp
  bio: 'Cedric Pan holds a Master in Public Policy from Harvard Kennedy School and a Master of Education from Harvard, and dual bachelor''s degrees in urban planning and economics from Peking University. He mentors in an MIT aerospace entrepreneurship program.


    He has held executive roles at a Silicon Valley autonomous-driving company, a multinational ride-sharing company and a Boston K-12 education technology company, and earlier worked with the Development Research Center of the State Council and China Development Bank.'
  founder: true
- id: vania-shi
  name: Vania Shi
  initials: VS
  title: Founder, Court Square Advisors
  education: Master of Finance, MIT Sloan · BCom, Queen's University
  photo: /images/uploads/team/vania-shi.webp
  bio: 'Vania Shi founded Court Square Advisors, a New York strategy and operations advisory firm. She holds a Master of Finance from MIT Sloan and an Honours Bachelor of Commerce from Queen’s University. Her decade-plus experience includes Morrison and Altman Solon, covering growth strategy, commercial due diligence, operational improvement and capital formation.


    At WinPlus, she advises undergraduate business applicants and candidates for MBA, finance and business-analytics master’s programs. She has led visits to MIT Sloan and helped applicants gain admission to Harvard Business School, MIT Sloan and Wharton.'
  founder: false
