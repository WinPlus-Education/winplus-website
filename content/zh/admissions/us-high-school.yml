faq:
  - q: 孩子应该在几年级入读美国寄宿高中？
    a: 9 年级是最常见的入学年级，很多学校也招收 10 年级学生。我们会根据孩子的准备情况给出建议。
  - q: 一定要考 SSAT 吗？
    a: 很多寄宿高中要求或建议提交 SSAT 或 ISEE 成绩，国际学生通常还需要托福等语言成绩。具体要求因校而异。
