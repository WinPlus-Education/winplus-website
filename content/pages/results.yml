highlights_title: Student stories
highlights:
  - title: "The only high-school speaker at a UN conference"
    tag: Global Stage
    text: "Background: a 17-year-old high school student. What we did: UN issue training and guidance at every step. Result: the only high-school student speaker at the 19th Conference of States Parties to the CRPD (COSP19), UN Headquarters, New York, June 2026."
    image: /images/uploads/students/un-cosp19-speaker.jpg
    image_alt: A WinPlus student speaking at a United Nations conference
    link: enrichment/un-conferences.html
  - title: "From mid-range grades to Harvard and Yale"
    tag: Ivy League
    text: "Background: average grades with top-university goals. What we did: an Ivy League plan built on our Eight Key Elements framework. Result: admitted to Harvard and Yale, with scholarship."
    image: /images/uploads/students/ivy-admit-story.jpg
    image_alt: A WinPlus student presenting her work
    link: admissions/us-college.html
  - title: "From no SAT or TOEFL to a UC scholarship"
    tag: Turnaround
    text: "Background: started without TOEFL or SAT scores. What we did: a structured plan across testing, research and essays. Result: admitted to the University of California system with a scholarship."
    image: /images/uploads/students/uc-scholarship-story.jpg
    image_alt: A WinPlus student on a university visit
    link: research.html

