summary: Twelve days across Harvard, MIT, Yale, Princeton and Silicon Valley, with seminars from professors including a former NASA astronaut, lab visits and admissions sessions.
details: Students took part in 50 hours of global competency coursework taught by mentors from Harvard, MIT and Yale, including sessions on AI, fintech, aerospace engineering, international affairs and
  leadership. They visited labs including the MIT Media Lab and aerospace labs, met current students and alumni, and received a personalised US admissions plan.
