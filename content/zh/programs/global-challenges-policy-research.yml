seo_title: 高中生全球政策研究项目（可持续发展目标）| WinPlus 欧歌学院
meta_description: 研究一项全球挑战（儿童权利、教育、性别平等或气候），完成政策论文与简报，由哈佛研究员、前联合国儿童基金会官员指导。
summary: 把对世界的关切变成严谨研究：围绕儿童权利、教育、性别或气候撰写政策论文与简报，由哈佛研究员、前联合国儿童基金会官员指导。
image: /images/uploads/photos/hks-session.webp
image_alt: 学生在哈佛肯尼迪学院参加导师讨论
format: 线上 · 导师直播课
length: 8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: '关心世界重大问题的学生，将学习像政策专业人士一样开展研究。每位学生在儿童权利、教育、性别平等或气候中选择一个问题，了解国际机构与可持续发展目标（SDGs）如何应对它。


  学生基于学术文献与国际报告撰写注释书目，比较真实案例，并提出兼顾可行性与落地实施的循证建议。'
outcomes:
- 10–15 页研究论文
- 两页政策简报
- 10–15 分钟成果展示
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 确定问题
  text: 国际机构、可持续发展目标与研究问题的选择。
- phase: 第 3–4 周
  title: 收集证据
  text: 注释书目：5–7 篇学术文献与 2–3 份国际报告。
- phase: 第 5–6 周
  title: 案例比较
  text: 比较 2–3 个案例，提出 3–5 条建议。
- phase: 第 7–8 周
  title: 论文与简报
  text: 撰写论文与政策简报，展示研究发现。
eligibility:
- 9–12 年级
- 具备较强的英文阅读与写作能力
- 对政治、法律、经济或国际事务感兴趣
