highlights_title: What we did
highlights:
- title: A speech at the China Pavilion
  image: /images/uploads/photos/cop28-china-pavilion-speech.webp
  text: At a Blue Zone side event hosted by the All-China Environment Federation, a student spoke on how schools can lead on climate action, at a session also addressed by China's climate envoy Xie Zhenhua.
- title: Research on a world stage
  image: /images/uploads/photos/cop28-posters.webp
  text: For two days, the students presented research posters outside the China Pavilion, discussing their findings with delegates, scholars and young leaders from around the world.
- title: Featured on national television
  image: /images/uploads/photos/cop28-cctv.webp
  text: CCTV-2's Economic Information News covered the students' exhibition, and COP28's official media channels shared their work.
- title: Dialogues with leaders
  image: /images/uploads/photos/cop28-al-nuaimi.webp
  text: The delegation met Dr. Ali Rashid Al Nuaimi, Chair of the UAE Federal National Council's Defence, Interior and Foreign Affairs Committee, and joined a Harvard Club dinner with leaders from across the region.
- title: Seminars at leading universities
  image: /images/uploads/photos/cop28-nyuad.webp
  text: A climate-law lecture at NYU Abu Dhabi and academic exchanges at the University of Sharjah and the American University of Sharjah.
- title: Innovation and culture
  image: /images/uploads/photos/cop28-grand-mosque.webp
  text: From the UAE Space Agency pavilion to the Sheikh Zayed Grand Mosque, students saw how a fast-changing region approaches sustainability.
