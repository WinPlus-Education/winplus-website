overview: "学生研究一个全球议题，撰写立场陈述，并作为 WinPlus 代表团成员参加联合国会议。往届项目包括联合国土著问题常设论坛（UNPFII）及《残疾人权利公约》第十九届缔约国大会（COSP19）。"
activities:
  - 行前培训：了解联合国体系与会议议题
  - 政策研究与立场撰写
  - 参加联合国会议及边会
  - 与各国代表、非政府组织及专家交流
  - 复盘、成果展示与后续项目
deliverables:
