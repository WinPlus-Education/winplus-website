  bio: 'Hannah Tomio is a laser-physics postdoctoral researcher at the University of Bern with an MIT aerospace PhD. She studied electrical and computer engineering at Carnegie Mellon and earned a master’s
    at Tohoku University. Her experience includes NASA Goddard, JPL and Boeing.


    At WinPlus, Hannah mentors Satellite Constellation & Orbit Design.'
