faq:
- q: Who is Campus Immersion for?
  a: Middle and high school students (typically ages 12–18) who want to understand top US universities first-hand before applying. All sessions are in English; WinPlus staff support students throughout.
- q: How many students are in a cohort?
  a: Cohorts are kept small, around 20 students, so every student is known and supported.
- q: Who travels with the students?
  a: WinPlus staff accompany the cohort from departure, and WinPlus mentors lead the program in the US. [Add staff ratio and safety details.]
- q: What does the program cost?
  a: Fees vary by year and route and typically include coursework, accommodation, ground transport, meals and tickets. International flights, visa fees and travel insurance are not included; our team helps
    families arrange them. Contact us for the current fee.
