faq:
  - q: Can my child apply to the US and the UK at the same time?
    a: Yes, and many of our students do. The applications are very different (the UK focuses on one subject), so we plan both together from the start.
  - q: How is Oxbridge different?
    a: Oxford and Cambridge have earlier deadlines, often require admissions tests and hold academic interviews. Preparation should start in Grade 11.
  - q: Do Canadian and Australian universities require essays?
    a: Requirements vary. Some programs ask for supplementary applications, personal profiles or interviews; many rely mainly on grades.
