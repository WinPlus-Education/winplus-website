cases_title: 精选案例与学员故事
cases_intro: 截然不同的起点，同一种方法：围绕学生本人制定规划。
cases:
- tag: 常春藤
  title: 从年级第一到耶鲁（含奖学金）
  start: 9 年级暑假开始指导。GPA 4.0，14 门 AP 满分，年级排名 1/300+，托福 117，SAT 1550。生物与公共卫生活动丰富，但缺少国际影响力。
  strategy: 补足国际领导力与专家推荐：申请国际女性大会发言，由美国疾控中心专家与北大全球健康教授指导科研，并由耶鲁校友面试官与哈佛导师共同指导文书与模拟面试。
  change: 在曼谷全球女性大会上台发言，绘画作品入选大会画展；获得两封专家推荐信；50+ 轮文书修改；获得所申请藤校全部面试。
  outcome: 录取耶鲁（含奖学金）、宾大、约翰霍普金斯、圣母大学、加州伯克利与加州洛杉矶。
- tag: 逆袭
  title: 从无托福、无 SAT 到 Top 50 录取与 18 万美元奖学金
  start: 11 年级暑假开始指导。GPA 约 3.5，无托福、无 SAT、无科研。活动丰富但缺少亮点与国际高度。
  strategy: 八大要素全面拔高：密集的标化提分计划、与地理信息科学教授合作三个月科研、参加联合国气候大会，以及摄影作品集与个人影展。
  change: 托福 99、SAT 1400（拼分）；发表一篇 GIS 研究论文；在联合国气候大会上发言；举办摄影展并在杂志发表作品；在儿童医院举办大提琴慈善演出。
  outcome: 录取加州戴维斯、波士顿大学、普渡、东北大学与俄亥俄州立，并获加州河滨 8 万美元、加州圣克鲁兹 6 万美元、雪城 4 万美元奖学金；加州洛杉矶与加州圣地亚哥候补。
- tag: 美英双轨
  title: 剑桥天体物理与加州伯克利：一份背景，双轨录取
  start: 一位热爱天文的学生，希望同时保留美国与英国两条路径，而两种体系看重的能力截然不同。
  strategy: 打造同时服务两国申请的背景：2024 年美国东海岸名校研学；2025 年与 NASA 科学家进行小班科研，使用 CODE V 光学软件研究系外行星望远镜设计，并获得导师推荐信。
  change: 科研深度支撑了英国个人陈述与剑桥面试（学生在面试中运用了镜面材料晶体堆积的研究经验），同时构建了融合天文与 STEM 教育的美国申请叙事。
  outcome: 获剑桥大学（天体物理）录取，并被加州大学伯克利分校录取。
stories:
- tag: 国际舞台
  title: WinPlus 学生在联合国总部 COSP19 发言
  text: 2026 年 6 月，一位 17 岁的 WinPlus 学生作为唯一的高中生发言人，在纽约联合国总部举行的《残疾人权利公约》第十九届缔约国大会上发言。
  story: '**麦克风前的两分钟。** 2026 年 6 月 10 日，纽约联合国总部，《残疾人权利公约》第十九届缔约国大会正在进行。主持人说：“下面，我们有请来自中国的 NGO 代表发言。”一位 17 岁的 WinPlus 学生打开话筒，开始了两分多钟的发言：从父亲对他的影响讲起，谈到医学的边界，谈到残障同龄人在校园里遇到的有形与无形的障碍，最后落在年轻一代的责任上。*“一双医生的手，一次只能挽救一条生命；一个包容的社会，却能改变千千万万人的命运。”* 发言结束，掌声响起，这个 17 岁的声音被正式记录在联合国的会议里。


    **医学问题，还是社会问题？** 他的父亲是一名外科医生，最忙时一天要做七台手术。他习惯从“治疗”和“康复”的角度看待残障，但写着发言稿，他意识到：医生能恢复身体的功能，却恢复不了一个人在社会中的归属感。


    **走进联合国。** 在 WinPlus 联合创始人、哈佛肯尼迪学院校友、曾任职于联合国妇女署的郭琪老师和 WinPlus 导师的带领下，他带着时差从上午十点一直听到下午六点，主动与来自沙特、日本、西班牙等国的代表交流各国的残障保障。一场几乎全部由聋人发言者用手语进行的边会让他第一次直观感受到：手语承载着聋人的文化、身份认同与争取平等的历程。一位来自纽约的自闭症青年倡导者，让他真正理解了会场里反复提及的理念：*“Nothing About Us Without Us”*（没有我们的参与，就不要替我们做决定）。在“共绽放——中国残疾人文创作品展”上，4 岁因病致残的东阳木雕大师胡先民对他说：“残疾是身体上的一种缺陷，但它不能定义一个人的勇气。”


    **从第 153 位到发言席。** 在联合国正式会场发言，需要资格审核、文书提交与登记排队，他最初排在第 153 位。郭老师主动向会场负责人介绍他，他也带着讲稿一直等待；随着前面的发言者陆续取消，他终于等到了属于自己的两分钟。发言前他紧张得满脸通红，导师鼓励他：“你将来是要成为世界级医生、站在联合国大厅发言的，今天这个小演讲，你可以的。”作为为数不多的青年发言者，他一开口，不少与会者频频回头。


    **掌声之后。** 当天下午，郭老师通过哈佛校友网络，为他安排了与一位肯尼迪学院校友、残障领域研究者和律师的一对一交流，讲解国际残障权益立法背后的思路。通过联合国直播看完发言的妈妈说：“孩子放开了很多……收获满满，不虚此行。特别感谢老师们的精心安排和全程陪伴！”


    **留下的东西。** “能在联合国讲完那两分多钟，这一趟就完全值了。”如今他已开启大学申请季，而他发言的最后一句，或许是这趟旅程最好的注脚：*“我们这代人终将成为制度的设计者，而这个责任不必等到未来在权力的殿堂里才开始，它现在就发生在我们学校的走廊里。”*'
