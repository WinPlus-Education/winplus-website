faq:
  title: 常见问题
  items:
    - q: WinPlus 欧歌学院提供哪些服务？
      a: WinPlus 是面向初高中生的全周期人才培养平台，提供升学规划、导师指导的科研与实习项目，以及联合国会议等国际背景提升项目，并由一位专属顾问统筹协调。
    - q: 你们可以帮助申请哪些国家的大学？
      a: 我们提供美国、英国、加拿大、澳大利亚的本科申请，美国及英加澳的研究生申请，以及美国寄宿高中与私立高中申请指导。
    - q: 学生应该什么时候开始规划？
      a: 建议在 9 年级或 10 年级开始，这样有充足时间积累科研经历、打造完整背景。我们也为 11、12 年级学生提供针对性的申请支持。
    - q: 为什么需要留学顾问？
      a: 像 WinPlus 这样的留学咨询机构会从选课、活动规划一直到选校、文书和面试，为学生和家庭提供升学指导。申请美国名校、常春藤盟校或英国 G5 时，顾问能帮助学生提前多年规划，积累真实的兴趣证据，并呈现一份逻辑清晰、有说服力的申请。
    - q: 你们提供藤校申请规划吗？
      a: 提供。我们的藤校申请规划包括多年背景提升方案、导师指导的科研项目、50+ 轮文书精修、REA/ED 早申策略和面试辅导。WinPlus 学员已获得哈佛、耶鲁、普林斯顿、哥伦比亚、宾大和布朗的录取。
    - q: WinPlus 学员取得了哪些录取成果？
      a: 截至 2026 年 7 月，WinPlus 已累计指导 100+ 名学生，斩获 87 封 Top30 及常春藤名校录取，其中耶鲁大学连续三年获录取，并获得牛津、剑桥、帝国理工、UCL、LSE 等英国 G5 名校录取。
    - q: 国际学生可以申请美国大学吗？
      a: 可以。我们的许多学生从中国及其他国家申请美国大学。我们会全程指导美国本科申请，包括选校、标化考试（SAT/ACT、托福）、文书、面试及奖助学金相关问题。
    - q: 如何开始？
      a: 预约一次免费规划咨询。我们会了解学生的目标与现有背景，并给出初步建议，无需任何承诺。

