overview: 'Thousands of satellites now circle the Earth to connect the world. How are those networks designed? Students study orbital altitude, inclination, period, coverage and revisit
  time, then use NASA''s GMAT software to simulate orbits for a communication mission of their choice.


  They compare radio and optical (laser) communications, learn the key components and build a simplified link budget, the kind of engineering reasoning used across the space industry.'
outcomes:
- A research paper or design portfolio with constellation architecture
- GMAT orbit simulations and a network diagram
- A final presentation of design justifications
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: Orbital mechanics
  text: Altitude, inclination, period, coverage and revisit time.
- phase: Weeks 3–4
  title: Simulation
  text: Orbit simulation in NASA's GMAT; comparing constellation arrangements.
- phase: Weeks 5–6
  title: Communications
  text: Radio versus optical links; components; a simplified link budget.
- phase: Weeks 7–8
  title: Design & present
  text: Requirements, architecture, simulations and justifications.
eligibility:
- Grades 9–12
- Strong interest in physics, aerospace or electrical engineering
- Comfort with algebra and trigonometry
