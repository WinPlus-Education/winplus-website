seo_title: "我们的团队 | 升学顾问、导师与创始人 | WinPlus 欧歌学院"
meta_description: "认识 WinPlus 欧歌学院团队：创始人郭琪、盘超，升学顾问，以及来自哈佛、MIT、NASA、Meta、联合国、哥伦比亚大学等机构的导师。"
eyebrow: 我们的团队
title: 每一位 WinPlus 学员背后的团队
intro: WinPlus 是全周期人才培养平台，陪伴学生从 9 年级走向世界名校录取，并为未来做好准备。认识让这一切成为可能的团队。
image: https://images.unsplash.com/photo-1758873269811-4e62e346b4b7
image_alt: 团队围坐在桌边协作

what_title: 我们做什么
what:
  - { title: "升学规划", text: "美国、英国、加拿大、澳大利亚本科及研究生申请，以及美国高中申请。", link: admissions.html }
  - { title: "科研与实习", text: "人工智能、金融、科学与艺术领域的导师制科研与实习项目。", link: research.html }
  - { title: "国际背景提升", text: "联合国会议、全球胜任力夏校与冬校，以及领导力项目。", link: enrichment.html }

compare_title: 一站式平台 vs. 分散的多家机构
without:
  label: 没有一体化平台
  heading: 每项需求都要找一家机构。
  center: 学生与家长
  vendors: [升学顾问, 科研项目, 实习机构, 标化培训, 文书老师]
  note: 向每一家重复讲述你的故事，五份规划却互不衔接。
with:
  label: 选择 WinPlus
  heading: 一位人才顾问统筹全程。
  center: 你的专属人才顾问
  stages: ["9–10 年级 · 背景打造", "10–11 年级 · 科研与能力", "11 年级 · 申请策略", "12 年级 · 申请执行", "录取及未来"]
benefits:
  - { title: "连贯一致", text: "从 9 年级到录取，始终是同一段关系。" }
  - { title: "一位专属顾问", text: "一位顾问负责孩子的完整成长路径。" }
  - { title: "真正的个性化规划", text: "一套围绕学生本人打造的完整策略。" }
  - { title: "更高性价比", text: "避免多家机构的重复收费。" }

