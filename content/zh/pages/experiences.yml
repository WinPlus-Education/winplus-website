faq_title: 全球体验项目：常见问题解答
faq:
- q: 名校深度研学和普通参观有什么区别？
  a: 不只看校园建筑，更深入大学的学习与生活。名校深度研学让学生走进实验室、课堂与企业，动手实践，与教授和导师研讨、与在校生深入交流，并参加招生讲座，帮助学生理解哪些大学适合自己，以及为什么。
- q: 研学营能带来什么收获？内向的孩子适合吗？
  a: 研学营通过课程、校园体验、导师交流及机构参访，帮助学生了解不同专业与职业路径，并练习合作和跨文化沟通。内向的孩子同样适合，可以从准备问题、小组交流和任务汇报开始，在参与中逐步建立表达信心。
- q: 学生真的能在国际会议上发言吗？
  a: 发言机会取决于各会议的形式与规则，无法保证。我们让每位学生都做好参与的准备：参加分会场与边会、与代表交流，并在会议允许时展示研究。我们的学生曾在联合国总部 COSP19 发言，并在 COP28 发表气候研究。
- q: 谁可以申请？如何选拔？
  a: 名校深度研学面向约 12–18 岁的学生。全球领导力会议面向对全球议题有真正兴趣的高中生。我们依据准备程度与投入度选拔，而不只是先到先得，名额有限。
- q: 如何保障学生的安全与监护？
  a: 研学营由国内老师带队统一出发，美国当地导师全程陪同；每期人数有限，便于老师照顾到每位学生。住宿安排在希尔顿或同级酒店，当地出行使用统一包车，三餐统一安排。出发前，我们会进行行前培训，讲解行程、课程和安全注意事项，并协助每位学生购买旅游保险。
- q: 项目费用包含哪些？
  a: 项目费通常包含教授、导师、招生官等课程费，在美期间的酒店住宿、当地交通和三餐，以及景点、演出等门票；不含国际往返机票、签证费、旅游保险和个人消费。各期项目的具体费用以当期项目说明为准，退费规则以服务合同约定为准。
- q: 签证、机票需要自己办吗？
  a: 我们会协助指导每位学生完成美国签证申请，并指导购买机票和旅游保险，相关费用由家庭自行承担。签证面谈的预约时间因地区和季节而异，建议报名后尽早启动；机票也建议在团队确认航班安排后尽快购买。
- q: 报名流程是怎样的？
  a: '1. **咨询报名：**联系负责老师了解项目，填写报名表

    2. **签约缴费：**签署服务合同，支付项目费用

    3. **签证机票：**在老师指导下办理签证，购买机票和保险

    4. **行前培训：**讲解行程、课程和安全注意事项

    5. **正式出行：**跟随带队老师统一出发


    研学营采用滚动招生，名额有限，招满为止。'
- q: 这对大学申请有什么帮助？
  a: 招生官看重的是主动性与影响力，而不是旅行经历。我们帮助学生把体验转化为具体的东西：一个研究问题、一个项目、一个领导角色，或一种影响文书与面试的视角。
- q: WinPlus 与所访问的大学或机构有隶属关系吗？
  a: 没有。WinPlus 是独立教育机构。参访与课程通过我们的导师与合作伙伴安排，会议参与遵循各会议自身规则。相关名称仅说明学生去往的地点，不代表其对 WinPlus 的认可。
