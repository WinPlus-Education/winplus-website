overview: Students develop their voice as storytellers, learning the craft of screenwriting and directing used in professional film, then produce an original short film for their portfolio.
activities:
- Story development and screenplay structure
- Writing and revising an original short screenplay
- Shot planning, directing actors and production basics
- Editing and post-production
- Screening and critique at the final showcase
