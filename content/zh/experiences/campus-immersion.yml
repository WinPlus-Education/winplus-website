features_title: 与众不同之处
features:
- title: 走进实验室，而不是站在门外
  text: 参访 MIT 媒体实验室、航空航天与工程实验室、斯坦福干细胞研究所等，听研究人员讲解工作，并完成动手挑战。
- title: 由真正在那里授课的人来讲
  text: WinPlus 导师与来自哈佛、MIT、耶鲁、斯坦福的嘉宾（包括前 NASA 宇航员、MIT 教授）讲授领导力、国际关系、人工智能、基因编辑与航天工程。
- title: 真实的大学生活
  text: 在大学食堂用餐，与在校生和校友交流，亲身感受每所校园的文化、节奏与氛围。
- title: 揭开招生的面纱
  text: 参加名校招生说明会，并由 WinPlus 导师为每位学员定制美国本科升学规划。
- title: 从创意到产业
  text: 参访 Meta、苹果、谷歌等科技企业，以及 NASA、联合国总部和好莱坞制片公司。
- title: 全球胜任力认证
  text: 课程围绕全球分析、文化共情、多元沟通与可持续行动四大胜任力设计，结业颁发《WinPlus 全球胜任力证书》。
itinerary_title: 行程一览
itinerary_note: 以 2025 年行程为例，每年具体路线以出发前确认为准。
itinerary:
- city: 纽约
  days: 第 1–4 天
  text: 哥伦比亚大学与纽约大学课程、联合国总部、华尔街与城市博物馆。
- city: 纽黑文与波士顿
  days: 第 5–6 天
  text: 耶鲁、哈佛与 MIT：实验室参访、导师课程、哈佛肯尼迪学院与查尔斯河。
- city: 硅谷
  days: 第 7–9 天
  text: 斯坦福、加州伯克利、科技企业总部与 NASA 艾姆斯研究中心。
- city: 洛杉矶
  days: 第 10–12 天
  text: UCLA 与南加州大学、好莱坞制片公司与结业仪式。
outcomes_title: 学员将收获
outcomes:
- 清楚了解哪些大学、哪种大学文化适合自己
