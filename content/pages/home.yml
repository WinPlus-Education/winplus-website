faq:
  title: Frequently asked questions
  items:
    - q: What does WinPlus do?
      a: WinPlus is a global talent development platform for high school students. We combine college admissions counseling, mentor-led research and internship programs, and enrichment experiences such as UN conferences, all coordinated by one dedicated consultant.
    - q: Which countries' universities do you help students apply to?
      a: We advise on undergraduate admissions to the United States, United Kingdom, Canada and Australia, graduate school admissions in the US, UK, Canada and Australia, and US boarding and high school admissions.
    - q: When should a student start working with WinPlus?
      a: Ideally in Grade 9 or 10, which leaves time to build research experience and a coherent profile. We also work with students in Grades 11 and 12 who need focused application support.
    - q: What is an education consultancy, and why work with one for college admissions?
      a: An education consultancy such as WinPlus advises students and families on university admissions, from choosing courses and activities to school lists, essays and interviews. For selective US, Ivy League and UK G5 universities, a consultant helps a student plan years ahead, build real evidence of their interests and present a coherent application.
    - q: Do you offer Ivy League admissions consulting?
      a: Yes. Our Ivy League admissions consulting combines a multi-year profile plan, mentor-led research, 50+ rounds of essay editing, early-round (REA/ED) strategy and interview coaching. WinPlus students have been admitted to Harvard, Yale, Princeton, Columbia, Penn and Brown.
    - q: What results have WinPlus students achieved?
      a: As of July 2026, WinPlus has guided 100+ students to 87 offers from Top-30 and Ivy League universities, including Yale admissions three years in a row, and offers from UK G5 universities such as Oxford, Cambridge, Imperial, UCL and LSE.
    - q: Do you help international students apply to US universities?
      a: Yes. Many of our students apply from China and other countries. We guide them through US college admissions, including school selection, testing (SAT/ACT, TOEFL), essays, interviews and financial aid questions.
    - q: How do I get started?
      a: Book a free strategy session. We'll learn about the student's goals and current profile, then recommend a plan with no commitment required.

