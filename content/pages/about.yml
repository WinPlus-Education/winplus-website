seo_title: About WinPlus | Boutique Education Consultancy & Talent Platform
meta_description: WinPlus is a premier boutique education consultancy and talent-development platform, founded in 2020 by Harvard Kennedy School graduates. Our story, mission and approach.
eyebrow: About Us
title: A premier boutique consultancy and talent-development platform.
intro: Top mentors, real projects and global stages, brought together in one plan built around each student, from high school to graduate school and beyond.
image: /images/uploads/photos/hks-session.webp
image_alt: A WinPlus session at Harvard Kennedy School
story_eyebrow: Our story
story_statement: We started WinPlus because talent is everywhere, but access to the people and opportunities that develop it is not.
story_text: 'WinPlus Education and Technology Inc. was founded in 2020 in Harvard Square by Cathy Guo and Cedric Pan, both graduates of Harvard Kennedy School. Today our teams in Boston and Beijing work
  with students and families across the US, China, Hong Kong, Singapore and beyond.


  Our mentors are professors, scientists, alumni interviewers and industry leaders from America''s leading universities and companies. Together we have helped more than a hundred students reach the Ivy
  League and the US Top 50, and taken students to international conferences on climate, disability rights and women''s health.'
mission_eyebrow: Our mission
mission_title: Whole-person education, in pursuit of truth
mission_text: 'Inspired by Harvard''s ideals of whole-person education and *veritas*, the pursuit of truth, WinPlus is committed to educational equity and global impact. We develop young leaders and future
  innovators who are ready for a global society: curious, capable, principled and caring.'
mission_image: /images/uploads/campus.jpg
mission_image_alt: A historic red-brick university library on a green campus
principles_eyebrow: What we believe
principles_title: Our principles
principles:
- title: Every student is an original
  text: We never force students into a template. Each plan starts from the student's character, experience and interests, and is designed to help them become more fully themselves.
- title: Real work beats packaging
  text: Admissions officers can tell the difference between a story and a record. We help students build real accomplishments through research, internships and leadership, then tell that story well.
- title: Growth, not just admission
  text: Getting in is a milestone, not the goal. The skills, judgement and character students develop with us should serve them for life.
- title: Integrity, always
  text: We never guarantee admission, never misrepresent a student's work, and never sell access to institutions. Our reputation is built on honesty with families and schools.
how_eyebrow: How We Work
how_title: One platform, not a patchwork of vendors.
how_intro: Most families assemble a counselor, a research program and a summer trip from different vendors, each with its own plan. At WinPlus, one team designs a single roadmap, and every program is built
  to strengthen the others.
how:
- title: Discover
  text: A free strategy session to understand the student's background, goals, interests and personality.
- title: Design
  text: A bespoke multi-year roadmap covering courses, activities, research, internships and global experiences, with a dedicated mentor.
- title: Build
  text: 'The profile comes to life through real work: research, immersion and global stages chosen to complement each other.'
- title: Apply
  text: Application strategy, essay brainstorming and editing, interviews and recommendations, with mentors who know the schools students aspire to.
- title: Decide
  text: Offers, waitlists and a confident transition to university and beyond.
compare:
- title: One relationship
  text: A dedicated mentor who knows the student, from the first plan to the final offer.
- title: One coherent story
  text: Every program builds toward the same narrative, so nothing is wasted.
- title: One network
  text: Professors, scientists and industry leaders, available to every student.
