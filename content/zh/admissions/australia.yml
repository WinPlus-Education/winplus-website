- title: 专业与入学规划
  text: 根据兴趣与入学要求为学生匹配专业，覆盖 IB、A-Level、AP 及各国课程体系。
- title: 申请与材料
  text: 申请表、陈述与证明材料，并与美国、英国或加拿大申请统筹推进。
- title: 研究生与研究型学位
