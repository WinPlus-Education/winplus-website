# COSP19 story text that was shown inline on Our Results (replaced by a link to the full article). Not published.
cosp19_story_en: |
  **Two minutes at the microphone.** On June 10, 2026, at UN Headquarters in New York, the chair of the 19th Conference of States Parties to the Convention on the Rights of Persons with Disabilities called on "the NGO representative from China". A 17-year-old WinPlus student switched on his microphone and spoke for just over two minutes: about his father, about the limits of medicine, about the visible and invisible barriers that classmates with disabilities face at school, and about the responsibility of his generation. *"A doctor's hands can save one life at a time. An inclusive society can change the lives of millions."* The room applauded, and his words entered the official record of the conference.
  
  **A medical question, or a social one?** His father is a surgeon who sometimes performs seven operations in a day, and he had always seen disability through treatment and rehabilitation. Writing his speech, he realised that doctors can restore the body's function, but not a person's sense of belonging in society.
  
  **Inside the UN.** Guided by WinPlus co-founder Cathy Guo, a Harvard Kennedy School alumna who has worked with UN Women, and a WinPlus mentor, he listened from ten in the morning to six in the evening, and talked with delegates from Saudi Arabia, Japan and Spain about how their countries protect disability rights. A side event led almost entirely by deaf speakers, in sign language, showed him that sign language carries culture, identity and a long fight for equal rights. A young autistic advocate from New York brought home the principle he heard again and again: *"Nothing About Us Without Us."* At an exhibition of more than 200 works by Chinese artists with disabilities, master woodcarver Hu Xianmin, disabled by illness at four, told him: "Disability is a physical condition. It cannot define a person's courage."
  
  **From number 153 to the floor.** Speaking at a formal UN session requires accreditation, documents and a place on the speakers' list, and he started at number 153. Cathy Guo introduced him to the session organisers; he waited with his speech in hand as speakers ahead of him withdrew, until his turn came. Nervous, he heard his mentor say: "One day you'll be a world-class doctor speaking in the halls of the UN. You can do this." As one of the few young voices of the day, heads turned as he began.
  
  **After the applause.** That afternoon, through the Harvard alumni network, Cathy Guo arranged a one-to-one call with a Harvard Kennedy School alumnus who researches disability policy and practises as a lawyer, who walked him through the thinking behind international disability-rights law. Watching the UN livestream from home, his mother wrote: "He really opened up today. He gained so much. Thank you to the teachers for every arrangement and for being with him all the way."
  
  **What stays with him.** "Speaking for those two minutes at the UN made the whole trip worthwhile," he said. He is now writing his university applications, and his speech ended with the line that sums up the journey: *"Our generation will become the designers of these systems, and that responsibility does not have to wait for the halls of power. It begins today, in our school hallways."*
cosp19_story_zh: |
  **麦克风前的两分钟。** 2026 年 6 月 10 日，纽约联合国总部，《残疾人权利公约》第十九届缔约国大会正在进行。主持人说：“下面，我们有请来自中国的 NGO 代表发言。”一位 17 岁的 WinPlus 学生打开话筒，开始了两分多钟的发言：从父亲对他的影响讲起，谈到医学的边界，谈到残障同龄人在校园里遇到的有形与无形的障碍，最后落在年轻一代的责任上。*“一双医生的手，一次只能挽救一条生命；一个包容的社会，却能改变千千万万人的命运。”* 发言结束，掌声响起，这个 17 岁的声音被正式记录在联合国的会议里。
  
  **医学问题，还是社会问题？** 他的父亲是一名外科医生，最忙时一天要做七台手术。他习惯从“治疗”和“康复”的角度看待残障，但写着发言稿，他意识到：医生能恢复身体的功能，却恢复不了一个人在社会中的归属感。
  
  **走进联合国。** 在 WinPlus 联合创始人、哈佛肯尼迪学院校友、曾任职于联合国妇女署的郭琪老师和 WinPlus 导师的带领下，他带着时差从上午十点一直听到下午六点，主动与来自沙特、日本、西班牙等国的代表交流各国的残障保障。一场几乎全部由聋人发言者用手语进行的边会让他第一次直观感受到：手语承载着聋人的文化、身份认同与争取平等的历程。一位来自纽约的自闭症青年倡导者，让他真正理解了会场里反复提及的理念：*“Nothing About Us Without Us”*（没有我们的参与，就不要替我们做决定）。在“共绽放——中国残疾人文创作品展”上，4 岁因病致残的东阳木雕大师胡先民对他说：“残疾是身体上的一种缺陷，但它不能定义一个人的勇气。”
  
  **从第 153 位到发言席。** 在联合国正式会场发言，需要资格审核、文书提交与登记排队，他最初排在第 153 位。郭老师主动向会场负责人介绍他，他也带着讲稿一直等待；随着前面的发言者陆续取消，他终于等到了属于自己的两分钟。发言前他紧张得满脸通红，导师鼓励他：“你将来是要成为世界级医生、站在联合国大厅发言的，今天这个小演讲，你可以的。”作为为数不多的青年发言者，他一开口，不少与会者频频回头。
  
  **掌声之后。** 当天下午，郭老师通过哈佛校友网络，为他安排了与一位肯尼迪学院校友、残障领域研究者和律师的一对一交流，讲解国际残障权益立法背后的思路。通过联合国直播看完发言的妈妈说：“孩子放开了很多……收获满满，不虚此行。特别感谢老师们的精心安排和全程陪伴！”
  
  **留下的东西。** “能在联合国讲完那两分多钟，这一趟就完全值了。”如今他已开启大学申请季，而他发言的最后一句，或许是这趟旅程最好的注脚：*“我们这代人终将成为制度的设计者，而这个责任不必等到未来在权力的殿堂里才开始，它现在就发生在我们学校的走廊里。”*
