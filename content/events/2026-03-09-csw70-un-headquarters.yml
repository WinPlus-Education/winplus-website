summary: For a second year, WinPlus students joined the Commission on the Status of Women, at its 70th session on access to justice for women and girls.
statement: A second year at the Commission, on the question of justice for every woman and girl.
details: 'The 70th session of the Commission on the Status of Women met at UN Headquarters in New York from March 9 to 19, 2026. Its priority theme was ensuring and strengthening access to justice for all women and girls, including inclusive and equitable legal systems and the elimination of discriminatory laws, policies and practices.


  Returning after CSW69, WinPlus students took part in the session, following the debates on law and justice and meeting delegates, advocates and young leaders from around the world. *WinPlus is an independent education company; participation does not imply endorsement by the United Nations.*'
