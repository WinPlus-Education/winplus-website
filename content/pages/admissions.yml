approach_eyebrow: Our Approach
approach_title: We build the profile, then the application.
approach_text: Most counseling starts in Grade 11 with essays. Ours starts with the student, often years earlier, and turns a plan into real accomplishments before a single essay is written.
approach:
- title: Profile before paperwork
  text: We run our own research, internship, immersion and conference programs, so we build the experiences that make an application stand out instead of only describing them.
- title: Insight from the ground
  text: Our bilingual team lives and works in the US. Every cycle we track published policies and hear first-hand from current students and alumni interviewers.
- title: Mentors who know the schools
  text: Graduates and alumni interviewers of the most selective universities review school lists, essays and interviews, so feedback comes from people who have been inside.
- title: One mentor, start to finish
  text: 'From the first strategy session to the final decision: school list, early-round strategy, essays, interviews, waitlists and the move to campus.'
