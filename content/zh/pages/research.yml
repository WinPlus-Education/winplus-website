seo_title: 高中生科研与实习项目 | WinPlus 欧歌学院
meta_description: 面向高中生的线上科研与实习项目，涵盖人工智能、金融、航天、生物科技、政策与影视，由 NASA、Meta、微软、加州理工、MIT 导师带领，优秀学员可获导师推荐信。
eyebrow: 科研与实习
title: 真实的问题，真实的导师，有分量的成果。
intro: 由 NASA、Meta、微软、加州理工、MIT 的科学家、工程师与业界领袖带领的定制线上科研与实习项目。学生解决真实世界的问题，完成经得起检验的成果。
image: https://images.unsplash.com/photo-1630959305790-4c956ce6c0b6
image_alt: 实验室中使用显微镜的科学家
summary_eyebrow: 为什么重要
summary_statement: 最出色的申请者，不只说自己有好奇心，而是展示好奇心带来的成果。
summary_text: 顶尖大学看重证据：一个被深入追问的问题、一个被解决的难题、一位能为你作证的导师。WinPlus 项目让学生亲身经历真实世界的问题解决，完成论文、产品原型或作品集，并获得亲眼见证其工作的专家推荐。
how_eyebrow: 服务流程
how_title: 围绕塑造未来的重大课题设计
how_intro: 每个项目都由 WinPlus 与导师共同设计，聚焦未来十年教育与产业最关键的领域。
how:
- title: 聚焦前沿领域
  text: 我们在世界变化最快的领域设计项目：人工智能、航天、生物科技、金融与全球政策，并每年随领域发展更新，让学生学到大学与雇主即将看重的能力。
- title: 业界导师，小班指导
  text: 导师是 NASA、Meta、微软、加州理工等机构的在职科学家、工程师和研究员。小班制让每位学生都被了解、被挑战、被个别指导。
- title: 先学习，再产出
  text: 每个项目从“学习周”（概念、工具与方法）过渡到“产出周”，学生将所学应用于自己的项目，每周都有明确的成果，并由项目经理跟踪进度。
- title: 与申请紧密衔接
  text: WinPlus 导师帮助选择最契合学生规划的项目，并把这段经历转化为活动描述、文书与面试素材。
deliverables_title: 每位学生都将收获
deliverables:
- title: 一项完整的成果
  text: 根据项目不同，可能是科研论文、可运行的产品原型、财务模型、政策简报或短片。
- title: 导师推荐信
  text: 高质量完成项目的学生，可获得亲眼见证其工作的导师推荐信。推荐信需要努力争取，并非自动获得。
- title: 作品集与成果展示
  text: 期末成果汇报与一份精心打磨的作品集。
- title: 发表与竞赛指导
  text: 在合适的情况下，指导学生将成果投稿至期刊、会议或竞赛。
