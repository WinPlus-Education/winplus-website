overview: 学生将学习天文学家如何利用空间望远镜数据研究星系、恒星与系外行星，并基于公开数据开展原创研究。
activities:
- 空间望远镜如何采集和处理数据
- 获取并分析公开天文数据
- 图像处理与科学可视化
- 提出并验证研究问题
- 撰写并展示原创研究成果
mentor: NASA 艾姆斯研究中心研究科学家
