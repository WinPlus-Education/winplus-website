title: Global Challenges Policy Research
industry: policy-global-affairs
type: research
status: open
mentor_id: damir-kozhanbayev
seo_title: Global Policy Research for High Schoolers | WinPlus
meta_description: Research children's rights, education, gender equality or climate and write a policy paper with a Harvard research fellow and former UNICEF officer.
summary: 'Turn a global concern into rigorous research: write a policy paper and brief on children''s rights, education, gender or climate, with a Harvard research fellow and former
  UNICEF officer.'
image: /images/uploads/photos/hks-session.webp
image_alt: Students in a mentor-led discussion at Harvard Kennedy School
format: Online · live mentor sessions
length: 8 weeks
dates: Summer 2027 · dates to be confirmed
cohort: Small group
overview: 'Students who care about the world''s biggest problems learn to research them like policy professionals. Each student chooses a question in children''s rights, education, gender
  equality or climate, and learns how international institutions and the Sustainable Development Goals approach it.


  They build an annotated bibliography from academic sources and international reports, compare real cases, and develop evidence-based recommendations that address feasibility and implementation.'
outcomes:
- A 10–15 page research paper
- A two-page policy brief
- A 10–15 minute presentation
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: The question
  text: International institutions, the SDGs and choosing a research question.
- phase: Weeks 3–4
  title: The evidence
  text: 'Annotated bibliography: 5–7 academic sources and 2–3 international reports.'
- phase: Weeks 5–6
  title: Comparison
  text: Compare 2–3 cases and develop 3–5 recommendations.
- phase: Weeks 7–8
  title: Paper & brief
  text: Write the paper and policy brief; present the findings.
eligibility:
- Grades 9–12
- Strong reading and writing in English
- Interest in politics, law, economics or international affairs
mentor_note: Research fellow, Harvard Project on Workforce; former UNICEF officer
