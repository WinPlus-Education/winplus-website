overview: 'Behind every trade, payment and bank app is technology. Students learn how FinTech products automate and deliver financial services, then apply machine learning, AI tools
  and user-experience design to a problem they choose.


  Guided by market research, each student designs a FinTech startup concept and writes a business plan, gaining a founder''s view of product, customers and business models.'
outcomes:
- A FinTech startup business plan
- A product concept or prototype
- A final investor-style pitch
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: How FinTech works
  text: How financial technology automates and delivers services.
- phase: Weeks 3–4
  title: Market research
  text: Customers, competitors and an unmet need.
- phase: Weeks 5–6
  title: Product & AI
  text: Machine learning, AI coding and UX design tools applied to the concept.
- phase: Weeks 7–8
  title: Plan & pitch
  text: The business plan and final pitch.
eligibility:
- Grades 9–12
- No prior finance or coding experience required
- Interest in business, economics or technology
mentor_note: Technologist with Bloomberg and Meta experience
