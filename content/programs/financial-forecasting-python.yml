overview: 'How do companies predict what comes next? Students take on a real analyst''s problem, forecasting Microsoft''s quarterly revenue from public financial data, and learn the
  statistics and judgement behind every forecast.


  Students clean data, explore trends and seasonality, and compare ARIMA and ETS models in Python. They then examine what drives revenue and how it relates to share price, learning to
  tell correlation from causation.'
outcomes:
- Annotated Python notebook
- Predicted-versus-actual charts and error analysis (MAE, RMSE, MAPE)
- An analytical report and presentation
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: Data & trends
  text: Cleaning public financial data; trends, seasonality, lags and rolling averages.
- phase: Weeks 3–5
  title: Forecasting models
  text: ARIMA and ETS in Python; training and test data; measuring error.
- phase: Weeks 6–7
  title: Drivers & markets
  text: Revenue drivers and share-price relationships; correlation versus causation.
- phase: Week 8
  title: Report & present
  text: An analytical report and presentation of the forecast.
eligibility:
- Grades 10–12
- Comfort with algebra; some Python helpful but not required
- Interest in mathematics, finance, economics or business analytics
mentor_note: Data scientist with Microsoft and Google experience
