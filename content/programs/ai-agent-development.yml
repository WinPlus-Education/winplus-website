overview: AI agents are one of the fastest-moving areas in software. In this internship-style program, students learn how modern AI agents are designed and built, then develop their own agent-powered tool from idea to working demo.
activities:
- Learn how large language models, prompts and tool use work
- Design an agent for a real problem students care about
- Build and test the agent in Python
- Evaluate performance, safety and limitations
- Present a live demo at the final showcase
mentor: Software Engineering Lead, Llama Team & AI Platform Development Lead (Meta)
