summary: 在联合国面向青年的主要平台上，WinPlus 学生与来自世界各地的青年代表一起，共议迈向 2030 的道路。
statement: 世界各地的青年在这里向联合国表达对 2030 之路的思考。
details: '联合国经济及社会理事会（ECOSOC）青年论坛是联合国面向青年的主要平台，让青年就可持续发展目标与会员国直接对话。2026 年论坛于 4 月 14 日至 16 日在纽约联合国总部举行，主题为“创新、团结、变革：青年塑造通往 2030 之路”，并设有发展筹资、小岛屿发展中国家以及青年与人工智能等专题会议。


  WinPlus 学生参加本届论坛，聆听各场会议，并与来自世界各地的青年代表和领袖交流。


  *WinPlus 是独立教育机构，参与会议不代表联合国对 WinPlus 的认可。*'
