cases_title: Selected case studies and student stories
cases_intro: 'Different starting points, one approach: a plan built around the student.'
cases:
- tag: Ivy League
  title: From top of the class to Yale, with scholarship
  start: Started the summer after Grade 9. GPA 4.0 with 14 AP 5s, ranked 1st of 300+, TOEFL 117, SAT 1550. Rich activities in biology and public health, but little international impact.
  strategy: 'Add global leadership and expert recommendations: a speaking role at an international women''s forum, research guided by a CDC epidemiologist and a global-health professor, and essays and mock interviews with a Yale alumni interviewer and Harvard mentors.'
  change: Spoke at a global women's forum in Bangkok; artwork exhibited at the forum; two expert recommendation letters; 50+ rounds of essay revision; interviews at every Ivy applied to.
  outcome: Admitted to Yale (with scholarship), Penn, Johns Hopkins, Notre Dame, UC Berkeley and UCLA.
- tag: Turnaround
  title: From no SAT or TOEFL to Top-50 offers and $180,000 in scholarships
  start: Started the summer after Grade 11. GPA around 3.5, no TOEFL, no SAT, no research. Many activities but no standout achievement or international reach.
  strategy: 'Raise every one of the Eight Key Elements at once: an intensive testing plan, a three-month research project with a geospatial-science professor, a UN climate conference, and a photography portfolio and exhibition.'
  change: TOEFL 99 and SAT 1400 (superscore); a published GIS research paper; spoke at a UN climate conference; a photography exhibition and published work; charity cello concerts at a children's hospital.
  outcome: Admitted to UC Davis, Boston University, Purdue, Northeastern and Ohio State, with scholarships of $80,000 (UC Riverside), $60,000 (UC Santa Cruz) and $40,000 (Syracuse). Waitlisted at UCLA and UC San Diego.
- tag: US + UK dual track
  title: Cambridge astrophysics and UC Berkeley, from one profile
  start: A student passionate about astronomy who wanted to keep both the US and UK open, two systems that reward very different things.
  strategy: 'One profile built to serve both: a 2024 East Coast campus immersion, then in 2025 a small-group research project with a NASA scientist on exoplanet telescope design using CODE V optical software, and a recommendation from that mentor.'
  change: Research depth that powered the UK personal statement and the Cambridge interview, where the student drew on work on the crystal packing of mirror materials, and a US narrative uniting astronomy with STEM education.
  outcome: Offer from the University of Cambridge (astrophysics) and admitted to UC Berkeley.
stories:
- tag: Global stage
  title: WinPlus Student Speaks at COSP19, UN Headquarters
  text: In June 2026, a 17-year-old WinPlus student was the only high-school speaker at the 19th Conference of States Parties to the Convention on the Rights of Persons with Disabilities, at UN Headquarters in New York.
  story: '**Two minutes at the microphone.** On June 10, 2026, at UN Headquarters in New York, the chair of the 19th Conference of States Parties to the Convention on the Rights of Persons with Disabilities called on "the NGO representative from China". A 17-year-old WinPlus student switched on his microphone and spoke for just over two minutes: about his father, about the limits of medicine, about the visible and invisible barriers that classmates with disabilities face at school, and about the responsibility of his generation. *"A doctor''s hands can save one life at a time. An inclusive society can change the lives of millions."* The room applauded, and his words entered the official record of the conference.


    **A medical question, or a social one?** His father is a surgeon who sometimes performs seven operations in a day, and he had always seen disability through treatment and rehabilitation. Writing his speech, he realised that doctors can restore the body''s function, but not a person''s sense of belonging in society.


    **Inside the UN.** Guided by WinPlus co-founder Cathy Guo, a Harvard Kennedy School alumna who has worked with UN Women, and a WinPlus mentor, he listened from ten in the morning to six in the evening, and talked with delegates from Saudi Arabia, Japan and Spain about how their countries protect disability rights. A side event led almost entirely by deaf speakers, in sign language, showed him that sign language carries culture, identity and a long fight for equal rights. A young autistic advocate from New York brought home the principle he heard again and again: *"Nothing About Us Without Us."* At an exhibition of more than 200 works by Chinese artists with disabilities, master woodcarver Hu Xianmin, disabled by illness at four, told him: "Disability is a physical condition. It cannot define a person''s courage."


    **From number 153 to the floor.** Speaking at a formal UN session requires accreditation, documents and a place on the speakers'' list, and he started at number 153. Cathy Guo introduced him to the session organisers; he waited with his speech in hand as speakers ahead of him withdrew, until his turn came. Nervous, he heard his mentor say: "One day you''ll be a world-class doctor speaking in the halls of the UN. You can do this." As one of the few young voices of the day, heads turned as he began.


    **After the applause.** That afternoon, through the Harvard alumni network, Cathy Guo arranged a one-to-one call with a Harvard Kennedy School alumnus who researches disability policy and practises as a lawyer, who walked him through the thinking behind international disability-rights law. Watching the UN livestream from home, his mother wrote: "He really opened up today. He gained so much. Thank you to the teachers for every arrangement and for being with him all the way."


    **What stays with him.** "Speaking for those two minutes at the UN made the whole trip worthwhile," he said. He is now writing his university applications, and his speech ended with the line that sums up the journey: *"Our generation will become the designers of these systems, and that responsibility does not have to wait for the halls of power. It begins today, in our school hallways."*'
