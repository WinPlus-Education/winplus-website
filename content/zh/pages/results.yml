highlights_title: 学员故事
highlights:
  - title: "国际舞台：联合国会议唯一高中生发言代表"
    tag: 国际舞台
    text: "背景：17 岁高中在读学员。我们做了什么：联合国议题培训与全程辅导。结果：2026 年 6 月，在纽约联合国总部《残疾人权利公约》第十九届缔约国大会（COSP19）上，成为唯一的高中生发言代表。"
    image: /images/uploads/students/un-cosp19-speaker.jpg
    image_alt: WinPlus 学员在联合国会议上发言
    link: enrichment/un-conferences.html
  - title: "藤校逆袭：从中游成绩到哈佛、耶鲁"
    tag: 藤校逆袭
    text: "背景：成绩中游、目标顶尖名校。我们做了什么：基于「八大要素」体系的冲藤规划。结果：录取哈佛 / 耶鲁，含奖学金。"
    image: /images/uploads/students/ivy-admit-story.jpg
    image_alt: WinPlus 学员展示研究成果
    link: admissions/us-college.html
  - title: "低基础翻盘：从零标化到加州大学奖学金"
    tag: 低基础翻盘
    text: "背景：无托福 / SAT 起步。我们做了什么：标化、科研与文书系统提升。结果：录取加州大学系统并获奖学金。"
    image: /images/uploads/students/uc-scholarship-story.jpg
    image_alt: WinPlus 学员参观大学
    link: research.html

