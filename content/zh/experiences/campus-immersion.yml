testimonials_title: 学员与家长说
testimonials:
- quote: 我们所到访的十所高校给了我深深的震撼。二十几位德才兼备的名校教授和校友，让我对进入名校的愿望越来越强烈。
  name: 学员
  role: 2025 名校研学
- quote: 我明白了美国大学实际上想了解我是谁、有什么独特之处、希望成为什么样的人，以及希望对世界和社会做出什么贡献。
  name: 学员
  role: 2025 名校研学
- quote: 非常感谢老师们无微不至的照顾！孩子回到家还哭了，说舍不得老师和同学们。行程紧凑丰富，孩子收获很大！
  name: 家长
  role: 2025 名校研学
- quote: 在 MIT 的 Sea Grant 实验室，教授告诉我们角落里那台机器人可以携带传感器下潜三千米。那一刻我才真正感受到 MIT 科研实力的深厚。
  name: 学员
  role: 2024 美国研学
faq:
- q: 名校深度研学适合谁？
  a: 希望在申请前亲身了解美国顶尖大学的初高中学生（通常 12–18 岁）。课程以英文授课，WinPlus 工作人员全程支持。
- q: 每期有多少学员？
  a: 每期规模较小，约 20 名学员，确保每位学生都被了解与照顾。
- q: 谁陪同学生出行？
  a: WinPlus 工作人员从出发起全程陪同，WinPlus 导师在美国带领项目。[补充师生比与安全说明。]
- q: 项目费用是多少？
  a: 费用因年份与路线而异，通常包含课程、住宿、地面交通、餐食与门票，不含国际机票、签证费与旅游保险，我们的团队会协助办理。请联系我们了解最新费用。
