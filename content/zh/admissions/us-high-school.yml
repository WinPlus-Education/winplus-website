system: 私立中学录取的是一个社区成员，而不只是一份成绩单。面试与探校分量很重，家长需要撰写自己的陈述，多数顶尖学校的截止日期集中在 1 月，并在 3 月统一放榜。
challenges_intro: 很多家庭低估了美高申请的个性化程度。以下是我们发挥作用的地方。
challenges:
- challenge: 排名说明不了是否适合
  title: 找到真正适合的学校
  text: 我们帮助家庭了解各校在学术、文化、规模与支持上的真实差异，选出学生能真正成长的学校，而不只是能被录取的学校。
- challenge: 年纪尚小，却要面对成人化的考察
  title: 自然自信的面试与探校
  text: 通过面试训练建立真正的自信；依托我们靠近新英格兰顶尖寄宿学校的地理优势，规划探校行程。
- challenge: 环节繁多，截止日期却只有一个
  title: 统筹协调的一份申请
  text: SSAT 或 ISEE 与英语考试规划、学生与家长陈述、教师推荐信，全部统一在一条时间线上。
timeline_title: 美高申请时间线
timeline:
- when: 提前 12–18 个月
  text: 学校调研、初步标化规划与暑期探校。
- when: 9–12 月
  text: 校园参观与面试；SSAT 或 ISEE 考试。
- when: 1 月 15 日
  text: 多数顶尖寄宿学校申请截止。
- when: 3 月 10 日
  text: 多数寄宿学校统一放榜日。
- when: 4 月 10 日
  text: 统一答复日；准备入学过渡。
