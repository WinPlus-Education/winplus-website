seo_title: "Research & Internship Programs for High School Students | NASA, Meta, MIT Mentors | WinPlus"
meta_description: "Mentor-led research and internship programs for high school students in AI, coding, finance, space science, biotech and film. Earn a portfolio project and a mentor recommendation letter."
eyebrow: Research & Internships
title: Where high schoolers do work that belongs on a college application
intro: Our programs aren't simulations. They're real projects, real mentors and real deliverables, the kind top admissions officers notice.
image: https://images.unsplash.com/photo-1630959305606-3123a081dada
