case_text: 'In July 2024 WinPlus co-delivered a global competency study tour for 15 students and their teachers: ten universities including Harvard, MIT, Yale, Princeton and Penn, plus McKinsey, Meta, the
  IMF and NASA, with seminars led by WinPlus mentors and the school''s own alumni.'
