overview: '智能设备融合了硬件、软件与云。在这个实习项目中，学生将全面了解物联网的工作原理，并设计制作自己的 AI 设备：采集数据、上传云端并做出智能响应。


  过程中，学生将体验专业工程团队的完整产品生命周期：从需求、硬件组装到软件开发、云端部署与最终演示。'
outcomes:
- 可运行的物联网原型与技术文档
- 覆盖硬件、软件与云的实践经验
- 期末成果展示
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 物联网原理
  text: 设备、网络与云；传感器与微控制器。
- phase: 第 3–4 周
  title: 制作设备
  text: 硬件组装与设备软件。
- phase: 第 5–6 周
  title: 连接云端
  text: 将设备数据上传至云服务并进行分析。
- phase: 第 7–8 周
  title: 加入智能与展示
  text: 预测或异常检测等 AI 功能，以及期末展示。
eligibility:
- 9–12 年级
- 无需硬件经验
- 笔记本电脑与稳定网络；硬件套件详情报名时确认
