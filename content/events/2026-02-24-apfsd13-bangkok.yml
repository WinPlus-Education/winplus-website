details: 'The Asia-Pacific Forum on Sustainable Development (APFSD), convened each year by the UN Economic and Social Commission for Asia and the Pacific (ESCAP), is the region''s main platform for reviewing progress on the 2030 Agenda.


  Its 13th session met at the United Nations Conference Centre in Bangkok on February 24–27, 2026, under the theme of transformative and equitable actions for the 2030 Agenda. It reviewed Goals 6, 7, 9, 11 and 17 (clean water, clean energy, industry and innovation, sustainable cities, and partnerships), found the region off-track to meet the 2030 targets, and fed its summary into the global High-level Political Forum in New York.


  A WinPlus student was selected to speak on young women''s health, and her Dunhuang-inspired artwork was exhibited at the forum.


  *Official information: [UN ESCAP: APFSD13](https://www.unescap.org/events/apfsd13). WinPlus is an independent education company; participation does not imply endorsement by the United Nations.*'
