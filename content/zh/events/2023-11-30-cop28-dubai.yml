summary: 五名学生在史上规模最大的联合国气候变化大会 COP28 上展示气候研究成果，在中国角发言，相关活动获央视报道。
statement: 在史上规模最大的气候峰会上，五名学生带来了自己的研究。
details: 'COP28（2023 年联合国气候变化大会）于 2023 年 11 月 30 日至 12 月 12 日在迪拜世博城举行，完成了《巴黎协定》首次全球盘点，并在“阿联酋共识”中呼吁全球转型脱离化石燃料。


  本次代表团由 WinPlus 与人大附中国际部 ICC 联合组织，由 WinPlus 联合创始人、哈佛校友郭琪老师带队。五名学生带着各自的研究走进大会：城市热浪应对决策、欧洲能源供应安全、新冠疫情与全球治理，以及工业废物的资源化利用。


  十余天里，他们在蓝区边会发言，向来自各大洲的代表展示研究，并在迪拜、阿布扎比和沙迦与大学教授、议员和企业领袖深入交流。'
