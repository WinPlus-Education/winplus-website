summary: 《残疾人权利公约》第十九届缔约国大会在纽约联合国总部召开，恰逢《公约》生效 20 周年。
details: '缔约国大会（COSP）每年召集各国政府、联合国机构、残障人士组织与公民社会，共同审议《残疾人权利公约》（CRPD）的落实情况。


  COSP19 于 2026 年 6 月 9 日至 11 日在纽约联合国总部举行，6 月 8 日先行召开公民社会论坛。适逢《公约》生效 20 周年，本届主题为“CRPD 20 周年：巩固成就，在变化的世界中开启落实新阶段”。大会在联合国大会堂开幕，圆桌会议围绕免受剥削、暴力和虐待，韧性社会与照护支持体系，以及政治参与和代表性展开，并选举了残疾人权利委员会成员。


  WinPlus 学生在导师指导下经过数月准备参与大会，其中一位 17 岁学生作为唯一的高中生发言人在大会上发言。[阅读这位学生的故事](../results.html#student-stories)。


  官方信息：[联合国经社部：COSP19](https://social.desa.un.org/cosp/19th-session)。WinPlus 是独立教育机构，学生依照会议自身规则参与，不代表联合国对 WinPlus 的认可。'
