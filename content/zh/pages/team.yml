  initials: MM
  title: 好莱坞制片人 · Phoenix Pictures 与 Orion Pictures 联合创始人
  education: 加州大学洛杉矶分校毕业
  photo: /images/uploads/team/mike-medavoy.webp
  bio: 'Mike Medavoy 是好莱坞制片人、Phoenix Pictures 联合创始人，毕业于加州大学洛杉矶分校。他的经历涵盖人才经纪、电影公司管理和制片，曾联合创办 Orion Pictures，并在 United Artists 与 TriStar Pictures 担任管理职务。参与推动的作品包括《黑天鹅》《禁闭岛》《十二宫》和《细细的红线》。


    在 WinPlus 活动中，他带领学生参观好莱坞制片公司，分享制片流程、产业运作和明星经纪经验，解释一个故事如何成为电影项目，以及导演、演员、编剧、制片人与经纪人如何分工协作，连接创意、资金与市场。'
  founder: false
- id: rachel-morgan
