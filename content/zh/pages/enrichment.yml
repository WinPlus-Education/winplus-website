benefits_title: 为什么国际背景提升很重要
benefits:
  - title: 全球视野
    text: 学生与来自世界各地的同龄人和专业人士一起探讨真实的全球议题。
  - title: 领导力与自信
    text: 在高规格场合发言、谈判与协作，培养受益终身的能力。
  - title: 值得讲述的故事
    text: 独特的亲身经历，是文书与面试中最有力的素材。

highlight:
  label: 亮点
  title: "WinPlus 学员走进联合国"
  text: "WinPlus 学员已参与 15 次联合国会议，包括联合国土著问题常设论坛（UNPFII）及《残疾人权利公约》缔约国大会。2026 年 6 月，一名 17 岁的 WinPlus 学员成为纽约联合国总部 COSP19 大会上唯一的高中生发言代表。"
  image: /images/uploads/students/un-cosp19-speaker.jpg
  image_alt: WinPlus 学员在联合国会议上发言

