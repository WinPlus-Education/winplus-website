highlight:
  label: Highlight
  title: "WinPlus students at the United Nations"
  text: "WinPlus students have taken part in 15 United Nations conferences, including the UN Permanent Forum on Indigenous Issues (UNPFII) and the Conference of States Parties to the CRPD. In June 2026, a 17-year-old WinPlus student was the only high-school speaker at COSP19 at UN Headquarters in New York."
