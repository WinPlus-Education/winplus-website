seo_title: 机构合作 | 升学规划、科研与夏校合作方案 | WinPlus 欧歌学院
meta_description: 与 WinPlus 合作：面向中国、美国与新加坡私立学校的升学规划、一站式夏校、跨境交流与课程拓展。
eyebrow: 机构合作
title: 无需自建团队，即可拥有世界一流的升学规划与国际项目团队。
intro: WinPlus 与私立学校合作，提供升学规划、科研、夏校与国际项目，可使用贵校品牌或 WinPlus 品牌。我们负责交付；学生获得顶尖导师与真实舞台，学校获得家长选择您的成果。
image: /images/uploads/photos/hbs-classroom.webp
image_alt: WinPlus 学员与导师在哈佛商学院教室
challenges_title: 私立学校普遍面临的挑战
challenges:
- title: 升学指导力量有限
  text: 一位升学老师面对数十名学生，难以为每个人提供美国一线、熟悉藤校的指导，更难覆盖美、英等多个体系。
- title: 夏校项目难以落地
  text: 国际出行、合作大学、安全与后勤都需要专业团队，而涉及未成年人，责任重大。
- title: 升学成果决定招生
  text: 家长依据升学成果选择学校。缺少名校录取记录，招生与留存都会受到影响。
benefits_title: 学校为什么选择 WinPlus
benefits:
- title: 顶尖导师网络
  text: 来自美国顶尖大学与企业的教授、科学家、校友面试官和行业领袖，直接指导贵校学生。
- title: 安全与合规
  text: 员工与导师背景审查、未成年人保护规范与全程监护出行，均写入合作协议。
- title: 可验证的成果
  text: 87 封藤校与前 30 名校录取，学生登上从迪拜到联合国总部的国际会议舞台。
- title: 灵活的合作模式
  text: 推荐、联合品牌或白标合作，由您决定 WinPlus 的可见度以及家长关系归属。
- title: 中美新三地经验
  text: 扎根波士顿与北京的双语团队，深谙两地家庭、学校与大学。
models_title: 合作模式
models:
- title: 推荐合作（Referral）
  text: 您引荐，我们交付，您获得引荐分成。最简单，零负担。
- title: 联合品牌（Reseller / Co-brand）
  text: 共同交付，共享市场推广，利润分成。
- title: 白标 / 批发（White-label）
  text: 您作为品牌门面，掌握家庭关系；WinPlus 在后端提供升学、科研与专属资源。
roles_title: 责任分工
roles:
  partner:
