eyebrow: Research & Internships
title: Real problems. Real mentors. Work that matters.
intro: Bespoke online research and internship programs led by scientists, engineers and leaders from NASA, Meta, Microsoft, Caltech and MIT. Students solve real-world problems and finish
  with work they can stand behind.
image: https://images.unsplash.com/photo-1630959305790-4c956ce6c0b6
