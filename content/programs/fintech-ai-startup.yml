meta_description: Design a FinTech startup powered by AI, from market research to business plan and pitch, mentored by an engineering leader with Bloomberg and Meta experience.
summary: Discover how Wall Street technology delivers financial services, then design an AI-powered FinTech startup and pitch it, with a mentor from Bloomberg and Meta.
