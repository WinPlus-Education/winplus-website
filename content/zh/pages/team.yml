- id: cathy-guo
  name: 郭琪 Cathy Guo
  initials: CG
  title: 联合创始人 · 曾任职联合国妇女署
  education: 哈佛大学肯尼迪学院公共政策硕士 · 罗格斯大学学士
  photo: /images/uploads/team/cathy-guo.webp
  bio: '郭琪老师于 2020 年在哈佛广场联合创立 WinPlus 欧歌学院，毕业于哈佛大学肯尼迪学院公共政策硕士，罗格斯大学经济与传媒双学士。


    她现任哈佛肯尼迪学院校友会董事、罗格斯大学 Douglass 女子学院董事，曾就职于联合国妇女署、牛津经济研究院等机构，长期在中东、欧洲、非洲、东南亚和中国西南地区推动国际教育与公益事业。'
  founder: true
- id: josh-guo
  name: Josh Guo
  initials: JG
  title: 耶鲁大学本科招生面试官 · 曾任职德勤
  education: 耶鲁大学学士（专业优异）
  photo: /images/uploads/team/josh-guo.webp
  bio: 'Josh Guo 毕业于耶鲁大学，获专业荣誉 Distinction in Major，曾任职德勤。他曾在白宫环境质量委员会实习，接触气候、能源与环境政策协调，并向康涅狄格州立法机构提交公共议题书面意见。他也参与云南布朗族文化保护，通过访谈、影像、音乐记录和写作连接人文研究与社区实践。


    在 WinPlus，他指导经济、政治、哲学、法律相关及其他人文社科方向的本科、硕士和博士申请，并担任耶鲁本科申请面试官，曾帮助学生获得哈佛、耶鲁和斯坦福录取，将研究与面试经验用于升学支持。'
  founder: false
- id: daniel-e-hastings
  name: Daniel E. Hastings
  initials: DH
  title: 麻省理工学院 Institute Professor · 前美国空军首席科学家
  education: 牛津大学数学学士；麻省理工学院航空航天硕士及博士
  photo: /images/uploads/team/daniel-e-hastings.webp
  bio: 'Daniel E. Hastings 是 MIT Institute Professor，获该校最高教师荣誉；本科毕业于牛津大学，获 MIT 硕士及博士学位。他研究航天器与空间环境、推进技术及复杂系统设计，曾任 MIT 本科教育院长、航空航天系主任、新加坡—MIT 科研联盟负责人和美国空军首席科学家。


    他与新加坡国立大学及亚洲学生有长期教学交流。在 WinPlus 活动中，他带领学生了解航天可持续发展、系统工程与地球轨道制造，讨论技术方案如何长期运行、任务目标如何匹配资源，以及在轨生产所需的基础设施。'
  founder: false
- id: jeffrey-hoffman
  name: Jeffrey A. Hoffman
  initials: JH
  title: 麻省理工学院航空航天工程实践教授 · 前 NASA 宇航员
  education: 哈佛大学博士；阿默斯特学院学士；莱斯大学硕士
  photo: /images/uploads/team/jeff.jpg
  bio: 'Jeffrey A. Hoffman 是 MIT 航空航天工程实践教授、前 NASA 宇航员，拥有哈佛大学博士学位。他曾五次执行航天飞机任务，在太空工作超过 1,211 小时，并参与 1993 年哈勃太空望远镜首次维修。他还担任火星制氧实验 MOXIE 副首席研究员，该装置搭载于“毅力号”，验证了从火星大气提取氧气的可行性。


    在 WinPlus 活动中，他带领学生参观 MIT 航空航天系，讲解“毅力号”探索、航天飞机载人飞行和阿波罗登月工程，结合实际任务说明科学仪器、航天器与宇航员如何协同工作，以及工程设计如何应对资源和环境限制。'
  founder: false
- id: steve-kelman
  name: Steve Kelman
  initials: SK
  title: 哈佛肯尼迪学院 Weatherhead 公共管理荣休教授 · 前美国联邦采购政策办公室主任
  education: 哈佛大学学士及政府学博士
  photo: /images/uploads/team/steve-kelman.webp
  bio: 'Steve Kelman 是哈佛肯尼迪政府学院 Weatherhead 公共管理荣休教授，在哈佛完成本科及政府学博士学习。他研究政府管理、公共政策与组织变革，曾于 1993 至 1997 年担任美国行政管理和预算局下属联邦采购政策办公室负责人，参与联邦政府管理改革，并著有《Unleashing Change》等著作。


    在 WinPlus 活动中，他带领学生参观哈佛肯尼迪政府学院，讲解中美关系、国际关系与美国政府治理，将新闻议题与政府组织、政策决策及执行联系起来，介绍公共事务研究如何回应现实问题。'
  founder: false
- id: damir-kozhanbayev
  name: Damir Kozhanbayev
  initials: DK
  title: 哈佛 Project on Workforce 研究员 · 前联合国儿童基金会
  education: 哈佛大学教育研究生院
  photo: /images/uploads/team/damir-kozhanbayev.webp
  bio: 'Damir Kozhanbayev 是哈佛 Project on Workforce 研究员，曾在 UNICEF 哈萨克斯坦办公室负责教育与知识创新，并以 Urban Scholars Fellow 身份进入哈佛教育学院学习“学习设计、创新与技术”，兼具国际组织与教育研究背景。


    在 WinPlus，Damir Kozhanbayev 担任「全球挑战政策研究」项目导师。'
  founder: false
  org: 哈佛 Project on Workforce
