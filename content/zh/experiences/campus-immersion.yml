eyebrow: 名校深度研学
summary: 不是普通的校园参观。12 天走访哈佛、MIT、耶鲁、斯坦福等名校的实验室与课堂，并深入硅谷企业，在亲身体验中了解名校、探索方向。
image: /images/uploads/campus/stanford-arcade.webp
image_alt: 斯坦福大学主四方院拱廊与胡佛塔
kicker: 不止于参观
card_text: 走进哈佛、MIT、耶鲁、斯坦福的实验室与课堂，与教授和在校生坦诚交流。
statement: 选择大学，不能只看宣传册。你需要亲自走进去。
statement_text: 名校深度研学带学生走出游客路线：参与实验室与团队实践，在课堂上向教授和导师学习，与在校生聊真实的校园生活，并直接聆听招生团队的介绍。在 WinPlus 导师全程陪伴下，学生将清楚知道哪种大学文化最适合自己，并带回一份通往梦校的个人规划。
