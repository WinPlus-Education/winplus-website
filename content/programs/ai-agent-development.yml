meta_description: Build and evaluate a working AI agent in six weeks with a mentor from Meta's AI teams. Online internship for high school students with some programming experience.
summary: Build a working AI agent, from the first API call to a tested tool-using assistant, guided by an engineer with a background on Meta's AI teams.
