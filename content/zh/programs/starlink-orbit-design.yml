meta_description: 以星链为案例，用 NASA GMAT 软件设计卫星星座并模拟轨道，由拥有 NASA 戈达德经验的 MIT 航天博士指导。
summary: 以星链为案例，设计卫星星座并用 NASA 软件模拟轨道，由拥有 NASA 戈达德经验的 MIT 航天博士指导。
image: https://images.unsplash.com/photo-1465101162946-4377e57745c3
image_alt: 夜空中的银河与繁星
format: 线上 · 导师直播课
length: 8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: '如今数千颗卫星环绕地球连接世界。这些网络是如何设计的？学生将学习轨道高度、倾角、周期、覆盖与重访时间，并用 NASA 的 GMAT 软件为自选通信任务模拟轨道。


  学生还将比较无线电与光学（激光）通信，了解关键部件并建立简化的链路预算，掌握航天产业通用的工程推理方法。'
outcomes:
- 包含星座架构的研究论文或设计作品集
- GMAT 轨道仿真与网络示意图
- 阐述设计理由的期末展示
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 轨道力学
  text: 高度、倾角、周期、覆盖与重访时间。
- phase: 第 3–4 周
  title: 仿真
  text: 用 NASA GMAT 进行轨道仿真；比较星座布局。
- phase: 第 5–6 周
  title: 通信
  text: 无线电与光学链路；关键部件；简化链路预算。
- phase: 第 7–8 周
  title: 设计与展示
  text: 需求、架构、仿真与设计理由。
eligibility:
- 9–12 年级
- 对物理、航天或电子工程有浓厚兴趣
- 熟悉代数与三角函数
