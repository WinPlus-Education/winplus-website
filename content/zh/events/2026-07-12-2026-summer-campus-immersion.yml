summary: 12 天、10 所名校、35 家机构：由来自哈佛、MIT、耶鲁与硅谷的 18 位导师主讲的 50 小时全球胜任力课程。
details: '项目结合哈佛大学和麻省理工学院的知名课程设置，由来自哈佛、耶鲁、MIT 等名校的导师开发 50 小时全球胜任力课程，在哈佛、MIT 和普林斯顿以英文授课，围绕“全球分析”“文化共情”“多元沟通”和“可持续行动”四种核心胜任力展开。


  18 位资深导师，包括哈佛、MIT 等美国大学教授和科技公司高管，讲授人工智能、金融科技、航天工程、国际贸易与领导力等课程。在哈佛导师和各校招生官带领下，学员参访哈佛、MIT、耶鲁、普林斯顿等 10 所名校，以及大学实验室、科技公司、国际组织和人文艺术景点等 35 家世界知名机构。


  多位名校招生官和在校生、校友为学员解读美本申请流程和招生标准。结业时，每位学员获得一份《全球胜任力证书》和一套个性化的《美国本科升学规划方案》。'
