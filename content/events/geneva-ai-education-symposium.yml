summary: WinPlus co-founder Cathy Guo joins policymakers, researchers and NGO leaders in Geneva to explore how AI can widen access to education for less advantaged communities.
statement: Can AI close the education gap instead of widening it? In Geneva, WinPlus joins the conversation.
details: 'More than 250 million children worldwide are out of school, and every new wave of technology risks widening the gap between the Global North and South. Used wisely and under clear ethical standards, artificial intelligence can help close it, through self-directed learning, machine translation, digital literacy and distance education in remote, conflict-affected and disaster-hit regions.


  Convened by Educators Without Borders International, this symposium brings together executives, international NGOs, policymakers and leading researchers from Europe with educators from less advantaged communities, to build a practical vision and actionable recommendations, from low-cost connectivity to teacher training and sustainable funding.


  WinPlus co-founder **Cathy Guo** moderates the opening session on AI and educational justice and speaks in the session on pioneering experiences and applied models, drawing on WinPlus''s work connecting students with mentors and real-world learning across borders.'
