help:
- title: Program-specific strategy
  text: Canadian universities admit by program and often weigh grades heavily. We plan courses and prerequisites early and choose programs strategically.
- title: Supplementary applications
  text: Personal profiles, supplementary essays, video responses and portfolios for competitive programs such as engineering, computer science and commerce.
- title: Graduate applications
  text: Master's and PhD applications, including statements, supervisor outreach and funding considerations.
highlight:
  label: Smart planning
  title: One profile, several countries
  text: Many families apply to Canada alongside the US and UK. We coordinate timelines and requirements so one strong profile serves every application.
faq:
- q: When are Canadian application deadlines?
  a: Most undergraduate deadlines fall between January and March, with some programs and scholarships earlier, from November.
- q: Do Canadian universities consider extracurriculars?
  a: Increasingly, yes, especially through supplementary applications for competitive programs. We help students present activities effectively.
