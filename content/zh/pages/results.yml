cases_title: 精选案例与学员故事
cases_intro: 截然不同的起点，同一种方法：围绕学生本人制定规划。
cases:
- tag: 常春藤
  title: 从年级第一到耶鲁（含奖学金）
  start: 9 年级暑假开始指导。GPA 4.0，14 门 AP 满分，年级排名 1/300+，托福 117，SAT 1550。生物与公共卫生活动丰富，但缺少国际影响力。
  strategy: 补足国际领导力与专家推荐：申请国际女性大会发言，由美国疾控中心专家与北大全球健康教授指导科研，并由耶鲁校友面试官与哈佛导师共同指导文书与模拟面试。
  change: 在曼谷全球女性大会上台发言，绘画作品入选大会画展；获得两封专家推荐信；50+ 轮文书修改；获得所申请藤校全部面试。
  outcome: 录取耶鲁（含奖学金）、宾大、约翰霍普金斯、圣母大学、加州伯克利与加州洛杉矶。
- tag: 逆袭
  title: 从无托福、无 SAT 到 Top 50 录取与 18 万美元奖学金
  start: 11 年级暑假开始指导。GPA 约 3.5，无托福、无 SAT、无科研。活动丰富但缺少亮点与国际高度。
  strategy: 八大要素全面拔高：密集的标化提分计划、与地理信息科学教授合作三个月科研、参加联合国气候大会，以及摄影作品集与个人影展。
  change: 托福 99、SAT 1400（拼分）；发表一篇 GIS 研究论文；在联合国气候大会上发言；举办摄影展并在杂志发表作品；在儿童医院举办大提琴慈善演出。
  outcome: 录取加州戴维斯、波士顿大学、普渡、东北大学与俄亥俄州立，并获加州河滨 8 万美元、加州圣克鲁兹 6 万美元、雪城 4 万美元奖学金；加州洛杉矶与加州圣地亚哥候补。
- tag: 美英双轨
  title: 剑桥天体物理与加州伯克利：一份背景，双轨录取
  start: 一位热爱天文的学生，希望同时保留美国与英国两条路径，而两种体系看重的能力截然不同。
  strategy: 打造同时服务两国申请的背景：2024 年美国东海岸名校研学；2025 年与 NASA 科学家进行小班科研，使用 CODE V 光学软件研究系外行星望远镜设计，并获得导师推荐信。
  change: 科研深度支撑了英国个人陈述与剑桥面试（学生在面试中运用了镜面材料晶体堆积的研究经验），同时构建了融合天文与 STEM 教育的美国申请叙事。
  outcome: 获剑桥大学（天体物理）录取，并被加州大学伯克利分校录取。
stories:
- tag: 国际舞台
  title: WinPlus 学生在联合国总部 COSP19 发言
  text: 2026 年 6 月，一位 17 岁的 WinPlus 学生作为唯一的高中生发言人，在纽约联合国总部举行的《残疾人权利公约》第十九届缔约国大会上发言。
  image: /images/uploads/students/cosp19-speech.webp
  image_alt: WinPlus 学生在纽约联合国总部 COSP19 大会上发言
  link: insights/from-the-classroom-to-the-un-floor.html
  image_position: 50% 35%
- tag: 科研实习
  title: 两位学员，一台深空望远镜
  text: 一位刚被知名科研项目拒绝，一位所在的美国公立高中几乎没有科研资源。与NASA科学家共同完成八周深空望远镜科研后，分别收获剑桥、帝国理工、伯克利天体物理录取，以及密歇根、UCLA、UIUC机械工程录取。
  image: https://images.unsplash.com/photo-1446776811953-b23d57bd21aa
  image_alt: 从国际空间站看到的地球
  link: insights/nasa-mentored-research-two-students-one-telescope.html
- tag: 国际舞台
  title: 走进联合国总部：研讨土著议题
  text: 2026 年 4 月，欧歌学子参加联合国土著问题常设论坛第二十五届会议，在大会厅开幕式与气候、人权、人工智能等分论坛中，亲历全球对话现场。
  image: /images/uploads/photos/unpfii-2026-general-assembly-group.webp
  image_alt: 郭琪老师和欧歌学员与土著代表在联合国大会厅
  link: insights/inside-the-un-forum-on-indigenous-issues.html
testimonials_title: 家长怎么说
testimonials:
- quote: 我们所到访的十所高校给了我深深的震撼，二十几位德才兼备的名校教授和出类拔萃的校友，让我感慨他们当之无愧为世界名校的精英。他们的教导都深深印在我心里，让我对进入名校的欲望越来越强烈，梦想有朝一日成为像他们一样的精英栋梁。
  name: 初三学员
  role: 名校深度研学
- quote: 通过这次行程，我对于人生规划有了较深的思考和认识。我明白了美国大学实际上想了解我是谁、有什么独特之处、希望成为什么样的人，以及希望对世界和社会做出什么贡献。同时，我还身临其境地感受到了美国文化的多元、开放、热情和包容，相信这一切都会是我人生中宝贵的财富。
  name: 高一学员
  role: 名校深度研学
- quote: 非常感谢老师们无微不至的照顾！孩子回到家还哭了，说舍不得老师和同学们。这次美国之行的大集体温暖又美好，行程安排紧凑丰富，孩子收获很大！
  name: 高二家长
  role: 名校深度研学
- quote: 孩子收获满满，各位老师的大爱更是让人感动。回家的路上，孩子对各位老师在异国他乡亲人般的照顾赞不绝口，虽身在美国，却如家般温暖，再次感谢各位老师的倾情付出！
  name: 初二家长
  role: 名校深度研学
