faq:
  - q: 什么是藤校申请规划？
    a: 藤校申请规划是面向八所常春藤盟校的专业升学指导。在 WinPlus，它将长期背景提升（科研、领导力、学术）与申请策略、文书打磨和面试准备结合起来，由一位专属顾问全程负责。
  - q: 常春藤盟校包括哪些大学？
    a: 常春藤盟校共八所：哈佛、耶鲁、普林斯顿、哥伦比亚、宾夕法尼亚大学、布朗、康奈尔和达特茅斯。WinPlus 学员已获得哈佛、耶鲁、普林斯顿、哥伦比亚、宾大和布朗的录取。
  - q: 孩子应该从什么时候开始准备藤校申请？
    a: 9 或 10 年级是最理想的时间，可以通过科研与领导力经历打造真正的学术主线，这对藤校而言远比临时打磨文书更重要。我们也为 11、12 年级学生提供集中的申请策略支持。
  - q: 国际学生能申请到常春藤盟校吗？
    a: 可以。藤校面向全球招生，但国际学生之间的竞争非常激烈。WinPlus 已帮助来自中国、美国及其他国家的学生获得藤校及 Top30 名校录取。
  - q: WinPlus 在藤校申请方面取得了哪些成果？
    a: 截至 2026 年 7 月，WinPlus 学员已斩获 87 封 Top30 及常春藤名校录取，包括哈佛、耶鲁、普林斯顿、哥伦比亚、宾大和布朗，其中耶鲁大学连续三年获录取。
  - q: 你们能保证藤校录取吗？
    a: 任何负责任的顾问都无法保证录取。我们能保证的是清晰的策略、坦诚的建议，以及一位专属顾问帮助学生呈现最强、最真实的申请。
