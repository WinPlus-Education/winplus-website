summary: WinPlus 学生代表团参加在土耳其安塔利亚举行的 2026 年联合国气候变化大会（COP31），走近全球气候议程。
details: |-
  COP31（2026 年联合国气候变化大会）将于 2026 年 11 月 9 日至 20 日在土耳其安塔利亚举行。土耳其为东道国并担任 COP31 主席国，澳大利亚主导谈判工作。

  会前，WinPlus 学生在导师指导下系统准备：了解联合国气候进程与核心议题，并提出自己的研究问题。会议期间，学生参加分会场与边会活动，并在会议规则允许的情况下展示研究成果。

  继 COP28 迪拜大会五名 WinPlus 学生发表气候研究之后，COP31 是我们在全球气候舞台上的又一站。[请确认代表团详情、现场日期及参与方式。]

  官方会议信息：[UNFCCC：The road to Antalya](https://unfccc.int/cop31/the-road-to-antalya)。WinPlus 是独立教育机构，学生依照会议自身的注册规则参与，不代表 UNFCCC 对 WinPlus 的认可。
