eyebrow: 科研与实习
title: 让高中生做出值得写进大学申请的真实成果
intro: 我们的项目不是模拟练习，而是真实课题、真实导师与真实成果，正是顶尖大学招生官看重的经历。
image: https://images.unsplash.com/photo-1630959305606-3123a081dada
image_alt: 研究人员使用显微镜的剪影

why_title: 为什么科研很重要
method_title: 双阶段方法，确保真实成果
method_text: '我们采用「学习周 + 产出周」双阶段方法，确保每位学生带走可展示、可核实的硬核成果，而不是一纸参与证明。'
why:
  - title: 提升申请竞争力
    text: 科研经历是申请常春藤和 Top-20 名校最有力的差异化因素之一，而大多数申请者并不具备。
  - title: 面向未来的能力
    text: 学生学习专业人士真正使用的工具，从 Python 与大语言模型，到实验数据分析与影视制作。
  - title: 接触顶尖人脉
    text: 学生直接与来自世界一流机构的工程师、科学家和创作者合作。

deliverables_title: 每位学生的收获
deliverables_intro: 每个项目都以实实在在的成果收尾，既能增强大学申请竞争力，也将长久伴随学生成长。
deliverables:
  - title: 导师亲笔推荐信
    text: 导师是 NASA、Meta、加州理工的在职科学家及科技大厂的工程主管。高质量完成项目的学生，将获得亲眼见证其工作的导师所写的推荐信。
  - title: 科研论文或产品成果
    text: 根据项目不同，完成科研论文、产品原型、金融模型或短片，可直接用于申请。
  - title: 作品集与成果展示
    text: 学生在结业展示会上汇报成果，获得精致的作品集与展示材料。
  - title: 实习科研证书
    text: 正式证书，注明项目内容、导师与完成时长。
  - title: 发表与竞赛指导
    text: 在合适的情况下，协助学生向期刊、学术会议或竞赛投稿。
  - title: 可直接用于申请的叙事
    text: 顾问帮助学生将这段经历转化为活动描述与文书素材。

