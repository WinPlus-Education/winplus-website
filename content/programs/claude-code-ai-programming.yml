format: Online · live mentor sessions
length: 8 weeks
dates: Summer 2027 · dates to be confirmed
cohort: Small group
overview: 'AI is changing how software gets written. The engineers who thrive will be the ones who can direct AI tools, review their work and make sound decisions. Students use Claude and Claude Code to
  design, build and publish their own software while keeping a portfolio website and weekly learning journal.


  Students learn HTML, CSS, JavaScript, the terminal and Git, and deploy to GitHub Pages. Projects follow one of four directions (creative coding, data visualisation, web applications or interactive essays),
  so technical learning connects with each student''s own interests.'
outcomes:
- A live portfolio website and published project
- A code repository with meaningful version history
- Seven learning journals and a final presentation
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: Tools of the trade
  text: HTML, CSS, JavaScript, developer tools, the terminal and Git.
- phase: Weeks 3–4
  title: Working with AI
  text: Specifying features, reviewing AI-generated changes, deciding to accept, revise or reverse.
- phase: Weeks 5–6
  title: Build the project
  text: Scope, build and iterate on a creative, data, web-app or essay project.
- phase: Weeks 7–8
  title: Ship & defend
  text: Peer testing, reliability on mobile and slow connections, deployment and a final presentation.
eligibility:
- Grades 9–12
- No prior coding experience required
- A laptop and reliable internet connection
mentor_note: Software engineer with an Apple background
