faq_title: "升学规划常见问题"
faq:
  - q: 什么时候开始与 WinPlus 合作最合适？
    a: "最理想的是 9 或 10 年级，有充足时间积累科研、领导力和完整的个人背景。我们也为 11、12 年级需要集中申请支持的学生，以及各阶段的研究生申请者提供服务。"
  - q: 你们保证录取吗？
    a: "不保证。任何有职业操守的顾问都无法保证录取。我们承诺的是周密的策略、专业的支持，以及帮助学生呈现最真实、最强的自己。"
  - q: 你们提供藤校申请指导吗？
    a: "提供。美国本科项目包含藤校申请策略：多年背景规划、早申（REA/ED/EA）策略、与哈佛、耶鲁、斯坦福导师共同打磨文书，以及藤校校友面试官面试辅导。"
  - q: 你们服务美国以外的学生吗？
    a: "服务。我们的许多家庭来自中国大陆、香港、新加坡等地。哈佛广场与北京团队通过线上方式与学生沟通，并根据您的时区安排时间。"
  - q: 你们支持哪些国家的申请？
    a: "美国升学（美高、本科、研究生）是我们的核心业务；同时也指导英国、加拿大和澳洲的本科及研究生申请。"
  - q: 升学规划的费用是多少？
    a: "项目根据学生年级、目标和所需支持程度量身定制，我们会在免费规划咨询后提供报价。[如需可补充价格说明。]"
  - q: WinPlus 与其他留学顾问有什么不同？
    a: "我们是扎根美国的精品团队，导师来自学生向往的名校，并且通过自有的科研、名校研学和国际会议项目帮助学生真正提升背景，而不仅仅是修改申请材料。"

