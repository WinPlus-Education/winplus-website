highlights:
- title: 世界公民
  text: 哈佛导师和校友讲授领导力、国际关系和全球挑战；探讨全球贫困、健康、能源、教育和种族歧视等议题，中美两国在其中的角色，以及青少年如何在未来世界格局中创造贡献。
- title: 文化熔炉
  text: 耶鲁导师讲授美国政治经济、法律和历史脉络，理解中美文化异同；参观著名博物馆和艺术中心；由美国教练指导体验橄榄球、壁球和棒球。
- title: 科技创新
  text: 谷歌、Meta 等硅谷公司高管讲授生成式人工智能、机器学习和产品设计；参访哈佛工程学院、MIT 媒体实验室与航天卫星实验室；哈佛医学院与 NASA 导师讲解基因工程和卫星遥感。
- title: 思维碰撞
  text: 英文小组讨论、美式演讲训练，以及与科技行业人士和多元背景学生的交流，提升英文表达与跨文化共情能力。
arc:
- label: 波士顿与剑桥
  title: 哈佛与 MIT
  text: 哈佛与 MIT 课堂、MIT 媒体实验室与哈佛工程学院实验室、查尔斯河帆船。课堂之外：自由之路历史街区、水陆双栖车城市之旅、波士顿美术馆、公共图书馆、昆西市场与哈佛艺术博物馆，团队晚餐让同学们成为好友。
- label: 纽黑文与普林斯顿
  title: 常春藤之旅
  text: 耶鲁老校园与斯特林纪念图书馆，随后前往普林斯顿：招生说明会、在校生带领参观校园，并在普林斯顿课堂上课。
- label: 纽约与费城
  title: 塑造美国的城市
  text: 游轮参观自由女神像、华尔街与 911 纪念馆、联合国总部、时代广场、帝国大厦、中央公园、大都会博物馆、自然历史博物馆与百老汇音乐剧；费城国家独立历史公园与自由钟。
- label: 硅谷
  title: 未来在这里诞生
  text: 参访领先科技公司，与谷歌、Meta 等公司高管交流，第一手了解科技行业如何运作，从产品设计到人工智能研究。
outcomes:
- title: 全球胜任力证书
  text: 完成 50 小时课程后颁发给每位学员。
- title: 个性化升学规划
  text: 导师根据每位学员的兴趣、优势与目标制定美国本科升学规划。
- title: 自信的英文表达
  text: 演讲、小组讨论，以及与专业人士和同龄人的真实交流。
- title: 导师与伙伴
  text: 与导师和同伴建立的联系在项目结束后长久延续。
