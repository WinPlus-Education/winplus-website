services_title: 我们的升学服务
services_intro: 选择适合你目标的路径。每项服务均由一位专属顾问负责。

diff_title: WinPlus 升学规划的不同之处
diff_intro: 大多数升学服务从 11 年级的文书开始。我们从学生本身出发，先打造值得书写的背景。
differentiators:
  - title: 「申请八大要素」体系
    text: 多年实践沉淀的成熟体系，覆盖学术与活动全维度，将零散经历整合为一条有说服力的申请叙事。
  - title: 藤校招生官联合指导
    text: 前常春藤盟校招生官与我们的导师共同指导，成果源于方法论，而非绑定某一位明星顾问。
  - title: 一位顾问，全程负责
    text: 同一位顾问从第一次咨询陪伴到最终录取决定，避免交接中的信息流失。
  - title: 规划与真实经历结合
    text: WinPlus 同时运营科研、实习与国际背景提升项目，顾问可以直接为学生打造让申请脱颖而出的经历，而不只是包装描述。
  - title: 清晰透明的里程碑
    text: 家庭会收到书面规划路线图、定期进度更新，以及清晰的时间节点清单。
  - title: 有分量的导师推荐信
    text: 参加我们项目的学生有机会获得顶尖机构导师的推荐信，这些导师亲眼见证了学生的工作。

process_title: 服务流程
process_intro: 清晰的六个阶段，从了解学生开始，到做出满意的录取选择结束。
process:
  - title: 免费规划咨询
    text: 与学生和家长见面，了解目标、兴趣、学业成绩与目标院校。
    deliverable: 初步建议
    when: 第 1 周
  - title: 背景评估
    text: 顾问全面评估成绩、标化、活动与兴趣，并与目标院校录取学生进行对标。
    deliverable: 书面背景评估报告
    when: 第 1–3 周
  - title: 多年规划路线图
    text: 量身定制的规划，涵盖选课、标化、科研、实习、竞赛与暑期安排，以及申请要讲述的个人故事。
    deliverable: 规划路线图与时间表
    when: 第 1 个月
  - title: 背景提升
    text: 学生完成科研、实习与国际背景提升项目，顾问持续跟进并每学期调整规划。
    deliverable: 每学期复盘
    when: 持续进行
  - title: 申请阶段
    text: 选校策略、文书构思与多轮修改、活动列表、推荐信规划、面试辅导与申请材料审核。
    deliverable: 完整、经审核的申请材料
    when: 11–12 年级
  - title: 录取与后续
    text: 帮助比较录取结果、处理候补与申诉，并帮助学生做好进入大学的准备。
    deliverable: 录取决策支持
    when: 12 年级春季

timeline_title: 各年级的规划重点
timeline:
  - { grade: "9 年级", focus: "探索兴趣，选择有挑战性的课程，参加第一个科研或技能项目。" }
  - { grade: "10 年级", focus: "深耕一两个方向，完成导师指导的科研项目，规划标化考试。" }
  - { grade: "11 年级", focus: "领导力与影响力，标化考试，暑期项目，确定选校名单。" }
  - { grade: "12 年级", focus: "文书、申请、面试、录取决策，以及进入大学的过渡。" }

faq:
  - q: 升学规划服务的费用是多少？
    a: "费用取决于学生的年级、目标国家以及所需的支持程度。[请补充价格说明，或邀请家庭预约免费咨询。]"
  - q: 孩子已经 12 年级了，还来得及吗？
    a: 来得及。我们为 12 年级学生提供针对性的申请支持，包括选校策略、文书、面试和申请材料审核。
  - q: 你们保证录取吗？
    a: 任何负责任的升学顾问都无法保证录取。我们保证的是周密的策略、专业的支持，以及帮助学生展现最好、最真实的自己。
  - q: 你们为美国以外的学生提供服务吗？
    a: 是的。我们的很多家庭在中国、新加坡等地。我们通过线上会面，并根据你的时区安排时间。

