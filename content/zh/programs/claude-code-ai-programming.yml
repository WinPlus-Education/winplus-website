meta_description: 八周内借助 AI 编程工具设计、开发并上线真实软件，由苹果背景工程师指导。面向高中生的线上项目。
summary: 学会用 AI 编程工具设计、开发并上线真实软件，也学会判断 AI 的对与错，由苹果工程团队背景的导师指导。
image: https://images.unsplash.com/photo-1565687981296-535f09db714e
image_alt: 使用笔记本和显示器编程的程序员
format: 线上 · 导师直播课
length: 8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: 'AI 正在改变软件的编写方式。未来出色的工程师，是能够驾驭 AI 工具、审查其产出并做出正确判断的人。学生将使用 Claude 与 Claude Code 设计、开发并发布自己的软件，同时维护个人作品集网站与每周学习日志。


  学生将学习 HTML、CSS、JavaScript、终端与 Git，并部署到 GitHub Pages。项目可选四个方向：创意编程、数据可视化、网页应用或互动文章，让技术学习与个人兴趣相结合。'
outcomes:
- 上线的个人作品集网站与项目
- 包含完整版本记录的代码仓库
- 七篇学习日志与期末展示
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 基础工具
  text: HTML、CSS、JavaScript、开发者工具、终端与 Git。
- phase: 第 3–4 周
  title: 与 AI 协作
  text: 描述需求、审查 AI 生成的修改，决定接受、修改或回退。
- phase: 第 5–6 周
  title: 打造项目
  text: 确定范围，开发并迭代创意、数据、网页或文章项目。
- phase: 第 7–8 周
  title: 上线与答辩
  text: 同伴测试、移动端与弱网可靠性、部署与期末展示。
eligibility:
- 9–12 年级
- 无需编程基础
- 笔记本电脑与稳定网络
