  - 文书与面试素材
highlight: "2026 年 6 月，一名 17 岁的 WinPlus 学员经过联合国议题培训与全程辅导，成为纽约联合国总部《残疾人权利公约》第十九届缔约国大会（COSP19）上唯一的高中生发言代表。"
