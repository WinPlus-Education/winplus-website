faq:
  - q: Is a one-year UK master's respected?
    a: Yes. Many UK master's programs are highly regarded internationally. We help you weigh one-year and two-year options against your goals.
  - q: Do I need to contact supervisors before applying?
    a: For many research degrees in the UK, Canada and Australia, contacting potential supervisors early is expected. We help you do it well.
