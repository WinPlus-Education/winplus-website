summary: A 12-day program for 15 students from the High School Affiliated to Renmin University of China, with ten universities, McKinsey, Meta, the IMF and NASA.
details: Co-organized with the High School Affiliated to Renmin University of China, the program took 15 students to ten universities including Harvard, MIT, Brown, Yale, Princeton, Penn, Columbia, NYU,
  Johns Hopkins and Georgetown. Students visited McKinsey & Company, Meta's New York office and BrainCo, met economists at the International Monetary Fund, heard from a UN peacekeeping officer, learned
  sailing at MIT and squash with a former Yale team captain.
