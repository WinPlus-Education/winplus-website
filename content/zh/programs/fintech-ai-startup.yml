overview: '每一笔交易、支付和银行应用的背后都是科技。学生将了解金融科技产品如何实现金融服务的自动化与交付，并把机器学习、AI 工具和用户体验设计应用到自己选择的问题上。


  在市场调研的基础上，每位学生设计一个金融科技创业概念并撰写商业计划书，从创始人的视角理解产品、用户与商业模式。'
outcomes:
- 金融科技创业商业计划书
- 产品概念或原型
- 投资人式期末路演
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 金融科技原理
  text: 金融科技如何实现服务自动化与交付。
- phase: 第 3–4 周
  title: 市场调研
  text: 用户、竞争对手与未被满足的需求。
- phase: 第 5–6 周
  title: 产品与 AI
  text: 将机器学习、AI 编程与 UX 设计工具应用于产品概念。
- phase: 第 7–8 周
  title: 计划书与路演
  text: 完成商业计划书与期末路演。
eligibility:
- 9–12 年级
- 无需金融或编程基础
- 对商业、经济或科技感兴趣
