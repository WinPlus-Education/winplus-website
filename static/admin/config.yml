  summary: '{{title}} ({{category}})'
  fields:
  - name: title
    label: Title
    widget: string
  - name: seo_title
    label: SEO title (optional)
    widget: string
    required: false
  - name: date
    label: Publish date
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - name: category
    label: Topic (must match a topic filter on the Insights page)
    widget: string
  - name: summary
    label: Short summary (also used for Google)
    widget: text
  - name: image
    label: Cover image
    widget: image
    choose_url: true
    required: false
  - name: image_alt
    label: Cover image description
    widget: string
    required: false
  - name: source
    label: Originally published on (e.g. WeChat, Xiaohongshu)
    widget: string
    required: false
  - name: featured
    label: Feature at top of Insights page
    widget: boolean
    default: false
    required: false
  - name: body
    label: Article
    widget: markdown
