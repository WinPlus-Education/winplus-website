faq:
  - q: Do students need prior experience?
    a: Most programs are designed for motivated beginners. Some advanced tracks require basic coding or math, which is listed on each program page.
  - q: Will my child really get a recommendation letter?
    a: Mentors write letters for students who complete the program and demonstrate strong work. Letters are earned, not automatic, which is what makes them valuable.
  - q: Can students publish their research?
    a: Some projects are suitable for student journals, conferences or competitions. Mentors and consultants advise on the best outlet.
  - q: How do I choose the right program?
    a: Book a free strategy session and your consultant will recommend programs that fit the student's interests and application plan.

