image: /images/uploads/photos/hks-session.webp
image_alt: WinPlus 学员在哈佛肯尼迪学院参加导师课，2026 年 7 月
summary: 12 天走访哈佛、MIT、耶鲁、普林斯顿与硅谷，聆听前 NASA 宇航员等教授授课，参访实验室并参加招生说明会。
details: 学员完成了由哈佛、MIT 与耶鲁导师主讲的 50 小时全球胜任力课程，涵盖人工智能、金融科技、航天工程、国际事务与领导力；参访了 MIT 媒体实验室与航空航天实验室，与在校生和校友交流，并获得个性化美国本科升学规划。
