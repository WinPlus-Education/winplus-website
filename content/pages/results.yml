cases_title: Case studies
cases_intro: 'Two very different starting points, one approach: a plan built around the student.'
cases:
- tag: Ivy League
  title: From top of the class to Yale, with scholarship
  start: Started the summer after Grade 9. GPA 4.0 with 14 AP 5s, ranked 1st of 300+, TOEFL 117, SAT 1550. Rich activities in biology and public health, but little international impact.
  strategy: 'Add global leadership and expert recommendations: a speaking role at an international women''s forum, research guided by a CDC epidemiologist and a global-health professor,
    and essays and mock interviews with a Yale alumni interviewer and Harvard mentors.'
  change: Spoke at a global women's forum in Bangkok; artwork exhibited at the forum; two expert recommendation letters; 50+ rounds of essay revision; interviews at every Ivy applied
    to.
  outcome: Admitted to Yale (with scholarship), Penn, Johns Hopkins, Notre Dame, UC Berkeley and UCLA.
  image: /images/uploads/students/ivy-admit-story.jpg
  image_alt: A WinPlus student presenting her work
- tag: Turnaround
  title: From no SAT or TOEFL to Top-50 offers and $180,000 in scholarships
  start: Started the summer after Grade 11. GPA around 3.5, no TOEFL, no SAT, no research. Many activities but no standout achievement or international reach.
  strategy: 'Raise every one of the Eight Key Elements at once: an intensive testing plan, a three-month research project with a geospatial-science professor, a UN climate conference,
    and a photography portfolio and exhibition.'
  change: TOEFL 99 and SAT 1400 (superscore); a published GIS research paper; spoke at a UN climate conference; a photography exhibition and published work; charity cello concerts at
    a children's hospital.
  outcome: Admitted to UC Davis, Boston University, Purdue, Northeastern and Ohio State, with scholarships of $80,000 (UC Riverside), $60,000 (UC Santa Cruz) and $40,000 (Syracuse).
    Waitlisted at UCLA and UC San Diego.
  image: /images/uploads/students/uc-scholarship-story.jpg
  image_alt: A WinPlus student on a university visit
stories_title: Student stories
stories:
- tag: Global stage
  title: The only high-school speaker at COSP19
  text: After issue training with WinPlus mentors, a 17-year-old student addressed the 19th Conference of States Parties to the CRPD at UN Headquarters, New York, in June 2026.
  image: /images/uploads/students/un-cosp19-speaker.jpg
  image_alt: A WinPlus student speaking at COSP19
  link: experiences/global-conferences.html
- tag: Research
  title: A NASA mentor's letter, and Harvard and Stanford computer science
  text: A student who completed a NASA planetary-analysis software project with a NASA scientist's recommendation was admitted to Harvard and Stanford for computer science.
  image: https://images.unsplash.com/photo-1630959305606-3123a081dada
  image_alt: A student working on a research project
  link: research.html
- tag: Engineering
  title: Summer schools and research to Penn and Berkeley engineering
  text: MIT underwater-robotics research and environmental-policy research, each with a recommendation, helped a mechanical-engineering applicant earn offers from Penn and UC Berkeley.
  image: https://images.unsplash.com/photo-1653387300291-bfa1eeb90e16
  image_alt: Students in an engineering lab
  link: admissions/us-college.html
