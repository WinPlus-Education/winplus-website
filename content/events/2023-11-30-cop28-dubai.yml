summary: Five students presented their own climate research at COP28, the largest UN climate summit ever held, spoke at the China Pavilion and were featured on national television.
statement: At the largest climate summit in history, five students brought research of their own.
details: 'COP28, the 2023 UN Climate Change Conference, met at Expo City Dubai from November 30 to December 12, 2023. It concluded the first global stocktake of the Paris Agreement and, in the UAE Consensus, called on the world to transition away from fossil fuels.


  Co-organized with the RDFZ International Curriculum Centre and led by WinPlus co-founder Cathy Guo, a Harvard alumna, five students took their own research to the conference: on urban heat waves, Europe''s energy security, the pandemic and global governance, and turning industrial waste into resources.


  Over twelve days they spoke at a side event in the Blue Zone, presented their work to delegates from every continent, and met professors, lawmakers and business leaders across Dubai, Abu Dhabi and Sharjah.'
