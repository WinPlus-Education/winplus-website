faq_title: 'Global experiences: common questions'
faq:
- q: How is Campus Immersion different from a campus tour?
  a: 'A campus tour shows students buildings. Campus Immersion puts them inside labs, classrooms and companies: hands-on sessions, seminars with professors, conversations with current
    students and admissions sessions, taught by WinPlus mentors from Harvard, MIT, Yale and Stanford.'
- q: Who can join the Global Leadership Conferences program?
  a: Students in Grades 9–12 with a genuine interest in global issues. Participation depends on each conference's rules and on the student's preparation and readiness. Places are limited
    and not every applicant is selected.
- q: Are students supervised during in-person programs?
  a: Yes. WinPlus staff travel with every cohort and accompany students throughout. [Add staff-to-student ratios, safety protocols and insurance details.]
- q: What's included in the program fee?
  a: Typically mentor-led coursework, accommodation, ground transport, meals and entry tickets. International flights, visas and travel insurance are usually not included; our team helps
    families arrange them. Details are confirmed for each program.
- q: Is WinPlus affiliated with the universities or organizations students visit?
  a: No. Visits and sessions are arranged through WinPlus mentors and partners. University and organization names describe the places students visit and do not imply endorsement of WinPlus.
