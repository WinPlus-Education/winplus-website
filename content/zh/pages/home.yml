offer:
  eyebrow: 我们的项目
  title: 四大项目，一套为你量身打造的规划。
  intro: 无论申请高中、本科还是研究生，很多申请者都需要分别寻找升学顾问、科研项目和暑期活动。在 WinPlus，每一个项目都相互赋能，由同一个了解你的团队统筹。
  segments:
  - title: 升学规划
    text: 从美国高中到研究生，覆盖英国、加拿大与澳洲：由美国顶尖大学的导师与校友面试官共同制定申请策略。
    outcomes:
    - 真正属于你的选校方案与个人故事
    - 与熟悉目标院校的导师打磨文书
    - 校友面试官模拟面试
    image: /images/uploads/campus/yale-harkness.webp
    image_alt: 耶鲁大学哈克尼斯塔
    link: admissions.html
    link_text: 了解升学规划
  - title: 科研与实习
    text: 由科学家、工程师与行业领袖带领的定制线上科研与实习。解决真实问题，做出让招生官记住的成果。
    outcomes:
    - 从第一天起解决真实问题
    - 完成论文、产品原型或作品集
    - 获得见证你成果的导师推荐信
    image: https://images.unsplash.com/photo-1630959305790-4c956ce6c0b6
    image_alt: 在实验室显微镜前工作的科学家
    link: research.html
    link_text: 了解科研项目
  - title: 名校深度研学
    text: 不是走马观花的参观。走进美国顶尖大学的实验室、课堂与企业，与教授和在校生深入交流，找到真正适合自己的大学。
    outcomes:
    - 在大学实验室中亲手实践
    - 与教授和在校生坦诚交流
    - 清晰了解最适合自己的大学
    image: /images/uploads/campus/stanford-arcade.webp
    image_alt: 斯坦福大学主四方院拱廊与胡佛塔
    link: experiences/campus-immersion.html
    link_text: 了解名校研学
  - title: 全球领导力会议
    text: 研究一项全球议题，在高规格国际会议上向外交官、政策制定者和全球代表展示你的观点。
    outcomes:
    - 面向国际代表发言
    - 建立跨越国界的人脉
    - 在世界舞台上证明领导力
    image: /images/uploads/campus/un-flags.webp
    image_alt: 国际组织总部外的各国国旗
    link: experiences/global-conferences.html
    link_text: 了解国际会议
why:
  eyebrow: 为什么选择我们
  title: 精英指导，绝不套用模板。
  intro: WinPlus 是精品人才发展平台，而非流水线式的申请工厂。我们服务的学生更少，陪伴更深、更久。
  points:
  - title: 扎根美国本土
    text: 双语的美国华人与美国本地团队在美国生活和工作，每个申请季都能获得在校生、校友面试官及最新招生政策的一手信息。
  - title: 亲历者导师
    text: 教授、科学家、校友面试官与行业领袖直接指导学生，分享真正走进名校、并在名校中成长所需要的一切。
  - title: 为每一位学生量身打造路线图
    text: 我们先真正了解每一位学生：他们的优势、兴趣与目标，并尊重他们想去的方向。再据此制定循序渐进的路线图，让学生展现最好的自己，并在每一步给予指导。绝不套用模板。
  - title: 陪伴成长的全过程
    text: 录取是里程碑，而非终点。从初中到大学、研究生阶段乃至职业发展，我们一路同行，培养受益终身的好奇心、能力与品格。
journey:
  eyebrow: 我们的方法
  title: 从第一次对话，到最终的录取选择
  intro: 每一段旅程都遵循清晰严谨的路径，而每一份规划都独一无二。
  link_text: 了解服务流程
  link: about.html#how-we-work
  early_title: 越早规划，选择越多。
  early_text: 最有竞争力的申请需要数年积累，而不是一个暑假。无论是初中、高中起步，还是研究生申请前一年，都请尽早与我们联系，让每一步都提前布局。
  early_cta: 现在开始规划
  early_link: contact.html
  steps:
  - title: 了解
    text: 免费规划咨询，深入了解学生的背景、目标、兴趣与性格。
  - title: 规划
    text: 量身定制的多年发展路线图：参加哪些活动、科研和实习，以及何时进行，并由专属导师全程指导。
  - title: 提升
    text: 通过真实的科研、名校研学和国际舞台，让背景真正立起来，各项目相辅相成。
  - title: 申请
    text: 选校与申请策略、文书头脑风暴与修改、活动列表、推荐信及面试准备。
  - title: 抉择
    text: 协助比较录取结果、应对候补名单，为大学生活做好准备。
