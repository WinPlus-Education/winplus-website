faq:
  - q: When should we start US college admissions counseling?
    a: Grade 9 or 10 is ideal so we can shape courses, activities and research. Many families start in Grade 11; we also support Grade 12 students.
  - q: Should my child apply Early Decision?
    a: Early Decision can raise admission chances at some schools but is binding. We help families weigh the benefits against financial aid and fit.
  - q: Are SAT or ACT scores still required?
    a: Policies vary by university and change often. We review each school's current requirements and advise on whether to submit scores.
