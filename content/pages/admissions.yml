summary_eyebrow: Our approach
summary_statement: We don't fit students into a template. We build the profile, then the application.
summary_text: 'Most counseling starts in Grade 11 with essays. Ours starts with the student: their character, experience and interests. From there we design a multi-year plan that amplifies
  their strengths and closes gaps deliberately, with research, internships and global experiences that make the application true. **US admissions is our core**, from boarding school
  to college to graduate school. We guide UK, Canadian and Australian applications with the same care.'
