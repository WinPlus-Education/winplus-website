highlights:
- title: The opening of COP31
  text: Be in Antalya as world leaders open the 2026 UN Climate Change Conference and set the agenda for global climate action.
- title: Sustainable Innovation Forum
  text: In the Climate Action Innovation Zone, hear founders, investors and policymakers on clean energy, climate finance and green technology.
- title: 100 Global Impact Leaders Forum
  text: A partner forum of the Global CSR Foundation and The European, where students compete for the chance to speak in English on climate and sustainability.
- title: Youth leadership sessions
  text: Side events on youth leadership, AI and climate, and children's rights, where students ask questions and meet speakers from around the world.
