faq:
  - q: How much does admissions counseling cost?
    a: "Packages depend on the student's grade, target countries and the level of support needed. [Add pricing guidance or invite families to book a free session.]"
  - q: Can you help if my child is already in Grade 12?
    a: Yes. We offer focused application support for seniors, covering school list strategy, essays, interviews and application review.
  - q: Do you guarantee admission?
    a: No ethical counselor can guarantee admission. We guarantee a thoughtful strategy, expert support and a student who presents their strongest, most authentic self.
  - q: Do you work with students outside the US?
    a: Yes. Many of our families are based in China, Singapore and elsewhere. We meet online and schedule around your time zone.

