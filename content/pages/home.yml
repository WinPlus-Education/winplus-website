offer:
  eyebrow: What We Offer
  title: Four programs. One plan, built around your child.
  intro: Most families assemble a counselor, a research program and a summer trip from different vendors. At WinPlus each program is designed to strengthen the others, coordinated by
    one team that knows your child.
  segments:
  - kicker: Our core
    title: Admissions Counseling
    text: From US high school to graduate school, a strategy shaped by mentors from Harvard, MIT, Yale and Stanford, and by Ivy League alumni interviewers. We also guide UK, Canadian
      and Australian applications.
    outcomes:
    - A school list and story that are unmistakably yours
    - Essays developed with mentors from your target schools
    - Interview preparation with alumni interviewers
    image: /images/uploads/photos/hks-session.webp
    image_alt: A WinPlus mentor leading a session with students at Harvard Kennedy School
    link: admissions.html
    link_text: Explore admissions
  - kicker: Real-world work
    title: Research & Internships
    text: Bespoke online research and internships led by scientists and engineers from NASA, Meta, Microsoft, Caltech and MIT. Students solve real problems and build work admissions
      officers remember.
    outcomes:
    - First-hand experience of real problem-solving
    - A finished paper, prototype or portfolio
    - A recommendation from a mentor who saw the work
    image: https://images.unsplash.com/photo-1630959305790-4c956ce6c0b6
    image_alt: A scientist working at a laboratory microscope
    link: research.html
    link_text: Explore programs
  - kicker: Beyond the campus tour
    title: Campus Immersion
    text: Step inside the labs, classrooms and companies of Harvard, MIT, Yale and Stanford. Students join lab and team projects and talk with faculty and current students to discover
      where they truly belong.
    outcomes:
    - Hands-on sessions in university labs
    - Candid conversations with faculty and students
    - A clear picture of the right-fit university
    image: /images/uploads/photos/yale-sterling-group.webp
    image_alt: WinPlus students and mentors at Sterling Memorial Library, Yale University
    link: experiences/campus-immersion.html
    link_text: Explore immersion
  - kicker: The global stage
    title: Global Leadership Conferences
    text: High-profile international conferences where students present their ideas to diplomats, policymakers and global delegates. It's a once-in-a-lifetime experience, and a credential
      few applicants can match.
    outcomes:
    - Speak before international delegates
    - A network that spans countries
    - Leadership proven on a world stage
    image: /images/uploads/students/un-cosp19-speaker.jpg
    image_alt: A WinPlus student speaking at an international conference
    link: experiences/global-conferences.html
    link_text: Explore conferences
why:
  eyebrow: Why WinPlus
  title: Elite guidance, never a template.
  intro: WinPlus is a boutique talent-development platform, not a transactional application service. We work with fewer families, more closely.
  points:
  - title: On the ground in the US
    text: Our Chinese-American and American team lives and works in the US, with first-hand insight from current students, alumni interviewers and each year's published admissions policy
      at the Ivy League, liberal arts colleges and the Top 100.
  - title: Mentors from the very top
    text: Professors, scientists and alumni interviewers from Harvard, MIT, Yale and Stanford guide students directly, from research projects to the final essay.
  - title: Bespoke, never a mold
    text: We build each plan around the student's character, experience and interests. We amplify their strengths and close gaps deliberately, instead of forcing them into a mold.
  - title: Growth that outlasts admission
    text: Inspired by Harvard's ideals of whole-person education and the pursuit of truth, we develop the curiosity, skills and character that carry students through university and beyond.
journey:
  eyebrow: How We Work
  title: From first conversation to final decision
  intro: Every journey follows the same disciplined arc, and no two plans look alike.
  link_text: How we work
  link: about.html#how-we-work
  steps:
  - title: Discover
    text: A free strategy session to understand the student's background, goals, interests and personality.
  - title: Design
    text: 'A bespoke multi-year roadmap: which activities, research and internships to pursue, and when. A dedicated mentor guides every step.'
  - title: Build
    highlight: true
    text: The profile comes to life through real work, with research, immersion and global stages that complement each other.
    links:
    - label: Research & Internships
      link: research.html
    - label: Campus Immersion
      link: experiences/campus-immersion.html
    - label: Global Conferences
      link: experiences/global-conferences.html
  - title: Apply
    text: Application strategy, school list, essay brainstorming and editing, activity lists, recommendations and interview preparation.
  - title: Decide
    text: We help compare offers, navigate waitlists and prepare for a confident start at university.
