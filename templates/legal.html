{% extends "base.html" %}
{% from "macros.html" import breadcrumbs with context %}
{% block content %}
<section class="page-hero">
  <div class="wrap narrow">
    {{ breadcrumbs([[page.title, current]]) }}
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ _("Last updated") }} {{ page.updated | date_fmt("long") }}</p>
  </div>
</section>
<section class="section">
  <div class="wrap narrow prose legal">{{ page.body | safe }}</div>
</section>
{% endblock %}
