statement: 领导力不是简历上的一行字，而是在全球领袖面前，说出真正有价值的话。
statement_text: 大多数学生只是阅读全球挑战，我们的学生学会参与其中。在 WinPlus 导师（包括拥有联合国与联合国儿童基金会工作经验的专业人士）指导下，学生研究自己关心的议题、准备立场文件，并在会议允许的情况下面向国际代表发言或展示。他们带回自信、全球人脉，以及极少申请者能拥有的亮点。
