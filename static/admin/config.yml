# Decap CMS configuration — defines what can be edited at yoursite.com/admin
# Docs: https://decapcms.org/docs/configuration-options/
# Uncomment to edit locally without logging in (run `npx decap-server` + `python build.py --serve`):
# local_backend: true
# Drafts & review before publishing (optional):
# publish_mode: editorial_workflow
backend:
  name: git-gateway
  branch: main
media_folder: static/images/uploads
public_folder: /images/uploads
site_url: https://winplus-education.netlify.app
display_url: https://winplus-education.netlify.app
collections:
- name: settings
  label: Site Settings
  files:
  - name: site
    label: Header, Footer, Contact & Social
    file: content/site.yml
    fields:
    - name: name
      label: Logo text
      widget: string
    - name: name_sub
      label: Logo subtitle
      widget: string
    - name: company_legal
      label: Legal company name
      widget: string
    - name: tagline
      label: Tagline (top bar)
      widget: string
    - name: site_url
      label: Website address (e.g. https://www.winplus.org) — used for SEO
      widget: string
      hint: Change when your domain is connected
    - name: default_image
      label: Default image when sharing links
      widget: image
      choose_url: true
      required: false
    - name: meta_description
      label: Default search description
      widget: text
    - name: founded
      label: Year founded
      widget: string
      required: false
    - name: address
      label: Address
      widget: string
      required: false
    - name: area_served
      label: Countries served (SEO)
      widget: list
      field:
        name: item
        label: Item
        widget: string
      required: false
    - name: email
      label: Email
      widget: string
    - name: phone
      label: Phone
      widget: string
      required: false
    - name: wechat_id
      label: WeChat ID
      widget: string
      required: false
    - name: wechat_qr
      label: WeChat QR code
      widget: image
      choose_url: true
      required: false
    - name: cta_text
      label: Header button text
      widget: string
    - name: cta_link
      label: Header button link
      widget: string
    - name: nav
      label: Main menu
      widget: list
      collapsed: true
      fields:
      - name: label
        label: Label
        widget: string
      - name: link
        label: Link (e.g. results.html)
        widget: string
      - name: children
        label: Dropdown items
        widget: list
        collapsed: true
        fields:
        - name: label
          label: Label
          widget: string
        - name: link
          label: Link
          widget: string
        summary: '{{fields.label}}'
        required: false
      summary: '{{fields.label}}'
    - name: utility_links
      label: Top bar links
      widget: list
      collapsed: true
      fields:
      - name: label
        label: Label
        widget: string
      - name: link
        label: Link
        widget: string
      summary: '{{fields.label}}'
    - name: partners_label
      label: Logo strip label
      widget: string
    - name: partners
      label: Logo strip (rolling)
      widget: list
      collapsed: true
      fields:
      - name: name
        label: Organization name
        widget: string
      - name: logo
        label: Logo file (SVG/PNG with transparent background)
        widget: image
        choose_url: true
        required: false
      summary: '{{fields.name}}'
    - name: social
      label: Social media
      widget: list
      collapsed: true
      fields:
      - name: platform
        label: Platform
        widget: select
        options:
        - wechat
        - xiaohongshu
        - linkedin
        - instagram
        - youtube
        - bilibili
        - tiktok
        - facebook
        - x
        - weibo
      - name: label
        label: Label
        widget: string
      - name: url
        label: Profile link
        widget: string
        required: false
      summary: '{{fields.label}}'
    - name: newsletter
      label: Newsletter sign-up
      widget: object
      collapsed: true
      fields:
      - name: title
        label: Title
        widget: string
      - name: text
        label: Text
        widget: text
      - name: button
        label: Button
        widget: string
    - name: footer_disclaimer
      label: Footer disclaimer
      widget: text
