help:
- title: Positioning that makes sense
  text: We clarify what you want the degree to do for you, then shape a narrative that connects your past work, research or career to the program, which is what admissions committees
    look for first.
- title: Statements, CVs and recommendations
  text: Statements of purpose, personal history statements, résumés and recommender strategy, developed with mentors who hold degrees from Harvard, MIT, Yale and other leading programs.
- title: Program fit and interviews
  text: A program list based on faculty, outcomes and fit, and preparation for faculty and admissions interviews, including MBA behavioural interviews.
highlight:
  label: Featured outcomes
  title: Harvard Business School, MIT Sloan and Wharton
  text: WinPlus mentors have guided MBA and master's applicants to programs including Harvard Business School, MIT Sloan and Wharton.
faq:
- q: Which graduate programs do you support?
  a: Master's degrees, PhD programs and MBAs across fields including engineering, computer science, economics, public policy, education, the life sciences and business.
- q: When should I start?
  a: Ideally 9–12 months before deadlines, which for most US programs fall between December and January. MBA applicants often apply in Round 1 (September–October).
- q: Do you help with PhD research statements?
  a: Yes. Mentors with doctoral degrees help shape research statements, identify potential advisors and prepare for faculty conversations.
