details: 'The Economic and Social Council (ECOSOC) Youth Forum is the UN''s main platform for young people to share their ideas on the Sustainable Development Goals with member states. The 2026 forum met at UN Headquarters in New York from April 14 to 16 under the theme "Innovate, Unite and Transform: Youth Shaping the Road to 2030", with special sessions on financing for development, small island developing states, and youth and AI.


  WinPlus students joined the forum, following the sessions and meeting youth delegates and leaders from around the world. *WinPlus is an independent education company; participation does not imply endorsement by the United Nations.*'
