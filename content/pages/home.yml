offer:
  eyebrow: Our Programs
  title: Four programs. One plan, built around you.
  intro: Applying to high school, college or graduate school? Most applicants piece together a counselor, a research program and a summer trip from different vendors. At WinPlus every program is designed to strengthen the others, guided by one team that knows your story.
  segments:
  - title: Admissions Counseling
    text: 'From US high school to graduate school, and across the UK, Canada and Australia: a strategy shaped by mentors and alumni interviewers from top US universities.'
    outcomes:
    - A school list and story that are unmistakably yours
    - Essays developed with mentors who know your target schools
    - Interview practice with alumni interviewers
    image: /images/uploads/campus/yale-harkness.webp
    image_alt: Harkness Tower, Yale University
    link: admissions.html
    link_text: Explore admissions
  - title: Research & Internships
    text: Bespoke online research and internships led by scientists, engineers and industry leaders. Solve a real problem and build work admissions officers remember.
    outcomes:
    - Real problem-solving from day one
    - A finished paper, prototype or portfolio
    - A recommendation from a mentor who saw the work
    image: https://images.unsplash.com/photo-1630959305790-4c956ce6c0b6
    image_alt: A scientist working at a laboratory microscope
    link: research.html
    link_text: Explore programs
  - title: Campus Immersion
    text: Not a campus tour. Step inside the labs, classrooms and companies of America's leading universities, and talk with faculty and current students to find where you truly belong.
    outcomes:
    - Hands-on sessions in university labs
    - Candid conversations with faculty and students
    - A clear picture of your right-fit university
    image: /images/uploads/campus/stanford-arcade.webp
    image_alt: Main Quad arcade and Hoover Tower, Stanford University
    link: experiences/campus-immersion.html
    link_text: Explore immersion
  - title: Global Leadership Conferences
    text: Research a global issue and present it at high-profile international conferences, before diplomats, policymakers and global delegates.
    outcomes:
    - Speak before international delegates
    - A network that spans countries
    - Leadership proven on a world stage
    image: /images/uploads/campus/un-flags.webp
    image_alt: Flags of member states outside an international headquarters
    link: experiences/global-conferences.html
    link_text: Explore conferences
why:
  eyebrow: Why Us
  title: Elite guidance, never a template.
  intro: WinPlus is a boutique talent-development platform, not an application mill. We work with fewer students, more closely, for longer.
  points:
  - title: On the ground in the US
    text: Our bilingual Chinese-American and American team lives and works in the US, with first-hand insight from current students, alumni interviewers and each cycle's published admissions policies.
  - title: Mentors who have been there
    text: Professors, scientists, alumni interviewers and industry leaders work with students directly, sharing what it really takes to get in and to thrive.
  - title: A roadmap built around one student
    text: 'We get to know each student first: their strengths, interests and goals, and we respect where they want to go. Then we build a step-by-step roadmap that shows them at their best, and guide every step. No cookie-cutter templates.'
  - title: With you for the whole journey
    text: Admission is a milestone, not the finish line. We stay with students from middle school through university, graduate school and career, developing the curiosity, skills and character that last.
journey:
  eyebrow: Our Approach
  title: From first conversation to final decision
  intro: Every journey follows the same disciplined arc, and no two plans look alike.
  link_text: How we work
  link: about.html#how-we-work
  early_title: Start early. Plan with intent.
  early_text: The strongest applications are built over years, not over one summer. Talk to us as early as possible, whether that is middle school, the start of high school or a year before graduate applications, so we can plan every step ahead of time.
  early_cta: Start planning now
  early_link: contact.html
  steps:
  - title: Discover
    text: A free strategy session to understand the student's background, goals, interests and personality.
  - title: Design
    text: 'A bespoke multi-year roadmap: which activities, research and internships to pursue, and when. A dedicated mentor guides every step.'
  - title: Build
    text: 'The profile comes to life through real work: research, immersion and global stages chosen to complement each other.'
  - title: Apply
    text: School list, application strategy, essay brainstorming and editing, activity lists, recommendations and interview preparation.
  - title: Decide
    text: We help compare offers, navigate waitlists and prepare for a confident start at university.
