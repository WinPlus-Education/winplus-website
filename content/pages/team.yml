people:
- id: tarik-carney
  name: Tarik Carney
  initials: TC
  title: United Nations Professional, Peace and Security
  education: Master's degrees, Columbia SIPA and Sciences Po · BA, New York University
  photo: /images/uploads/team/tarik-carney.webp
  bio: 'Tarik Carney is a United Nations professional in peace and security, with master’s degrees from Columbia SIPA and Sciences Po. He previously studied philosophy and Japanese at NYU and Sophia University. His UN experience includes civil affairs in the Central African Republic, child protection in Uganda, civilian protection in New York and analysis of Somalia.


    Through WinPlus, he has led visits to UN Headquarters, explaining the organization’s structure, values and mission while sharing stories from peacekeeping work. Students connect institutional responsibilities with the people affected by conflict and the coordination required for international cooperation.'
  founder: false
- id: le-cong
  name: Le Cong
  initials: LC
  title: Associate Professor of Pathology and Genetics, Stanford University
  education: PhD, Harvard University · BS, Tsinghua University
  photo: /images/uploads/team/le-cong.webp
  bio: 'Le Cong is an Associate Professor of Pathology and Genetics at Stanford, with degrees from Tsinghua and Harvard. His research develops genome-engineering tools for gene and cell therapy and disease investigation. He received the National Human Genome Research Institute’s Genomic Innovator Award.


    His laboratory studies CRISPR, large gene insertion, single-cell analysis and stem-cell disease models. Projects such as CRISPR-GPT explore AI-assisted gene editing. Through WinPlus, he has led students to Stanford’s stem-cell research institute and introduced frontier research, connecting genetic changes with cellular function and disease.'
  founder: false
