faq:
  - q: 研学营和普通游学有什么不同？
    a: "在短短两周不到的时间里，我们把顶尖导师、名校与企业参访、以及来自 Meta、谷歌、硅谷创投等行业前辈的分享整合在一起。除了专业知识与职业发展指引，行业前辈会分享他们的人生与职业经历，帮助孩子理解从学科、到专业、再到职业的完整发展路径。我们同样重视软实力：为人处世、有效沟通、善待他人与包容，以及孩子的身心健康。"
