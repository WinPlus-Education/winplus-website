summary: The 19th session of the Conference of States Parties to the Convention on the Rights of Persons with Disabilities, held at UN Headquarters in New York as the Convention turned 20.
details: 'The Conference of States Parties (COSP) brings together governments, UN agencies, organizations of persons with disabilities and civil society each year to review how the Convention on the Rights of Persons with Disabilities (CRPD) is being implemented.


  COSP19 met at UN Headquarters in New York on June 9–11, 2026, preceded by a Civil Society Forum on June 8. Marking the Convention''s 20th anniversary, it ran under the theme *“CRPD at 20: celebrating and consolidating achievements and shaping the next phase of implementation in a changing world.”* The session opened in the General Assembly Hall and included roundtables on freedom from exploitation, violence and abuse; resilient societies and care and support systems; and political participation and representation, as well as elections to the CRPD Committee. At the session, China''s candidate, Professor Chang Jian, was elected to the CRPD Committee, the first Chinese member in a decade.


  WinPlus students took part after months of preparation with their mentors, and one 17-year-old student addressed the conference as its only high-school speaker. [Read the student''s story](../insights/from-the-classroom-to-the-un-floor.html).


  Official information: [UN DESA: COSP19](https://social.desa.un.org/cosp/19th-session). WinPlus is an independent education company; participation followed the conference''s own rules and does not imply endorsement by the United Nations.'
