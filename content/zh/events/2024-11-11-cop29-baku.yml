statement: 迪拜之后一年，WinPlus 学生再次走到世界气候议事桌旁。
details: 'COP29（2024 年联合国气候变化大会）在阿塞拜疆巴库举行，被称为“气候融资大会”。谈判延长两天后，各国就新的气候融资集体目标达成一致：到 2035 年每年至少向发展中国家提供 3000 亿美元，并呼吁将气候融资总规模扩大到每年 1.3 万亿美元。


  延续 COP28 迪拜代表团的经历，WinPlus 学生参加本届大会，关注气候融资谈判，并与来自世界各地的代表、研究者和青年气候领袖交流。


  *WinPlus 是独立教育机构，参与会议不代表 UNFCCC 或 COP29 主席国对 WinPlus 的认可。*'
