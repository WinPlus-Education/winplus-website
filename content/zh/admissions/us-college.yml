help:
- title: 用实力证明你的故事
  text: 我们找到学生兴趣中真正的主线，再通过科研、实习、领导力与国际经历积累证据，让申请材料描述真实成就，而不是空洞承诺。
- title: 面向顶尖名校的申请策略
  text: 均衡的选校方案与周密的早申计划（REA、ED、EA），基于对各校文化、偏好及最新标化与文书政策的一手了解。
- title: 与“内行人”打磨文书与面试
  text: 与哈佛、耶鲁、斯坦福导师多轮打磨主文书与附加文书，并由藤校校友面试官进行面试辅导。
highlight:
  label: 成功案例
  title: 耶鲁（含奖学金）、宾大与约翰霍普金斯
  text: 一位 9 年级暑假开始与 WinPlus 合作的学生，在优异学术基础上补足国际领导力与科研推荐，获得所申请藤校的全部面试，最终被耶鲁（含奖学金）、宾大和约翰霍普金斯录取。
faq:
- q: 美国本科申请规划包含哪些内容？
  a: 背景评估与多年路线图；选课、标化与暑期规划；科研、实习与领导力规划；选校与早申策略；Common App 主文书与附加文书；活动列表；推荐信规划；面试准备；以及录取选择、候补与奖学金指导。
- q: 你们提供藤校申请指导吗？
  a: 提供。藤校策略包含在美国本科项目中，包括 REA/ED/EA 策略、与哈佛、耶鲁、斯坦福导师共同打磨文书，以及藤校校友面试官面试辅导。WinPlus 学生曾被哈佛、耶鲁、普林斯顿、哥伦比亚、宾大和布朗录取。
- q: 孩子应该申请 ED 吗？
  a: ED 在部分大学能提高录取概率，但具有约束力。我们会逐校帮助家庭权衡录取优势、匹配度与经济资助。
- q: 还需要提交 SAT/ACT 成绩吗？
  a: 各校政策不同且经常调整，部分顶尖大学已恢复标化要求。我们每个申请季都会核实各校最新政策，并建议是否及何时提交。
