    在 WinPlus，她指导医学兴趣、神经科学及相关生命科学方向的本科申请，带领学生深入哈佛生命科学与医学院相关环境学习参访，曾帮助学生获得哈佛和斯坦福本科录取，将校园体验、专业探索与申请支持结合起来。'
