faq_title: 'Global experiences: your questions, answered'
faq:
- q: How is Campus Immersion different from a campus tour?
  a: 'A tour shows students buildings. Campus Immersion puts them inside labs, classrooms and companies: hands-on sessions, seminars with professors and mentors, candid conversations with current students
    and admissions sessions. Students leave knowing which universities fit them, and why.'
- q: Will the student really speak at an international conference?
  a: 'Speaking opportunities depend on each conference''s format and rules, and are never guaranteed. Every student is prepared to contribute: attending sessions and side events, engaging with delegates
    and, where the conference allows, presenting research. Our students have spoken at COSP19 at UN Headquarters and presented climate research at COP28.'
- q: Who can apply, and how are students selected?
  a: Campus Immersion is for students aged roughly 12 to 18. Global Leadership Conferences are for high school students with a genuine interest in a global issue. We select on readiness and commitment,
    not only on who applies first, and places are limited.
- q: How are students supervised and kept safe?
  a: WinPlus staff travel with every cohort and accompany students throughout the program. [Add staff-to-student ratios, safety protocols and insurance details.]
- q: What does the program fee include?
  a: Typically mentor-led coursework, accommodation, ground transport, meals and entry tickets. International flights, visas and travel insurance are usually not included; our team helps families arrange
    them. Details are confirmed for each program.
- q: How does this help a university application?
  a: 'Admissions officers look for initiative and impact, not trips. We help students turn the experience into something specific: a research question, a project, a leadership role or a perspective that
    shapes their essays and interviews.'
- q: Is WinPlus affiliated with the universities or organizations students visit?
  a: No. WinPlus is an independent education company. Visits and sessions are arranged through our mentors and partners, and conference participation follows each conference's own rules. Names describe
    where students go and do not imply endorsement of WinPlus.
