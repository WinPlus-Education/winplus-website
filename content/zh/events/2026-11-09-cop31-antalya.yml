summary: 由哈佛校友导师带队，在 2026 年联合国气候变化大会度过五天，与世界领袖、创新者和青年行动者同场交流。
statement: 在世界气候议事桌旁的五天，带着自己的思考出发。
details: 'COP31（2026 年联合国气候变化大会）在土耳其安塔利亚举行，汇聚各国元首、谈判代表、科学家与企业领袖，推动《巴黎协定》从承诺走向行动。


  WinPlus 代表团由哈佛校友导师带队，于 11 月 9 日至 13 日进入大会核心的蓝区参会。出发前，学生系统了解联合国气候进程，选定自己最关注的议题，带着自己的问题走进会场。


  COP31 延续了我们的 [COP28 迪拜代表团](cop28-dubai.html)：当时 WinPlus 学生在中国馆展示气候研究，并登上央视报道。


  *WinPlus 是独立教育机构，学生依照会议自身的注册与认证规则参与，不代表 UNFCCC 或 COP31 主席国对 WinPlus 的认可。官方信息：[cop31.tr](https://cop31.tr/)。*'
