case_eyebrow: 合作案例
case_title: 为中国人民大学附属中学打造 12 天美国研学项目
case_text: 2024 年 7 月，WinPlus 为人大附中 15 名学生及带队老师联合打造全球胜任力研学之旅：走访哈佛、MIT、耶鲁、普林斯顿、宾大等十所名校，参访麦肯锡、Meta、国际货币基金组织与 NASA，由 WinPlus 导师与人大附中校友授课。
case_image: /images/uploads/photos/amnh-2024.webp
case_link: events/us-east-coast-study-tour.html
challenges_intro: 家长期待名校录取与国际经历，而自建团队既慢、成本高，风险也大。
types_title: 合作类型
types_intro: 可从单项合作开始，也可组合为面向学生的全周期项目。
types:
- title: 升学规划合作
  text: 与校内升学老师协作，提供美、英、加、澳申请策略：选校、文书、面试与家长沟通，并有藤校校友面试官参与。
- title: 一站式夏校项目
  text: 美国顶尖大学深度研学，由 WinPlus 全程设计与运营：行程、导师、实验室与招生讲座、监护与后勤。
- title: 跨境交流
  text: 交流访问与联合项目，连接贵校学生与美国、中国、新加坡的同龄人、大学和机构。
- title: 课程拓展
  text: 导师带领的科研、实习、全球议题培训与国际会议准备，与学年课程并行开展。
value_title: 学校能获得什么
value:
- title: 新增收入，零运营负担
  text: 交付由我们负责，无需自建团队。
- title: 即刻形成差异化
  text: 竞争对手难以复制的项目，立刻成为您的优势。
- title: 提升招生与留存
  text: 名校成果是家长选择学校、也是留下来的原因。
- title: 品牌赋能
  text: 世界一流的导师与名校项目，以贵校品牌呈现。
