  text: 面试辅导；依托我们靠近新英格兰顶尖学校的地理优势规划访校；以及适应美国校园生活的指导。
highlight:
  label: 为什么重要
  title: 高中决定大学之路
  text: 合适的高中为学生打开高难度课程、科研与领导力机会的大门，也为四年后的大学申请打下坚实基础。
faq:
- q: 美国寄宿学校什么时候开始申请？
  a: 大多数学校在夏末或初秋开放申请，1 月截止，3 月发布结果，次年 9 月入学。
- q: 必须考 SSAT 吗？
  a: 许多学校要求或建议提交 SSAT 或 ISEE；国际学生通常还需提交托福、多邻国等英语成绩。我们根据各校政策规划考试。
- q: 可以协助访校吗？
  a: 可以。我们以哈佛广场为基地，帮助家庭规划新英格兰及其他地区学校的访校与面试。
