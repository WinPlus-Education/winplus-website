testimonials_title: 学员与家长说
testimonials:
- quote: 我们所到访的十所高校给了我深深的震撼。二十几位德才兼备的名校教授和校友，让我对进入名校的愿望越来越强烈。
  name: 学员
  role: 2025 名校研学
- quote: 我明白了美国大学实际上想了解我是谁、有什么独特之处、希望成为什么样的人，以及希望对世界和社会做出什么贡献。
  name: 学员
  role: 2025 名校研学
- quote: 非常感谢老师们无微不至的照顾！孩子回到家还哭了，说舍不得老师和同学们。行程紧凑丰富，孩子收获很大！
  name: 家长
  role: 2025 名校研学
- quote: 在 MIT 的 Sea Grant 实验室，教授告诉我们角落里那台机器人可以携带传感器下潜三千米。那一刻我才真正感受到 MIT 科研实力的深厚。
  name: 学员
  role: 2024 美国研学
