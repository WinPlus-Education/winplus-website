statement: A year after Dubai, WinPlus students returned to the world's climate table.
details: 'COP29, the 2024 UN Climate Change Conference, met in Baku, Azerbaijan, and became known as the ''Finance COP''. After talks ran two days past schedule, countries agreed a new collective goal for climate finance: at least $300 billion a year for developing countries by 2035, within a wider call to scale finance to $1.3 trillion a year.


  Building on our COP28 delegation in Dubai, WinPlus students joined the conference to follow the negotiations on climate finance and to meet delegates, researchers and young climate leaders from around the world.


  *WinPlus is an independent education company; participation does not imply endorsement by the UNFCCC or the COP29 Presidency.*'
