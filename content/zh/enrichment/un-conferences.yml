faq:
  - q: 学生能在联合国发言吗？
    a: "发言机会因会议而异，且无法保证。在正式分会场发言需要资格审核、文书提交与登记排队。2026 年 6 月 COSP19 大会上，一位欧歌学员最初排在第 153 位，在团队的发言稿辅导和郭琪老师的现场争取下，最终完成两分多钟的发言并被正式记录在联合国会议中。在 COP28 大会上，欧歌学员也曾向全球政府官员和专家学者介绍自己的环保项目。"
  - q: 费用是否包含交通住宿？
    a: "[请说明包含的内容：交通、住宿、带队老师等。]"
