why_eyebrow: Why WinPlus
why_title: Insight you can only get on the ground
why:
- title: A US-based team
  text: Our Chinese-American and American team works in the US, with first-hand insight each cycle from current students, alumni interviewers and published admissions policy at the Ivy
    League, liberal arts colleges and Top 100 universities.
- title: Mentors from your target schools
  text: Professors, alumni interviewers and graduates of Harvard, MIT, Yale and Stanford work with students on school lists, essays and interviews, so feedback comes from people who
    know these schools from the inside.
- title: A profile, not just an application
  text: Because WinPlus also runs research, internships, campus immersion and global conferences, we can build the experiences that make an application stand out, not just describe them.
