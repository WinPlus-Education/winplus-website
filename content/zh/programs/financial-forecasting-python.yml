overview: 学生将学习数据科学家如何为金融市场建模，并在真实的市场或公司数据上构建、检验自己的预测模型。
activities:
- 使用 Python 进行数据分析（pandas、可视化）
- 金融数据与核心市场概念
- 时间序列预测与机器学习基础
- 回测并客观评估模型
- 像分析师一样汇报研究结果
mentor: 微软总部资深数据科学家，7 年以上经验，密歇根大学博士
mentor_bio: '[导师简介占位——2–3 句话介绍背景与研究方向。]'
