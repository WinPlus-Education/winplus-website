overview: "Students research a global issue, prepare position statements and attend sessions at the United Nations as part of a WinPlus delegation. Past programs have included the UN Permanent Forum on Indigenous Issues (UNPFII) and the Conference of States Parties to the Convention on the Rights of Persons with Disabilities (COSP19)."
activities:
  - Pre-conference training on the UN system and the topic
  - Policy research and position writing
  - Attending UN sessions and side events
  - Networking with delegates, NGOs and experts
  - Reflection, presentation and follow-up project
deliverables:
  - Speaking experience at an international conference
  - A network of global leaders
  - Policy brief or reflection paper
  - Certificate of participation
  - Material for essays and interviews
highlight: "In June 2026, a 17-year-old WinPlus student was the only high-school speaker at the 19th Conference of States Parties to the CRPD (COSP19) at UN Headquarters in New York, after UN issue training and guidance from our team."
