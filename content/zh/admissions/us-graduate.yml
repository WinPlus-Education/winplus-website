help:
- title: 清晰的申请定位
  text: 我们帮助你想清楚这个学位要为你带来什么，再把过往的工作、科研或职业经历与目标项目串联成有说服力的叙事，这正是招生委员会首先看重的。
- title: 文书、简历与推荐信
  text: 目的陈述、个人经历陈述、简历与推荐人策略，由拥有哈佛、MIT、耶鲁等名校学位的导师共同打磨。
- title: 项目匹配与面试
  text: 基于师资、就业与匹配度制定选校方案，并准备教授面试与招生面试，包括 MBA 行为面试。
highlight:
  label: 成功案例
  title: 哈佛商学院、MIT 斯隆与沃顿
  text: WinPlus 导师曾指导 MBA 与硕士申请者进入哈佛商学院、MIT 斯隆商学院与沃顿商学院等项目。
faq:
- q: 你们支持哪些研究生项目？
  a: 工程、计算机、经济、公共政策、教育、生命科学与商科等领域的硕士、博士与 MBA 项目。
- q: 应该什么时候开始准备？
  a: 最好在截止日期前 9–12 个月开始。大多数美国项目截止于 12 月至 1 月，MBA 申请者通常在第一轮（9–10 月）提交。
- q: 你们指导博士研究计划吗？
  a: 指导。拥有博士学位的导师帮助完善研究陈述、寻找潜在导师并准备与教授的沟通。
