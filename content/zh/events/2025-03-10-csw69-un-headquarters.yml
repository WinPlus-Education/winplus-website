summary: WinPlus 学生参加联合国规模最大的年度性别平等会议，适逢《北京宣言》通过 30 周年。
statement: 《北京宣言》三十年后，学生走进全球最大的性别平等盛会。
details: '联合国妇女地位委员会（CSW）是联合国促进性别平等和妇女赋权的主要全球机构。第 69 届会议于 2025 年 3 月 10 日至 21 日在纽约联合国总部举行，回顾《北京宣言和行动纲领》通过三十年来的进展；会议首日，会员国通过政治宣言，重申对北京议程的承诺。


  WinPlus 学生参加本届会议，关注各方辩论，并与来自世界各地的代表、倡导者和青年领袖交流。


  *WinPlus 是独立教育机构，参与会议不代表联合国对 WinPlus 的认可。*'
