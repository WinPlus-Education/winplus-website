faq_title: 科研与实习：常见问题解答
faq:
- q: 学生最终会产出什么？
  a: 每个项目都以一项具体成果收尾：科研论文、可运行的产品原型、财务模型、政策简报或短片，视项目而定。学生在期末汇报中展示成果，它将成为活动列表、文书与面试背后的证据。
- q: 导师是谁？
  a: 在职科学家、工程师与研究员，职业经历涵盖 NASA、Meta、微软及顶尖研究型大学等机构。每个项目页面都写明导师及其背景。机构名称仅说明导师的职业经历，项目由 WinPlus 运营。
- q: 这和网课有什么不同？
  a: 网课面向所有人讲授内容。我们的项目是围绕真实问题的小班制：学生选择研究问题或产品方向，每周与导师线上直播交流，成果按专业标准评审，而不是像作业一样打分。
- q: 科研还是实习，哪个更适合？
  a: 科研适合希望回答原创问题并写成论文的学生，对理工、社科与政策方向尤其有力。实习适合希望动手打造产品、模型或原型、体验行业团队工作方式的学生。两者都有导师、每周成果与期末汇报。
- q: 一定能拿到推荐信吗？
  a: 不一定，这正是它的价值所在。导师为完成项目并表现出色的学生撰写推荐信。一封由亲眼见证成果的导师写的推荐信，分量远超一张结业证书。
- q: 需要相关基础吗？
  a: 大多数项目面向有动力的初学者，并在前几周教授所需工具。进阶项目的编程或数学要求列在项目页面的“申请条件”中。
- q: 成果可以发表或参赛吗？
  a: 当成果足够成熟时，导师与 WinPlus 顾问会推荐合适的学生期刊、会议或竞赛并协助投稿。能否发表取决于成果与渠道，我们不会事先承诺。
- q: 项目何时开课？需要投入多少时间？
  a: 大多数项目线上进行 6–8 周，主要在暑期（6–8 月），部分在春季开课。每周有直播课并需独立完成任务；各项目页面列出具体安排及是否开放申请。
