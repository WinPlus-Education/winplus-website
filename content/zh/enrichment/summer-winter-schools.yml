overview: "区别于传统观光式游学，我们的夏校与冬校由具备哈佛、MIT、斯坦福及硅谷企业背景的导师参与课程设计与授课。课程围绕「全球分析 · 文化共情 · 多元沟通 · 可持续行动」四大胜任力系统设计。"
activities:
  - 围绕四大胜任力的全球议题训练
  - NASA、哈佛、MIT 导师主讲的大学式研讨课
  - 名校参访，与招生官面对面交流
  - 企业参访与主题研学
  - 结业项目与成果展示
deliverables:
  - 《哈佛全球胜任力证书》
  - 与名校招生官面对面交流
  - 个性化《美本升学规划方案》
  - 结业项目
