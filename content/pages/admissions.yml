faq_title: 'Admissions counseling: your questions, answered'
faq:
- q: When is the right time to start?
  a: 'Earlier than most families think. For US college, the strongest profiles are built from Grade 9 or 10: course choices, research and leadership take time to become real accomplishments. For boarding school, start 12 to 18 months before the January deadline. For graduate school, start a year before deadlines to plan tests, recommenders and positioning. If you are already in Grade 11 or 12, we focus the plan on what can still move the needle: [one student started at the end of Grade 11 and earned 12 US offers and an $80,000 scholarship](insights/six-month-turnaround.html).'
- q: My child's interests aren't clear yet and their activities are scattered. What should we do?
  a: 'We start from the classes the student enjoys, the activities they keep coming back to and the questions they genuinely care about, then clarify a direction step by step through conversations, coursework and hands-on projects. Activities don''t all need to point to one major: academic exploration alongside service, the arts or sports can together show a student''s abilities, interests and values.'
- q: Should we wait for strong TOEFL or SAT scores before starting to plan?
  a: No. Testing and planning can move forward together. Tests, schoolwork, activities and application preparation all need to fit into one schedule, so we set priorities around the student's academic workload and application stage and leave time for each.
- q: What does a typical year with WinPlus look like?
  a: After a free strategy session, your mentor builds a multi-year roadmap and meets with the student regularly to adjust it each term. Research, internships and global programs are scheduled around school. In the application year the focus shifts to the school list, early-round strategy, essays and interviews, with deadlines tracked on one shared timeline.
- q: Do you only work with students aiming for the Ivy League?
  a: 'No. Many of our students target the Ivy League and US Top 30, but our goal is the right fit: a list that balances reach, target and likely schools, including liberal arts colleges, and the UK, Canada and Australia where they suit the student.'
- q: Do you write essays for students?
  a: Never. Students write their own essays. We help them find the story worth telling, then push the drafts through many rounds of questions and feedback. Admissions officers read thousands of essays; authenticity is the only strategy that works.
- q: How do you help a student find the topic for their personal statement?
  a: 'Through several rounds of interviews before anyone writes a word: which experiences shaped the student most, and which reflections best show their real values. Often the strongest topic is a small, everyday thing the student keeps returning to, told so it reveals something larger. Our lead essay mentor, a former Yale undergraduate admissions interviewer, then works with the student over many drafts on structure, rhythm and how the essay, intended major and activity list tell one consistent story.'
- q: Can a student apply to the US and the UK at the same time?
  a: 'Yes, and many of ours do. The systems reward different things: the US reads the whole person across 10 to 20 applications, while the UK allows five UCAS choices and judges subject depth through one personal statement, tests and interviews. We plan one profile that serves both and a timeline that never forces a trade-off.'
- q: Do you guarantee admission?
  a: No. No ethical counselor can. We commit to a rigorous strategy, expert feedback and a student who presents their strongest, most authentic self. Individual results vary.
- q: We live outside the US. How does it work?
  a: Most of our families are in mainland China, Hong Kong, Singapore and the US. Sessions run online and are scheduled across time zones, with in-person meetings in Boston and Beijing and during our campus immersions.
- q: How much does it cost?
  a: Programs are tailored to the student's grade, goals and the level of support needed, so we share pricing after the free strategy session. [Add pricing guidance if desired.]
