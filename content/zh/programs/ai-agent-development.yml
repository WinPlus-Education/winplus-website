meta_description: 六周内在 Meta AI 背景导师指导下，搭建并评估一个可运行的 AI 智能体。面向有一定编程基础的高中生的线上实习。
summary: 从第一次 API 调用到经过测试、能使用工具的智能助手，在拥有 Meta AI 团队背景的工程师指导下，亲手打造一个可运行的 AI 智能体。
image: https://images.unsplash.com/photo-1653387300291-bfa1eeb90e16
image_alt: 电脑屏幕上的 AI 应用代码
format: 线上 · 导师直播课
length: 6 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: 'AI 智能体能够自主规划、调用工具并完成任务，正在重塑每一个行业。在这个实习项目中，学生将亲手打造一个真正可用的智能体：学习助手、研究助手或数据清洗工具。


  学生从大模型 API 调用与提示词实验起步，逐步搭建“观察—规划—执行—停止”的循环。同样重要的是，他们将学习如何让智能体安全可靠：沙箱边界、命令白名单、超时机制与 API 密钥管理。'
outcomes:
- 可运行的智能体代码与现场演示
- 5–10 项测试任务的评估结果与执行日志
- 说明智能体原理与局限的反思报告
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 基础
  text: 大模型原理；API 调用、提示词与结构化输出。
- phase: 第 3–4 周
  title: 智能体循环
  text: 观察、规划、执行、停止；连接工具、定义输入输出、记录每次调用。
- phase: 第 5 周
  title: 安全与可靠性
  text: 沙箱、白名单、文件权限、超时与密钥管理。
- phase: 第 6 周
  title: 评估与展示
  text: 运行评估任务、分析执行轨迹、修复弱点并展示成果。
eligibility:
- 9–12 年级
- 具备初级到中级编程基础（建议 Python）
- 笔记本电脑与稳定网络
