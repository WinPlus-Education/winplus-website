# Netlify reads this file automatically.
[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "_site"

[build.environment]
  PYTHON_VERSION = "3.11"

# Old page addresses → new ones (keeps old links and Google results working). Chinese pages (/zh/...) follow the same pattern.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/zh/about"
  to = "/zh/about.html"
  status = 301
[[redirects]]
  from = "/programs.html"
  to = "/research.html"
  status = 301
[[redirects]]
  from = "/zh/programs.html"
  to = "/zh/research.html"
  status = 301
[[redirects]]
  from = "/programs"
  to = "/research.html"
  status = 301
[[redirects]]
  from = "/zh/programs"
  to = "/zh/research.html"
  status = 301
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
[[redirects]]
  from = "/how-it-works.html"
  to = "/about.html#how-we-work"
  status = 301
[[redirects]]
  from = "/zh/how-it-works.html"
  to = "/zh/about.html#how-we-work"
  status = 301
[[redirects]]
  from = "/admissions/ivy-league.html"
