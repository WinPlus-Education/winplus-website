overview: 智能设备融合了硬件、云计算与人工智能。学生将全面了解物联网（IoT）系统的工作原理，并打造一个能采集数据并做出智能响应的原型。
activities:
- 了解物联网架构：设备、网络与云端
- 使用传感器与微控制器
- 将设备数据上传至云端并进行分析
- 加入预测或异常检测等 AI 功能
- 在结业展示会上演示原型
mentor: 亚马逊云计算工程师，10 年以上经验（AWS）
mentor_bio: '[导师简介占位——2–3 句话介绍背景与研究方向。]'
mentor_photo: ''
deliverables:
- 可运行的物联网原型及技术文档
- 导师亲笔推荐信（符合条件的学生）
- 实习科研证书
- 结业成果展示
prerequisites: 无需硬件基础。[请确认是否寄送硬件套件。]
