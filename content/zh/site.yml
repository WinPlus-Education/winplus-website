  age_question: "我是"
  age_under: "感谢您的关注。请由您的父母或监护人代为填写此表格。"
  age_teen: "请在父母或监护人的陪同下填写此表格。"
  prc_transfer: "我同意 WinPlus 在中国大陆境外（美国）处理我提供的个人信息，并向隐私政策所列的境外接收方提供该等信息，用于隐私政策所述目的。我可通过 [填写隐私联系邮箱] 联系 WinPlus 行使我的权利。"
  prc_child: "我是本表格所述儿童的父母或法定监护人。我单独同意 WinPlus 为回复咨询、报名及提供项目之目的，处理我孩子的个人信息（根据中国法律属于敏感个人信息）。我理解此处理为孩子参加 WinPlus 项目所必需，WinPlus 将按照隐私政策第 7 条保护该等信息。"
  event_photo: "WinPlus 将在本次活动中拍照及录像。照片和视频可能发布于 WinPlus 网站、社交媒体、通讯及宣传资料，详见我们的隐私政策。我同意 WinPlus 将包含我（及我的孩子）的照片和视频用于上述目的。"
