outcomes:
- title: Research tested in public
  text: Students defended their work in conversation with delegates, scholars and journalists from around the world.
- title: Confidence on a global stage
  text: From a pavilion podium to a television camera, students learned to speak clearly about complex issues.
- title: A wider view of the world
  text: Meeting people across cultures, faiths and disciplines changed how students see the region and climate cooperation.
- title: A direction for the future
  text: Students left with clearer academic interests, from urban planning and transport to climate policy and law.
