status: open
mentor_note: Cannes award-winning short-film director; MFA in Screenwriting, Northwestern University
seo_title: Screenwriting & Directing Program for Teens | WinPlus
meta_description: Write, shoot and edit an original short film with a Cannes award-winning director trained in Northwestern University's screenwriting program.
summary: Write, shoot and edit an original short film, guided by a Cannes award-winning director trained in Northwestern's screenwriting program.
image: https://images.unsplash.com/photo-1515634928627-2a4e0dae3ddf
image_alt: A film clapperboard on set
format: Online · live mentor sessions
length: 6–8 weeks
dates: Summer 2027 · dates to be confirmed
cohort: Small group
overview: 'Students develop their voice as storytellers through the foundations of screenwriting and directing taught in leading film programs. They take an original idea all the way to a finished short
  film: screenplay, shot planning, directing, editing and post-production.


  The result is portfolio-ready work for arts and film applications, along with the experience of seeing a creative vision through from first draft to final cut.'
outcomes:
- An original screenplay
- A finished short film for an arts portfolio
- A screening and critique with the mentor
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: Story
  text: Story development and screenplay structure.
- phase: Weeks 3–4
  title: Screenplay
  text: Write and revise an original short screenplay.
- phase: Weeks 5–6
  title: Production
  text: Shot planning, directing actors and production basics.
- phase: Weeks 7–8
  title: Post & screening
  text: Editing, post-production and a final screening.
eligibility:
- Grades 9–12
- No prior film experience required
- Access to a smartphone or camera for filming
