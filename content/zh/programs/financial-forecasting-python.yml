meta_description: 用 Python、ARIMA 与 ETS 模型预测微软季度营收，由拥有微软与谷歌经验的数据科学家指导。
summary: 用 Python 和真实财务数据预测一家世界 500 强公司的季度营收，由拥有微软与谷歌经验的数据科学家指导。
image: https://images.unsplash.com/photo-1689732888407-310424e3a372
image_alt: 深色屏幕上的股票 K 线图
format: 线上 · 8 次导师会议
length: 8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: '企业如何预测未来？学生将承担真实分析师的任务：基于公开财务数据预测微软的季度营收，学习每一次预测背后的统计方法与判断力。


  学生将清洗数据、探索趋势与季节性，并用 Python 比较 ARIMA 与 ETS 模型；随后分析营收驱动因素及其与股价的关系，学会区分相关性与因果性。'
outcomes:
- 带注释的 Python 分析笔记
- 预测与实际对比图及误差分析（MAE、RMSE、MAPE）
- 分析报告与成果展示
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 数据与趋势
  text: 清洗公开财务数据；趋势、季节性、滞后与移动平均。
- phase: 第 3–5 周
  title: 预测模型
  text: Python 中的 ARIMA 与 ETS；训练集与测试集；误差衡量。
- phase: 第 6–7 周
  title: 驱动因素与市场
  text: 营收驱动因素与股价关系；相关与因果。
- phase: 第 8 周
  title: 报告与展示
  text: 完成分析报告并展示预测成果。
eligibility:
- 10–12 年级
- 熟悉代数；有 Python 基础更佳但非必需
- 对数学、金融、经济或商业分析感兴趣
