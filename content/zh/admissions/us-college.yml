faq:
  - q: 什么时候开始美国本科申请规划比较好？
    a: 9 年级或 10 年级最为理想，便于规划课程、活动与科研。很多家庭在 11 年级开始，我们也为 12 年级学生提供支持。
  - q: 孩子应该申请 ED 吗？
    a: ED 在部分学校能提高录取机会，但具有约束力。我们会帮助家庭权衡录取优势、助学金与学校匹配度。
  - q: 现在还需要 SAT 或 ACT 成绩吗？
    a: 各校政策不同且经常变化。我们会核查每所学校的最新要求，并建议是否提交成绩。
