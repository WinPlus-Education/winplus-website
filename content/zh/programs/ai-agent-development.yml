overview: AI 智能体是软件领域发展最快的方向之一。在这个实习式项目中，学生将学习现代 AI 智能体的设计与构建方法，并从创意到可运行演示，开发属于自己的智能体工具。
activities:
- 了解大语言模型、提示词与工具调用的工作原理
- 为自己关心的真实问题设计智能体
- 使用 Python 构建并测试智能体
- 评估性能、安全性与局限
- 在结业展示会上进行现场演示
mentor: Meta Llama 团队软件工程负责人及 AI 平台开发负责人
mentor_bio: '[导师简介占位——2–3 句话介绍背景与研究方向。]'
mentor_photo: ''
deliverables:
- 可运行的 AI 智能体项目，附源代码与演示视频
- 导师亲笔推荐信（符合条件的学生）
- 实习科研证书
- 结业成果展示
prerequisites: 有 Python 基础更好，但非必需；项目提供预备课程。
