features_title: What makes it different
features:
- title: Inside the lab, not outside the gate
  text: Students visit research labs such as the MIT Media Lab, aerospace and engineering labs, and Stanford's stem-cell research institute, where researchers explain their work and students take on hands-on challenges.
- title: Taught by the people who teach there
  text: Seminars with WinPlus mentors and guests from Harvard, MIT, Yale and Stanford, including a former NASA astronaut and MIT professor, on leadership, international relations, AI, gene editing and space engineering.
- title: The real student experience
  text: Meals in university dining halls, conversations with current students and alumni, and time to experience each campus's culture, pace and community first-hand. Students leave with a clear sense of which universities, and which cultures, fit them, and with friendships across schools and backgrounds.
- title: Admissions, demystified
  text: Admissions sessions at leading universities, and a personalised US undergraduate admissions plan for every student, prepared by WinPlus mentors. Every moment becomes first-hand material for essays and interviews.
- title: Where ideas become industries
  text: Visits to technology companies and organisations such as Meta, Apple and Google offices, NASA, the United Nations Headquarters and a Hollywood production company.
- title: Global competency, certified
  text: Coursework built on four global competencies (global analysis, cultural empathy, diverse communication and sustainable action), with a WinPlus Global Competency Certificate on completion.
outcomes:
- A clear sense of which universities, and which university cultures, fit them
- A personalised US undergraduate admissions plan
- A WinPlus Global Competency Certificate
- Friendships with peers from different schools and backgrounds
- First-hand experiences that become powerful essay and interview material
