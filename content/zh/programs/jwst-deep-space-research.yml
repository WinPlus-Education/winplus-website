order: 8
title: 太空望远镜任务设计
industry: science-space
type: research
status: open
mentor_id: rachel-morgan
mentor_note: NASA 艾姆斯研究中心光学科学家；MIT 博士
seo_title: 高中生太空望远镜科研项目 | WinPlus 欧歌学院
meta_description: 八周内在 NASA 艾姆斯研究中心光学科学家（MIT 博士）指导下，设计一项太空望远镜任务：光学、机械与科学目标。
summary: 从科学目标到光学与机械设计，设计属于你的太空望远镜任务，由 NASA 艾姆斯研究中心的光学科学家指导。
image: https://images.unsplash.com/photo-1462332420958-a05d1e002413
image_alt: 深空中绚丽的星云
format: 线上 · 8 次导师会议
length: 8 周
dates: 2027 年暑期 · 具体日期待定
cohort: 小班
overview: '从哈勃到詹姆斯·韦布太空望远镜，每一台伟大的望远镜都始于一个关于宇宙的问题。学生将选定科学目标、为任务命名，并设计能够回答这一问题的望远镜，权衡 NASA 工程师同样面对的取舍：口径、视场、探测器、轨道与稳定性。


  学生分别担任任务科学家、光学工程师或机械工程师，完成光线追迹仿真与 CAD 或实体模型，并像真正的任务团队一样进行设计评审。'
outcomes:
- 技术性任务设计报告
- 光学光线追迹仿真与机械 CAD 或实体模型
- 面向导师的设计评审展示
- 表现优秀者可获导师推荐信
curriculum:
- phase: 第 1–2 周
  title: 科学动机
  text: 近期太空望远镜任务；确定科学目标与任务需求。
- phase: 第 3 周
  title: 初步设计
  text: 关键参数（口径、类型、探测器、轨道）及支撑计算。
- phase: 第 4–5 周
  title: 光学与机械模型
  text: 光线追迹仿真、像差与稳定性；CAD 或实体模型。
- phase: 第 6–8 周
  title: 设计评审
  text: 完善设计、讲述任务并展示最终作品集。
eligibility:
- 9–12 年级
- 对物理、天文或工程有浓厚兴趣
- 具备代数与三角函数基础；无需 CAD 经验
