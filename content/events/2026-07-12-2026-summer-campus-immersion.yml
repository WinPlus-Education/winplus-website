summary: 'Twelve days, ten universities and 35 organizations: a 50-hour global competency program taught by 18 mentors from Harvard, MIT, Yale and Silicon Valley.'
details: 'Built on courses at Harvard and MIT, the program is a 50-hour global competency curriculum developed by mentors from Harvard, Yale and MIT and taught in English at Harvard, MIT and Princeton. It is organized around four competencies: global analysis, cultural empathy, cross-cultural communication and sustainable action.


  Eighteen mentors, including professors from Harvard and MIT and executives from leading technology companies, taught sessions on AI, fintech, aerospace engineering, international trade and leadership. Led by Harvard mentors and admissions officers, students visited ten universities, including Harvard, MIT, Yale and Princeton, and 35 organizations, from university labs and technology companies to international organizations and cultural landmarks.


  Admissions officers, current students and alumni walked students through how US admissions work. Every student finished the program with a Global Competency Certificate and a personalized US college admissions plan.'
