faq_title: 'Research & internships: common questions'
faq:
- q: Who are the mentors in WinPlus research programs?
  a: Our mentors are working scientists, engineers and researchers with backgrounds at organizations such as NASA, Meta, Microsoft, Apple, Bloomberg, Caltech, MIT and Harvard. Each program
    page lists its mentor's background. Company and university names describe mentors' professional backgrounds; programs are run by WinPlus.
- q: Are the programs online?
  a: Yes. Research and internship programs run online with live mentor sessions, so students can join from anywhere. Sessions are scheduled across US and Asian time zones.
- q: Does my child need prior experience?
  a: Most programs are designed for motivated beginners. Some advanced tracks expect basic coding or mathematics, which is listed under Eligibility on each program page.
- q: What's the difference between a research program and an internship?
  a: Research programs centre on an original question and end in a paper or report. Internships centre on building something, such as a product, model or prototype, the way an industry
    team would. Both include a mentor, weekly deliverables and a final presentation.
- q: Will my child receive a recommendation letter?
  a: Mentors write letters for students who complete the program and demonstrate strong work. Letters are earned, not automatic, which is what gives them weight with admissions officers.
- q: Can students publish their research?
  a: Some projects are suitable for student journals, conferences or competitions. Mentors and WinPlus advisors recommend the right outlet when a project is ready.
- q: How long are the programs and when do they run?
  a: Most programs run for 6–8 weeks, with the main cohorts in summer (June–August) and selected programs starting in spring. Each program page shows whether applications are open.
- q: How do I choose the right program?
  a: Book a free strategy session. We'll recommend programs that fit the student's interests, grade and application plan.
