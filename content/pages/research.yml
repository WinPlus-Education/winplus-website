summary_eyebrow: Why it matters
summary_statement: The strongest applicants don't just say they're curious. They show what their curiosity has produced.
summary_text: 'Selective universities look for evidence: a question pursued, a problem solved, a mentor who can vouch for the work. WinPlus programs give students first-hand experience
  of real-world problem-solving, a finished paper, prototype or portfolio, and a recommendation from an expert who watched them work.'
how_eyebrow: How We Work
how_title: Built around the questions shaping the future
how_intro: Every program is designed by WinPlus with its mentor, around the fields that will define the next decade of education and industry.
how:
- title: Designed around frontier fields
  text: 'We build programs where the world is moving fastest: artificial intelligence, space, biotechnology, finance and global policy. We update them each year as the fields evolve,
    so students learn what universities and employers will value next.'
- title: Led by practitioners, in small groups
  text: Mentors are working scientists, engineers and researchers at organizations such as NASA, Meta, Microsoft and Caltech. Small cohorts mean every student is known, challenged and
    guided personally.
- title: Learn, then build
  text: Each program moves from learning weeks (concepts, tools and methods) to output weeks, when students apply them to their own project, with a concrete deliverable every week and
    a project manager tracking progress.
- title: Connected to the application
  text: Your WinPlus mentor helps choose the program that fits the student's roadmap, then turns the experience into activity descriptions, essays and interview stories.
deliverables_title: What every student leaves with
deliverables:
- title: A finished piece of work
  text: A research paper, working prototype, financial model, policy brief or short film, depending on the program.
- title: A mentor recommendation
  text: Students who complete the program to a high standard can earn a letter from a mentor who saw their work first-hand. Letters are earned, not automatic.
- title: A portfolio & presentation
  text: A final showcase presentation and a polished portfolio piece.
- title: Publication & competition guidance
  text: Where appropriate, guidance on submitting work to journals, conferences or competitions.
