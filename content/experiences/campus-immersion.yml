title: Campus Immersion
short_title: Campus Immersion
seo_title: Harvard, MIT, Yale & Stanford Summer Immersion | WinPlus
meta_description: 'A 12-day summer immersion at Harvard, MIT, Yale, Stanford and Silicon Valley: labs, professor seminars, admissions sessions and a personal plan.'
eyebrow: Campus Immersion
summary: Not a campus tour. Twelve days inside the labs, classrooms and companies of Harvard, MIT, Yale, Stanford and Silicon Valley, discovering what these places are really like and where you belong.
image: /images/uploads/campus/stanford-arcade.webp
image_alt: Main Quad arcade and Hoover Tower, Stanford University
kicker: Beyond the campus tour
card_text: Labs, seminars with professors and candid conversations with students at Harvard, MIT, Yale and Stanford.
statement: You can't choose the right university from a brochure. You have to step inside.
statement_text: Campus Immersion takes students beyond the visitor route. They take part in lab and team sessions, learn from professors and mentors in their classrooms, talk with current students about
  real campus life, and hear directly from admissions teams. Guided by WinPlus mentors throughout, students come home with a clear sense of which university culture fits them, and a personal plan to get
  there.
