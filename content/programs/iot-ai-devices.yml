overview: 'Smart devices bring together hardware, software and the cloud. In this internship students learn how the Internet of Things works end to end, then design and build their own AI-powered device
  that collects data, sends it to the cloud and responds intelligently.


  Along the way they experience the full product life cycle used by professional engineering teams, from requirements and hardware assembly to software, cloud deployment and a final demo.'
outcomes:
- A working IoT prototype with technical documentation
- Hands-on experience across hardware, software and cloud
- A final showcase presentation
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: How IoT works
  text: Devices, networks and the cloud; sensors and microcontrollers.
- phase: Weeks 3–4
  title: Build the device
  text: Hardware assembly and device software.
- phase: Weeks 5–6
  title: Connect to the cloud
  text: Send device data to cloud services and analyse it.
- phase: Weeks 7–8
  title: Add intelligence & demo
  text: An AI feature such as prediction or anomaly detection, then a final showcase.
eligibility:
- Grades 9–12
- No hardware experience required
- A laptop and reliable internet connection; hardware kit details confirmed on enrollment
