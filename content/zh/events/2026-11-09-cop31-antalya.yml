highlights_title: 核心体验
highlights:
- title: COP31 开幕
  text: 亲临安塔利亚，见证世界领袖开启 2026 年联合国气候变化大会，为全球气候行动定下议程。
- title: 可持续创新论坛
  text: 在气候行动创新专区，聆听创业者、投资人与政策制定者探讨清洁能源、气候融资与绿色科技。
- title: “全球影响力 100 人”论坛
  text: 由全球企业社会责任基金会与《欧洲人杂志》合作举办，学生争取以英文发言，分享对气候与可持续发展的见解。
- title: 青年领导力专题
  text: 参加青年领导力、人工智能与气候、儿童权利等主题边会，现场提问，结识来自世界各地的发言人。
arc:
- label: 11月9日
  title: 食品、农业与健康
  text: 大会开幕全体会议，了解气候变化如何影响粮食安全与公共健康。
- label: 11月10日
  title: 能源与交通
  text: 可持续创新论坛，理解清洁能源转型背后的经济逻辑。
- label: 11月11日
  title: 零废弃
  text: 循环经济、食物浪费，以及推动减排的商业模式。
- label: 11月12日
  title: 韧性城市
  text: 智慧规划、绿色建筑，以及城市如何公平地应对气候风险。
- label: 11月13日
  title: 气候融资与贸易
  text: 气候融资与碳市场，随后是代表团的总结复盘。
outcomes:
- title: 全球人脉
  text: 与各国代表、研究者和青年领袖深入交流，并在会后持续跟进。
- title: 世界舞台上的声音
  text: 用英文提问、表达观点；入选学生有机会在国际论坛上发言。
- title: 有分量的写作成果
  text: 在导师指导下完成反思文章与政策简报，可用于申请、校内分享与发表。
- title: 可延续的项目方向
  text: 基于现场所见所学，明确后续研究或校园倡议的方向。
