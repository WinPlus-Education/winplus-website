faq:
- q: When are UCAS deadlines?
  a: Applications to Oxford, Cambridge and most medicine courses are due in mid-October of the final year; most other courses are due in late January.
- q: Can students apply to both the US and the UK?
  a: Yes, and many of our students do. Because the two systems reward different things, we plan the profile and timeline so each application is strong.
- q: Do you help with UK master's applications?
  a: Yes, including course selection, personal statements, references and, for research degrees, proposals.
