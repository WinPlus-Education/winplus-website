eyebrow: 常见问题
title: 常见问题
intro: 家长最常问的问题都在这里。没有找到答案？欢迎与 WinPlus 导师聊聊。
general_title: 关于 WinPlus
general:
- q: WinPlus 是什么？
  a: WinPlus Education and Technology Inc.（WinPlus 欧歌学院）是一家精品国际教育咨询与人才发展平台，由哈佛肯尼迪学院校友于 2020 年在哈佛广场创立，团队分布于波士顿与北京。我们将美国高中至研究生的升学规划，与导师带领的科研实习、名校深度研学和全球领导力会议结合在一起。
- q: WinPlus 有什么不同？
  a: 大多数顾问修改申请材料，我们打造材料背后的内容：自主运营的科研、实习、研学与国际会议项目，由顶尖大学与企业的导师带领，由一个了解学生的团队统筹在同一份规划中。而且我们的团队生活在美国，洞察来自一线，每个申请季都在更新。
- q: 你们服务哪些人？
  a: 从初中到研究生阶段的学生及其家庭，分布在美国、中国大陆、香港、新加坡等地。我们也与私立学校合作，为其学生提供升学规划与国际项目。
- q: 欧歌学院提供哪些服务？适合什么年龄或年级的学生？
  a: '我们的服务覆盖小学、初中、高中及大学阶段：


    - **小学、初中：**以海外研学为主，帮助孩子拓展视野、探索兴趣；初中生也可以参加国际会议项目。

    - **高中：**提供本科申请规划与指导，以及夏校、科研、行业实践和国际会议等学习机会的匹配与支持。

    - **大学：**提供研究生申请指导，包括方向与选校、文书、简历、推荐信及面试准备。


    具体项目的年龄和年级要求，欢迎联系我们，结合学生情况进一步确认。'
- q: 导师有哪些人？
  a: 大学教授、前 NASA 宇航员、NASA 科学家、校友面试官，以及来自领先科技与金融企业的工程师和研究员。详见[我们的团队](team.html)。
- q: 你们服务美国以外的家庭吗？
  a: 服务。大多数辅导以线上方式跨时区进行，并可在波士顿、北京以及我们在美国的项目期间面对面交流。
- q: WinPlus 保证录取吗？
  a: 不保证。任何有职业操守的顾问都无法保证录取。个人结果因人而异，过往成果不代表未来结果。
- q: 如何开始？
  a: 预约免费规划咨询。我们会了解学生的目标与现状，给出清晰的下一步建议，无需任何承诺。
