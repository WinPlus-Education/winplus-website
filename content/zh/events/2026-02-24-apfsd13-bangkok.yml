summary: 在联合国亚太可持续发展目标区域论坛上，一位 WinPlus 学生就青年女性健康议题发言，其敦煌主题艺术作品在论坛展出。
statement: 在亚太地区最重要的 2030 议程论坛上，一位学生为青年女性健康发声。
details: '亚太可持续发展论坛（APFSD）由联合国亚洲及太平洋经济社会委员会（ESCAP）每年召开，是本地区审议 2030 年可持续发展议程进展的主要平台。


  第 13 届论坛于 2026 年 2 月 24 日至 27 日在曼谷联合国会议中心举行，主题为以变革性、公平的行动推进 2030 年议程。论坛审议了可持续发展目标 6、7、9、11 和 17（清洁饮水、清洁能源、产业与创新、可持续城市、伙伴关系），指出本地区尚未走上实现 2030 年目标的轨道，并将总结提交纽约联合国可持续发展高级别政治论坛。


  一位 WinPlus 学生入选并就青年女性健康议题发言，其敦煌主题艺术作品也在论坛展出。


  *官方信息：[UN ESCAP：APFSD13](https://www.unescap.org/events/apfsd13)。WinPlus 是独立教育机构，参与论坛不代表联合国对 WinPlus 的认可。*'
