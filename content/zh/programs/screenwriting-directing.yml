overview: 学生将发展自己的叙事风格，学习专业电影创作中的编剧与导演技巧，并制作一部原创短片作为作品集。
activities:
- 故事构思与剧本结构
- 撰写并修改原创短片剧本
- 分镜设计、演员指导与制片基础
- 剪辑与后期制作
- 在结业展示会上放映并接受点评
mentor: 西北大学编剧艺术硕士，戛纳短片奖得主
mentor_bio: '[导师简介占位——2–3 句话介绍背景与研究方向。]'
mentor_photo: ''
deliverables:
- 原创剧本与短片，可用于艺术作品集
- 导师亲笔推荐信（符合条件的学生）
- 实习科研证书
- 结业成果展示
prerequisites: 无需经验，用手机即可开始拍摄。
faq:
- q: 这个项目是线上进行吗？
  a: 是的，项目以线上形式进行并有导师实时授课，学生可在任何地方参加。
- q: 如何申请？
  a: 点击下方「申请」或预约免费规划咨询。名额有限，按申请顺序录取。
