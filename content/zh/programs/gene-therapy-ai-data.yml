overview: 基因治疗研究会产生大量复杂数据。学生将学习基因治疗背后的科学原理，并使用计算工具分析真实或公开的研究数据。
activities:
- 遗传学与基因治疗基础
- 阅读和理解科研论文
- 使用 Python 分析生物数据
- 提出并验证研究问题
- 撰写科研论文并汇报成果
