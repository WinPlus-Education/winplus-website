facts_source: 参会人数来自 UNFCCC 最终统计，据 Carbon Brief 报道。
highlights_title: 项目内容
highlights:
- title: 中国角发言
  image: /images/uploads/photos/cop28-china-pavilion-speech.webp
  text: 在中华环保联合会主办的蓝区中国角边会上，学生以“应对气候变化的校园思考与实践”为题发言；中国气候变化特使解振华到场致辞。
- title: 世界舞台上的研究
  image: /images/uploads/photos/cop28-posters.webp
  text: 连续两天在中国馆前展示科研海报，与各国代表、学者和青年领袖探讨研究成果。
- title: 登上央视报道
  image: /images/uploads/photos/cop28-cctv.webp
  text: 央视财经频道《经济信息联播》报道了学生的研究展示，COP28 官方媒体平台也予以关注。
- title: 与领袖对话
  image: /images/uploads/photos/cop28-al-nuaimi.webp
  text: 代表团受到阿联酋联邦国民议会国防、内政和外交事务委员会主席 Ali Rashid Al Nuaimi 博士接见，并参加哈佛大学校友会迪拜晚宴。
- title: 名校学术研讨
  image: /images/uploads/photos/cop28-nyuad.webp
  text: 在纽约大学阿布扎比分校聆听气候立法讲座，并与沙迦大学、沙迦美国大学开展学术交流。
- title: 创新与文化
  image: /images/uploads/photos/cop28-grand-mosque.webp
  text: 从阿联酋航天局展区到谢赫扎耶德大清真寺，感受这片快速发展的土地如何思考可持续发展。
arc:
- label: 会前
  title: 准备
  text: 数月导师指导，学习气候科学与政策，每位学生完成一项原创研究。
- label: 12月4日
  title: 发言
  text: 学生在蓝区中国角边会上发言。
- label: 12月9日
  title: 展示
  text: 中国馆前的科研海报吸引各国代表、学者与央视关注。
- label: 全程
  title: 交流
  text: 阿布扎比与沙迦的大学研讨、与阿联酋领袖会面，以及哈佛校友晚宴。
outcomes:
- title: 研究经受公开检验
  text: 学生与各国代表、学者和记者面对面讨论，为自己的研究答辩。
- title: 国际舞台上的自信
  text: 从展馆讲台到电视镜头，学会清晰地表达复杂议题。
- title: 更开阔的世界观
  text: 与不同文化、信仰和领域的人交流，重新认识这一地区与全球气候合作。
- title: 更清晰的未来方向
  text: 学生带着更明确的学术兴趣归来，从城市规划与交通到气候政策与法律。
