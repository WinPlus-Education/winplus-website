  label: Why it matters
  title: High school shapes the college path
  text: The right high school opens doors to rigorous courses, research and leadership, the foundation of a strong college application four years later.
faq:
- q: When do US boarding school applications open?
  a: Most applications open in late summer or early autumn and are due in January, with decisions in March for entry the following September.
- q: Is the SSAT required?
  a: Many schools require or recommend the SSAT or ISEE; international students usually also submit TOEFL, Duolingo or similar. We plan tests around each school's policy.
- q: Can you help with campus visits?
  a: Yes. From our base in Harvard Square we help families plan visits and interviews at schools across New England and beyond.
