faq:
  - q: Do students speak at the UN?
    a: "Opportunities vary by meeting and are never guaranteed. Speaking in a formal session requires accreditation review, document submission and a place on the speakers' list. At COSP19 in June 2026, a WinPlus student started 153rd in the queue; with statement coaching from our team and on-site advocacy by co-founder Cathy Guo, he delivered a two-minute statement that was entered into the UN record. At COP28, a WinPlus student presented his environmental project to government officials and experts."
