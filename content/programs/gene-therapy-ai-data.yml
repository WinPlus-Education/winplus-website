format: Online · live mentor sessions
length: 8 weeks
dates: Summer 2027 · dates to be confirmed
cohort: Small group
overview: 'Gene therapy is one of the most promising frontiers in medicine, and much of the progress now depends on data. Students learn how gene editing and delivery work, including AAV capsids, the blood–brain
  barrier, receptor recognition and directed evolution, through the research papers scientists read.


  Then they do the work: using Python to analyse sequencing data from real AAV selection experiments, counting variants, calculating enrichment and visualising results, while learning why lab findings need
  further validation before they reach patients.'
outcomes:
- A Discovery Report explaining methods, findings and interpretation
- Python analysis of real experimental data
- Optional literature review
- Mentor recommendation letter for students who excel
curriculum:
- phase: Weeks 1–2
  title: The science
  text: Gene editing, delivery and AAV vectors.
- phase: Weeks 3–4
  title: Reading research
  text: Key papers and the limits of translating animal findings to humans.
- phase: Weeks 5–7
  title: Data analysis
  text: 'Python analysis of real AAV sequencing data: variants, enrichment, visualisation.'
- phase: Week 8
  title: Discovery Report
  text: Write up and present methods, findings and interpretation.
eligibility:
- Grades 10–12
- High school biology; chemistry helpful
- No prior Python required
mentor_note: Postdoctoral fellow, Caltech; PhD, Cornell
