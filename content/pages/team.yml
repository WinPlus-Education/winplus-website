seo_title: Our Team | Harvard, MIT & Stanford Mentors and Advisors | WinPlus
meta_description: 'Meet WinPlus founders, advisors and mentors: MIT and Harvard professors, a former NASA astronaut, NASA scientists and Ivy League alumni interviewers.'
eyebrow: Our Team
title: The mentors behind every WinPlus student
intro: Professors, scientists, alumni interviewers and industry leaders from the world's top universities and companies, working directly with our students.
image: /images/uploads/photos/hbs-classroom.webp
image_alt: WinPlus mentors with students on a university campus
groups:
- id: founders
  title: Founders
  intro: WinPlus was founded in Harvard Square in 2020 by two Harvard Kennedy School graduates.
  people:
  - id: cathy-guo
    name: Cathy Guo
    initials: CG
    title: Co-Founder & Executive President
    affiliation: Master in Public Policy, Harvard Kennedy School
    photo: /images/uploads/team/cathy-guo.jpg
    bio: 'Cathy Guo co-founded WinPlus in 2020 in Harvard Square. She holds a Master in Public Policy from Harvard Kennedy School and dual bachelor''s degrees in economics and media
      from Rutgers University.


      She serves on the board of the Harvard Kennedy School Alumni Association and of Douglass Residential College at Rutgers, and has worked with UN Women and Oxford Economics. She
      has championed international education and philanthropy across the Middle East, Europe, Africa, Southeast Asia and southwest China.


      At WinPlus she leads global competency programs, leadership education and partnerships with universities and international organizations.'
  - id: cedric-pan
    name: Cedric Pan
    initials: CP
    title: Co-Founder
    affiliation: MPP, Harvard Kennedy School · EdM, Harvard
    photo: /images/uploads/team/cedric-pan.jpg
    bio: 'Cedric Pan holds a Master in Public Policy from Harvard Kennedy School and a Master of Education from Harvard, and dual bachelor''s degrees in urban planning and economics
      from Peking University. He mentors in an MIT aerospace entrepreneurship program.


      He has held executive roles at a Silicon Valley autonomous-driving company, a multinational ride-sharing company and a Boston K-12 education technology company, and earlier worked
      with the Development Research Center of the State Council and China Development Bank.


      At WinPlus he leads admissions strategy, technology entrepreneurship and the research and internship programs.'
- id: advisors
  title: Academic & Industry Advisors
  intro: Distinguished faculty and leaders who open the doors of their institutions and fields to our students.
  people:
  - id: jeffrey-hoffman
    name: Jeffrey A. Hoffman
    initials: JH
    title: Professor of the Practice of Aerospace Engineering, MIT
    affiliation: Former NASA Astronaut
    photo: /images/uploads/team/jeff.jpg
    bio: 'Jeffrey A. Hoffman is Professor of the Practice of Aerospace Engineering at MIT and a former NASA astronaut with a Harvard PhD. He flew five Space Shuttle missions, logging
      over 1,211 hours in space, including the first Hubble servicing mission in 1993. He also served as deputy principal investigator for MOXIE, which demonstrated oxygen production
      from the Martian atmosphere aboard Perseverance.


      Through WinPlus, he has led visits to MIT AeroAstro and explained Perseverance, crewed Shuttle operations and the Apollo program. Drawing on actual missions, he shows how instruments,
      spacecraft and astronauts work together under scientific, environmental and resource constraints.


      These examples connect physics, mechanical engineering, electronics and systems design. They help students distinguish interests in scientific research, hardware or mission coordination,
      while giving families concrete reference points for engineering preparation: applying knowledge, explaining design choices and contributing responsibly to a multidisciplinary team
      working toward a shared mission.'
  - id: daniel-e-hastings
    name: Daniel E. Hastings
    initials: DH
    title: Institute Professor, MIT
    affiliation: Former Dean for Undergraduate Education and AeroAstro Department Head
    photo: ''
    bio: 'Daniel E. Hastings is an Institute Professor, MIT’s highest faculty honor, with degrees from Oxford and MIT. His research covers spacecraft environments, propulsion and complex
      space systems. He has served as MIT’s undergraduate dean and AeroAstro head, leader of the Singapore–MIT research alliance, and Chief Scientist of the US Air Force.


      His teaching collaborations include the National University of Singapore and Asian students. In WinPlus sessions, he introduces space sustainability, systems engineering and manufacturing
      in Earth orbit, examining how missions coordinate resources, infrastructure and technical requirements over time.


      For families exploring engineering, these subjects explain the tradeoffs among performance, reliability, cost and subsystem coordination. Students can distinguish an interest in
      individual technologies from an interest in integrating complete missions. His experience in undergraduate education and international collaboration also provides context for the
      mathematical foundations, interdisciplinary learning and independent judgment required for university engineering study.'
  - id: le-cong
    name: Le Cong
    initials: LC
    title: Associate Professor of Pathology and Genetics, Stanford University
    affiliation: ''
    photo: ''
    bio: 'Le Cong is an Associate Professor of Pathology and Genetics at Stanford, with degrees from Tsinghua and Harvard. His research develops genome-engineering tools for gene and
      cell therapy and disease investigation. He received the National Human Genome Research Institute’s Genomic Innovator Award.


      His laboratory studies CRISPR, large gene insertion, single-cell analysis and stem-cell disease models. Projects such as CRISPR-GPT explore AI-assisted gene editing. Through WinPlus,
      he has led students to Stanford’s stem-cell research institute and introduced frontier research, connecting genetic changes with cellular function and disease.


      These encounters give students specific questions to pursue: how experiments test hypotheses, how computational methods support biology, and what evidence a biomedical application
      requires. For families considering biology, medicine or AI and life sciences, they clarify the preparation involved: biology and chemistry, data analysis, English-language scientific
      reading and careful interpretation of experimental results, alongside sustained curiosity about how living systems work.'
  - id: mike-medavoy
    name: Mike Medavoy
    initials: MM
    title: Hollywood Producer
    affiliation: Co-Founder of Phoenix Pictures
    photo: /images/uploads/team/mike.jpg
    bio: 'Mike Medavoy is a veteran Hollywood producer, co-founder of Phoenix Pictures and a UCLA graduate. His career spans talent representation, studio management and production.
      He co-founded Orion Pictures and held senior roles at United Artists and TriStar. His work includes Black Swan, Shutter Island, Zodiac and The Thin Red Line.


      Through WinPlus, he has led visits to a Hollywood production company and shared insights into filmmaking, the entertainment industry and talent representation. Students learn how
      stories become projects and how directors, actors, writers, producers and agents connect creative ideas with financing and audiences.


      For students interested in film, literature, performance or media, this provides a basis for distinguishing writing, visual storytelling, acting, production management and entertainment
      business. Families gain a clearer understanding of artistic preparation: developing original work, explaining creative choices and learning how to contribute to a collaborative
      production with defined creative, technical and organizational roles and responsibilities.'
  - id: tarik-carney
    name: Tarik Carney
    initials: TC
    title: United Nations Professional
    affiliation: International Peace and Security
    photo: /images/uploads/team/tarik.jpg
    bio: 'Tarik Carney is a United Nations professional in peace and security, with master’s degrees from Columbia SIPA and Sciences Po. He previously studied philosophy and Japanese
      at NYU and Sophia University. His UN experience includes civil affairs in the Central African Republic, child protection in Uganda, civilian protection in New York and analysis
      of Somalia.


      Through WinPlus, he has led visits to UN Headquarters, explaining the organization’s structure, values and mission while sharing stories from peacekeeping work. Students connect
      institutional responsibilities with the people affected by conflict and the coordination required for international cooperation.


      For students interested in politics, history, law or public service, this opens questions about implementation, evidence and competing needs. Families can see how reading, analytical
      writing, languages and cross-cultural understanding support substantive study of international affairs, and how policy analysis must engage with the needs, constraints and changing
      conditions experienced by different communities on the ground.'
  - id: steve-kelman
    name: Steve Kelman
    initials: SK
    title: Weatherhead Professor of Public Management, Emeritus, Harvard Kennedy School
    affiliation: ''
    photo: /images/uploads/team/steve.jpg
    bio: 'Steve Kelman is the Weatherhead Professor of Public Management, Emeritus, at Harvard Kennedy School. He earned his undergraduate degree and PhD in Government at Harvard. His
      research examines public management, policy and organizational change. From 1993 to 1997, he led the Office of Federal Procurement Policy within the US Office of Management and
      Budget. His books include Unleashing Change.


      Through WinPlus, he has led visits to Harvard Kennedy School and discussed US–China relations, international affairs and American governance, connecting current events with how
      governments organize, decide and implement policy.


      These discussions help families distinguish political science, international relations and public management through concrete questions about institutions and their responsibilities.
      Students can investigate who makes decisions, how countries interact and why public organizations perform differently. Comparing policy objectives, implementation conditions and
      outcomes encourages evidence-based judgment, providing a practical foundation for analytical reading, research and writing across the humanities and social sciences.'
- id: admissions
  title: Academic Planning & Admissions Mentors
  intro: The mentors who guide each student's roadmap, research and applications.
  people:
  - id: rachel-morgan
    name: Rachel Morgan
    initials: RM
    title: Optical Scientist at NASA Ames Research Center
    affiliation: MIT PhD in Aerospace Engineering
    photo: /images/uploads/team/rachel.jpg
    bio: 'Rachel Morgan is an optical scientist conducting research at NASA Ames, with undergraduate qualifications in aerospace engineering and physics and an MS and PhD from MIT. She
      applies integrated photonics to instruments for detecting Earth-like exoplanets, with research experience at JPL and MIT Lincoln Laboratory.


      At WinPlus, she advises aerospace, mechanical and electrical engineering applicants and mentors an eight-week space-telescope project. Students compare missions, define scientific
      objectives and set requirements for aperture, field of view, detectors, orbit and stability. They develop optical calculations, ray-tracing simulations and mechanical CAD or physical
      models.


      Required outputs include a mission-design report, models and a design-review presentation explaining how optical and mechanical choices interact. Morgan has helped students gain
      admission to MIT, Carnegie Mellon and the University of Illinois Urbana-Champaign. The project gives families tangible evidence of students’ interests in computation, modeling
      or hardware and their ability to justify engineering decisions.'
  - id: hannah-tomio
    name: Hannah Tomio
    initials: HT
    title: Postdoctoral Researcher in Laser Physics, University of Bern
    affiliation: MIT PhD
    photo: ''
    bio: 'Hannah Tomio is a laser-physics postdoctoral researcher at the University of Bern with an MIT aerospace PhD. She studied electrical and computer engineering at Carnegie Mellon
      and earned a master’s at Tohoku University. Her experience includes NASA Goddard, JPL and Boeing.


      At WinPlus, she advises aerospace, mechanical and electrical engineering applicants and mentors an eight-week satellite-constellation design project. Using Starlink as a case study,
      students examine orbital altitude, inclination, period, coverage and revisit time. They use NASA’s GMAT to simulate orbits and compare satellite numbers and arrangements for a
      chosen communication mission.


      The course also compares radio and optical communications, introduces key components and develops a simplified link budget. The final paper or portfolio includes requirements,
      constellation architecture, simulations, a network diagram and design justifications, followed by a presentation. Families can see how students apply physics, computing and electronics
      to parameter selection, modeling and engineering reasoning.'
  - id: josh-guo
    name: Josh Guo
    initials: JG
    title: Yale Graduate
    affiliation: Deloitte Professional · Public Policy and Social Sciences
    photo: ''
    bio: 'Josh Guo graduated from Yale with Distinction in Major and has experience at Deloitte. He interned with the White House Council on Environmental Quality and submitted written
      testimony to the Connecticut legislature. His cultural-preservation work with Yunnan’s Bulang community involved interviews, film, music documentation and writing.


      At WinPlus, he advises undergraduate, master’s and doctoral applicants in economics, politics, philosophy, law-related fields and other humanities and social sciences. He also
      serves as a Yale undergraduate admissions interviewer and has helped students gain admission to Harvard, Yale and Stanford.


      His background illustrates how social concerns become academic questions through economic, political, ethical or legal analysis. Reading, interviews, source comparison and evidence-based
      writing can develop those questions into substantive projects. For families, these activities offer concrete preparation beyond general interests, while interview practice asks
      students to explain what they investigated, why they made particular choices and how their understanding changed.'
  - id: changfan-lin
    name: Changfan Lin
    initials: CL
    title: Postdoctoral Fellow, Caltech
    affiliation: PhD, Cornell University
    photo: ''
    bio: 'Changfan Lin is a postdoctoral fellow in Caltech’s Gradinaru Laboratory, with degrees from Tsinghua and Cornell. His doctoral work included resolving a circadian-clock protein
      complex by cryo-EM. He now engineers AAV vectors to improve gene-delivery targeting and safety.


      At WinPlus, he advises undergraduate, master’s and doctoral applicants in biology and ecology, helping students gain admission to Caltech and Cornell. His eight-week gene-therapy
      course covers gene editing and delivery, AAV capsids, the blood–brain barrier, receptor recognition and directed evolution. Research papers illustrate limitations in translating
      animal findings to humans.


      Students use Python to analyze sequencing data from real AAV selection experiments, count variants, calculate enrichment and visualize results. A required Discovery Report explains
      methods, findings and interpretation; a literature review is optional. This combines biology, scientific reading and computation, helping students support conclusions with data
      while understanding the further validation required before experimental findings become clinical applications.'
  - id: claire-yoo
    name: Claire Yoo
    initials: CY
    title: Integrative Biology Undergraduate, Harvard
    affiliation: Co-Director of Engagement, Harvard Undergraduate OpenBio
    photo: ''
    bio: 'Claire Yoo is a Harvard integrative biology undergraduate and Co-Director of Engagement at Harvard Undergraduate OpenBio Laboratory. Through Harvard’s PRISE program, she joined
      the Jost Lab for microbiology research. She has also participated in botanical research associated with the Harvard University Herbaria and scientific outreach to younger students.


      At WinPlus, she advises undergraduate applicants interested in medicine, neuroscience and related life sciences. She has led learning visits connected with Harvard’s life-science
      and medical-school environments and helped students gain undergraduate admission to Harvard and Stanford.


      As a current undergraduate, she offers a close view of how coursework, laboratories and reading refine academic interests. The usual US medical pathway follows undergraduate study,
      so younger students can first explore biology, neuroscience and health-related questions. Her experience helps families understand undergraduate research and premedical preparation,
      while encouraging students to distinguish an interest in a medical career from enjoyment of specific scientific work.'
  - id: anhphu-nguyen
    name: AnhPhu Nguyen
    initials: AN
    title: Technology Entrepreneur
    affiliation: Co-Founder of MIRA · Studied at Harvard University
    photo: ''
    bio: 'AnhPhu Nguyen is a technology entrepreneur and co-founder of smart-glasses company MIRA. He studied Human Augmentation at Harvard, connecting computing, engineering and human–computer
      interaction. His early phone-repair business was featured by Harvard’s engineering school, and he helped establish an AR/VR developers’ club to explore wearables and interactive
      technology.


      At WinPlus, he advises undergraduate applicants in computer science and AI, leads learning visits to Harvard’s engineering school and has helped students gain undergraduate admission
      to Harvard and Stanford. His experience links device repair and prototyping with user needs and product development.


      For families, this offers a practical way to distinguish interests in algorithms, software, intelligent hardware and interaction design. Students can build around a defined user
      problem, test and revise prototypes, and explain design tradeoffs. These records help parents assess technical understanding and sustained improvement, while giving students evidence
      and reasoning to discuss alongside a finished product.'
  - id: vania-shi
    name: Vania Shi
    initials: VS
    title: Founder, Court Square Advisors
    affiliation: Master of Finance, MIT Sloan
    photo: ''
    bio: 'Vania Shi founded Court Square Advisors, a New York strategy and operations advisory firm. She holds a Master of Finance from MIT Sloan and an Honours Bachelor of Commerce
      from Queen’s University. Her decade-plus experience includes Morrison and Altman Solon, covering growth strategy, commercial due diligence, operational improvement and capital
      formation.


      At WinPlus, she advises undergraduate business applicants and candidates for MBA, finance and business-analytics master’s programs. She has led visits to MIT Sloan and helped applicants
      gain admission to Harvard Business School, MIT Sloan and Wharton.


      For younger families, her background clarifies distinctions among finance, business analytics and management: capital and risk, data-informed operating decisions, and organizational
      strategy. MBA study belongs to a later stage; secondary-school students can begin with mathematics, statistics, economics reading, company research or small entrepreneurial projects.
      These experiences provide concrete evidence of interests before choosing an undergraduate pathway and longer-term business education, informed by practical exposure to companies
      and management.'
- id: industry
  title: Industry Internship Mentors
  intro: Engineers and researchers who lead our online research and internship programs.
  people:
  - id: yuan-yuan
    name: Yuan Yuan
    initials: YY
    title: Technology Professional
    affiliation: Experience at Meta and Bloomberg
    photo: /images/uploads/team/yuan.jpg
    bio: 'Yuan Yuan has professional experience at Meta and Bloomberg and studied at Columbia’s engineering school. Yuan’s public technical work includes a CppCon 2024 poster on behavior-driven
      development for a microservices-based algorithmic trading system, connecting business requirements, system behavior and software testing.


      Through WinPlus, Yuan has led students to Meta’s New York offices, introducing product design, workplace culture, collaboration and the professional environment. Students connect
      familiar digital products with the technical teams, user needs and development processes behind them.


      This experience provides a basis for comparing software engineering, product design and data-related interests. Students can investigate a familiar product: whom it serves, what
      problem it solves, which features could improve and how to evaluate results. For families, observations and product analysis after the visit offer evidence of curiosity and reasoning,
      helping students turn workplace exposure into a more focused learning plan or project question.'
  - id: sijie-tian
    name: Sijie Tian
    initials: ST
    title: Artificial Intelligence Mentor
    affiliation: Meta Background
    photo: ''
    bio: 'Sijie Tian has a Meta background and mentors WinPlus’s six-week AI Agent from 0 to 1 course for high school students with beginner or intermediate programming experience. Students
      build a working study assistant, research helper or data-cleaning agent.


      Starting with language-model API calls and prompt experiments, they develop a loop that observes, plans, acts and stops under defined conditions. They connect tools, specify inputs
      and outputs, and record successful and failed calls. Training includes sandbox boundaries, command allowlists, file restrictions, timeouts and API-key handling.


      Students assess performance through five to ten evaluation tasks, analyze execution traces and improve a weakness. Required outputs include code, a demonstration, evaluation results,
      execution logs and a reflection report. These show parents whether students understand tool use, debugging and testing. Students must explain how their agent works, what evidence
      supports its performance and where its limitations remain.'
  - id: harper-gu
    name: Harper Gu
    initials: HG
    title: Industry Internship Mentor
    affiliation: Apple Background
    photo: ''
    bio: 'Harper Gu has an Apple background and mentors WinPlus’s eight-week AI-assisted coding course. High school students use Claude and Claude Code to design, build and publish software
      while maintaining a portfolio website and weekly learning records.


      Students learn HTML, CSS, JavaScript, developer tools, the terminal and Git, then deploy to GitHub Pages. They practice specifying features, reviewing AI-generated changes and
      testing whether to accept, revise or reverse them. Projects follow four directions: creative coding, data visualization, web applications or interactive essays, connecting technical
      learning with artistic interests or practical questions.


      Later work covers scope, peer testing and reliability on mobile devices, slow connections and empty inputs. Final requirements include a live portfolio, code repository, meaningful
      version history, seven journals and a presentation. Students explain AI’s contribution and their own decisions, giving families evidence of both a finished product and the understanding
      behind its development.'
  - id: terry-zhang
    name: Terry Zhang
    initials: TZ
    title: Technology and Data Research Mentor
    affiliation: Microsoft and Google Background
    photo: ''
    bio: 'Terry Zhang, also known as Dehao Terry Zhang, has Microsoft and Google experience and pursued graduate study at Michigan’s Rackham Graduate School. He co-authored PNAS research
      analyzing employee office attendance in relation to managers and teammates.


      At WinPlus, he mentors a Microsoft quarterly-revenue forecasting project using public financial data. Across eight meetings, students clean data, explore trends and study seasonality,
      lagged variables and rolling averages. They use Python to compare ARIMA and ETS models, separate training and test data, and evaluate errors using MAE, RMSE and MAPE.


      Further analysis examines revenue drivers and share-price relationships while distinguishing correlation from causation. Required outputs include annotated code or a notebook,
      predicted-versus-actual charts, an analytical report and a presentation. For students considering mathematics, computing, finance or business analytics, the project connects statistics
      with a concrete business problem. Parents can assess progress through data handling, model comparisons and explanations of errors.'
  - id: yinong-liu
    name: Yinong Liu
    initials: YL
    title: WinPlus Mentor in AI Product Innovation for Fashion and Retail
    affiliation: ''
    photo: ''
    bio: 'Yinong Liu mentors WinPlus’s AI Product Innovation for Luxury Retail course. Across eight sessions, students use public information, customer observation and competitor research
      to examine e-commerce, appointments, product discovery, styling and after-sales service.


      They map customer journeys, identify five pain points and select one problem, comparing three to five solutions. They match needs with conversational AI, recommendations or visual
      search, then define users, a minimum viable product, essential features and success criteria. Prototypes use Figma, Canva or slides without requiring advanced programming.


      Students consider privacy, incorrect AI responses, brand tone and feasibility, proposing measures such as satisfaction, conversion or efficiency. A final proposal and five-to-seven-minute
      pitch present evidence, competitor analysis, the prototype and business value. The project connects fashion, business and technology through research and design reasoning, giving
      families concrete evidence of how students investigate users, choose appropriate tools and justify product decisions.'
  - id: damir-kozhanbayev
    name: Damir Kozhanbayev
    initials: DK
    title: Research Fellow, Harvard Project on Workforce
    affiliation: Former UNICEF Education Officer
    photo: ''
    bio: 'Damir Kozhanbayev is a Research Fellow with Harvard’s Project on Workforce. He previously worked in education and knowledge innovation at UNICEF Kazakhstan and entered Harvard’s
      Graduate School of Education as an Urban Scholars Fellow in Learning Design, Innovation, and Technology.


      At WinPlus, he mentors an eight-week UN and global-challenges research course. Students select questions in areas such as children’s rights, education, gender equality or climate,
      learning about UN institutions and Sustainable Development Goals. They prepare an annotated bibliography using five to seven academic sources and two to three UN reports, then
      compare two to three cases.


      Students develop three to five evidence-based recommendations addressing feasibility and implementation. Final requirements include a ten-to-fifteen-page paper, two-page policy
      brief and ten-to-fifteen-minute presentation. These demonstrate source evaluation, comparative analysis and policy communication, while providing material for later Model UN or
      research presentations. Families can see how social concerns become structured inquiry.'
note: Selected members of the WinPlus team. Titles and affiliations describe each person's professional background and do not imply that their institution endorses WinPlus.
